        <li><a href="mahjong-culture.html" data-i18n="nav.culture">🀄 麻将文化</a></li>

      </ul>
      <div class="sidebar-controls">
        <div class="sc-row">
          <button class="weather-btn sidebar-btn" data-weather="off" title="关闭特效">✕</button>
          <button class="weather-btn sidebar-btn" data-weather="sunny" title="晴天">☀</button>

          <button class="sidebar-btn" id="music-toggle" title="播放/暂停">🔈</button>

<div class="content">

  

  <div class="page-header"><h2>📈 统计看板</h2></div>
  <!-- Filters -->
  <div class="card fade-in-section" style="padding:12px 16px;">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
      <label style="font-size:13px;color:var(--text-secondary);">选择玩家：</label>
      <select class="form-input" id="player-select" style="width:auto;min-width:120px;" onchange="updatePlayerStats()">
        <option value="">-- 全部排行 --</option>
      </select>
      <label style="font-size:13px;color:var(--text-secondary);margin-left:8px;">月份：</label>
      <select class="form-input" id="month-select" style="width:auto;min-width:120px;" onchange="updateMonthStats()">
        <option value="">-- 全部 --</option>
      </select>
    </div>
  </div>
  <!-- Monthly summary -->
  <div class="card fade-in-section" id="month-summary" style="display:none;">
    <div class="card-title">📅 月度汇总 <span id="month-label" style="font-weight:400;font-size:13px;color:var(--text-tertiary);"></span></div>
    <div class="stats-row" id="month-stats-grid" style="margin-bottom:0;"></div>
    <div style="margin-top:12px;">
      <canvas id="month-chart" height="180"></canvas>
    </div>
  </div>
  <!-- Player detail -->
  <div class="card fade-in-section" id="player-detail" style="display:none;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;text-align:center;" id="player-stats-grid"></div>
    <div style="margin-top:16px;">
      <canvas id="trend-chart" height="200"></canvas>
    </div>
  </div>
  <!-- Ranking chart -->
  <div class="card fade-in-section">
    <div class="card-title">🏆 胜率排行</div>
    <div class="chart-wrap"><canvas id="rank-chart" height="250"></canvas></div>
  </div>
  <!-- All players comparison -->
  <div class="card fade-in-section">
    <div class="card-title">📊 净胜总额对比</div>
    <div class="chart-wrap"><canvas id="net-chart" height="250"></canvas></div>
  </div>
</div>
<script src="../../js/i18n.js"></script>
<audio id="bg-music" loop src="../../music/background.mp3"></audio>
<script src="../js/i18n-mj.js"></script>
<script src="../js/main.js"></script>
<script>
var allRecords = [];
var charts = {};

function playerName(p) { return typeof p === 'string' ? p : (p ? p.name : ''); }
function playerScore(p) { return typeof p === 'object' && p && p.score !== undefined ? p.score : 0; }
(async function init() {
  allRecords = await api.get('mj_records') || [];
  populatePlayerSelect();
  populateMonthSelect();
  renderRankingCharts();
  // Auto-show logged-in player
  var loggedIn = localStorage.getItem('mj_player');
  if (loggedIn) {
    var sel = document.getElementById('player-select');
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === loggedIn) {
        sel.value = loggedIn;
        updatePlayerStats();
        break;
      }
    }
  }
})();

function populatePlayerSelect() {
  var select = document.getElementById('player-select');
  var names = {};
  allRecords.forEach(function(r) {
    (r.players || []).forEach(function(p) {
      if (p.name) names[p.name] = true;
    });
  });
  var sorted = Object.keys(names).sort();
  sorted.forEach(function(name) {
    var opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    select.appendChild(opt);
  });
}

function getPlayerStats(name) {
  var total = 0, wins = 0, losses = 0, maxWin = 0, maxLose = 0, streak = 0, bestStreak = 0, curStreak = 0;
  var trend = [];

  allRecords.forEach(function(r) {
    var found = null;
    (r.players || []).forEach(function(p) {
      if (playerName(p) === name) found = p;
    });
    if (!found) return;
    total += found.score;
    trend.push({ date: r.date, score: found.score });

    if (found.score > 0) { wins++; curStreak = curStreak > 0 ? curStreak + 1 : 1; }
    else if (found.score < 0) { losses++; curStreak = curStreak < 0 ? curStreak - 1 : -1; }
    else { curStreak = 0; }
    bestStreak = Math.max(bestStreak, Math.abs(curStreak));

    if (found.score > maxWin) maxWin = found.score;
    if (found.score < maxLose) maxLose = found.score;
  });

  return {
    total: total,
    wins: wins,
    losses: losses,
    games: wins + losses,
    winRate: (wins + losses) ? (wins / (wins + losses) * 100) : 0,
    maxWin: maxWin,
    maxLose: maxLose,
    bestStreak: bestStreak,
    trend: trend
  };
}

function updatePlayerStats() {
  var name = document.getElementById('player-select').value;
  var detail = document.getElementById('player-detail');
  if (!name) { detail.style.display = 'none'; return; }

  detail.style.display = 'block';
  var s = getPlayerStats(name);

  document.getElementById('player-stats-grid').innerHTML =
    '<div><div class="stat-num ' + (s.total >= 0 ? 'positive' : 'negative') + '">' + (s.total >= 0 ? '+' : '') + s.total + '</div><div class="stat-label">净胜</div></div>' +
    '<div><div class="stat-num">' + s.games + '</div><div class="stat-label">总场次</div></div>' +
    '<div><div class="stat-num positive">' + s.wins + '</div><div class="stat-label">赢</div></div>' +
    '<div><div class="stat-num negative">' + s.losses + '</div><div class="stat-label">输</div></div>' +
    '<div><div class="stat-num">' + s.winRate.toFixed(1) + '%</div><div class="stat-label">胜率</div></div>' +
    '<div><div class="stat-num positive">' + s.maxWin + '</div><div class="stat-label">单场最高赢</div></div>' +
    '<div><div class="stat-num negative">' + s.maxLose + '</div><div class="stat-label">单场最高输</div></div>' +
    '<div><div class="stat-num">' + s.bestStreak + '</div><div class="stat-label">最长连胜</div></div>';

  // Trend chart
  if (charts.trend) charts.trend.destroy();
  if (s.trend.length) {
    var ctx = document.getElementById('trend-chart').getContext('2d');
    charts.trend = new Chart(ctx, {
      type: 'line',
      data: {
        labels: s.trend.map(function(t) { return t.date || ''; }),
        datasets: [{
          label: name + ' 每场输赢',
          data: s.trend.map(function(t) { return t.score; }),
          borderColor: '#c4493a',
          backgroundColor: 'rgba(196,73,58,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 4,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: 'rgba(0,0,0,0.05)' } },
          x: { grid: { display: false } }
        }
      }
    });
  }
}

function populateMonthSelect() {
  var sel = document.getElementById('month-select');
  var months = {};
  allRecords.forEach(function(r) {
    if (r.date) {
      var m = r.date.substring(0, 7);
      months[m] = true;
    }
  });
  var sorted = Object.keys(months).sort().reverse();
  sorted.forEach(function(m) {
    var opt = document.createElement('option');
    opt.value = m;
    var parts = m.split('-');
    opt.textContent = parts[0] + '年' + parts[1] + '月';
    sel.appendChild(opt);
  });
}

function updateMonthStats() {
  var month = document.getElementById('month-select').value;
  var summary = document.getElementById('month-summary');
  if (!month) { summary.style.display = 'none'; return; }

  summary.style.display = 'block';
  document.getElementById('month-label').textContent = month.replace('-', '年') + '月';

  var monthRecords = allRecords.filter(function(r) {
    return r.date && r.date.substring(0, 7) === month;
  });

  var games = monthRecords.length;
  var totalFlow = 0;
  var playerTotals = {};
  monthRecords.forEach(function(r) {
    (r.players || []).forEach(function(p) {
      totalFlow += Math.abs(p.score);
      playerTotals[p.name] = (playerTotals[p.name] || 0) + p.score;
    });
  });
  totalFlow = totalFlow / 2; // each game flow

  var sorted = Object.keys(playerTotals).sort(function(a, b) {
    return playerTotals[b] - playerTotals[a];
  });
  var topWinner = sorted.length ? sorted[0] + ' (' + playerTotals[sorted[0]] + ')' : '-';
  var topLoser = sorted.length ? sorted[sorted.length - 1] + ' (' + playerTotals[sorted[sorted.length - 1]] + ')' : '-';

  document.getElementById('month-stats-grid').innerHTML =
    '<div class="stat-card"><div class="stat-num">' + games + '</div><div class="stat-label">场次</div></div>' +
    '<div class="stat-card"><div class="stat-num positive">' + totalFlow.toFixed(0) + '</div><div class="stat-label">总流水</div></div>' +
    '<div class="stat-card"><div class="stat-num positive">' + topWinner + '</div><div class="stat-label">本月赢家</div></div>' +
    '<div class="stat-card"><div class="stat-num negative">' + topLoser + '</div><div class="stat-label">本月输家</div></div>';

  // Month chart: bar chart of each player's net score this month
  if (charts.month) charts.month.destroy();
  if (sorted.length) {
    var ctx = document.getElementById('month-chart').getContext('2d');
    charts.month = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: sorted,
        datasets: [{
          label: '本月净胜',
          data: sorted.map(function(n) { return playerTotals[n]; }),
          backgroundColor: sorted.map(function(n) {
            return playerTotals[n] >= 0 ? 'rgba(90,158,111,0.7)' : 'rgba(201,74,74,0.7)';
          }),
          borderRadius: 6,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { grid: { color: 'rgba(0,0,0,0.05)' } },
          x: { grid: { display: false } }
        }
      }
    });
  }
}

function renderRankingCharts() {
  // Win rate chart
  var names = {};
  allRecords.forEach(function(r) {
    (r.players || []).forEach(function(p) {
      if (!names[p.name]) names[p.name] = { total: 0, wins: 0, games: 0, net: 0 };
      var pn = playerName(p); var ps = playerScore(p); names[pn].total += ps; names[pn].net += ps; names[pn].games++; if (ps > 0) names[pn].wins++;
    });
  });

  var sorted = Object.keys(names).sort(function(a, b) {
    return (names[b].wins / names[b].games) - (names[a].wins / names[a].games);
  });

  var ctx1 = document.getElementById('rank-chart').getContext('2d');
  charts.rank = new Chart(ctx1, {
    type: 'bar',
    data: {
      labels: sorted.map(function(n) { return n; }),
      datasets: [{
        label: '胜率 (%)',
        data: sorted.map(function(n) { return (names[n].wins / names[n].games * 100).toFixed(1); }),
        backgroundColor: sorted.map(function(_, i) {
          var colors = ['#c4493a', '#d66a4a', '#e08b5a', '#e8a86a', '#d4a97a', '#b8895e'];
          return colors[i % colors.length];
        }),
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
      },
      scales: {
        y: { beginAtZero: true, max: 100, grid: { color: 'rgba(0,0,0,0.05)' } },
        x: { grid: { display: false } }
      }
    }
  });

  // Net score comparison
  var netSorted = Object.keys(names).sort(function(a, b) { return names[b].net - names[a].net; });
  var ctx2 = document.getElementById('net-chart').getContext('2d');
  charts.net = new Chart(ctx2, {
    type: 'bar',
    data: {
      labels: netSorted,
      datasets: [{
        label: '净胜总额',
        data: netSorted.map(function(n) { return names[n].net; }),
        backgroundColor: netSorted.map(function(n) { return names[n].net >= 0 ? 'rgba(46,125,50,0.7)' : 'rgba(198,40,40,0.7)'; }),
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { grid: { color: 'rgba(0,0,0,0.05)' } },
        x: { grid: { display: false } }
      }
    }
  });
}
</script>

<script>
(function() {
  var theme = localStorage.getItem('xie_theme') || 'light';
  var btn = document.getElementById('theme-btn');
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    if (btn) btn.textContent = '🌙';
  } else {
    if (btn) btn.textContent = '☀️';
  }
})();
function toggleTheme() {
  var html = document.documentElement;
  var btn = document.getElementById('theme-btn');
  var isDark = html.getAttribute('data-theme') === 'dark';
  if (isDark) {
    html.removeAttribute('data-theme');
    localStorage.setItem('xie_theme', 'light');
    if (btn) btn.textContent = '☀️';
  } else {
    html.setAttribute('data-theme', 'dark');
    localStorage.setItem('xie_theme', 'dark');
    if (btn) btn.textContent = '🌙';
  }
}
</script>
