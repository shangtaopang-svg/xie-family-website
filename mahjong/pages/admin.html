<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 - 宁海三中98届</title>
  <link rel="stylesheet" href="../css/style.css?v=2">
  <style>
    .admin-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .admin-section h3 { font-family: var(--font-title); font-size:16px; margin-bottom:12px; }
    .data-count { font-size:24px; font-weight:700; color:var(--accent-orange); }
    .data-label { font-size:12px; color:var(--text-tertiary); }
    @media(max-width:700px){ .admin-grid{grid-template-columns:1fr; } }
  </style>
</head>
<body>
<canvas id="weather-canvas" class="weather-canvas"></canvas>
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo"><div class="logo-icon">🀄</div><div class="logo-text"><h1>宁海三中98届</h1><small>麻将交流群</small></div></a>
    <button class="nav-toggle">☰</button>
    <nav class="main-nav">
      <ul>
        <li><a href="../index.html">🏠 首页</a></li>
        <li><a href="sessions.html">🀄 组局</a></li>
        <li><a href="records.html">📊 战绩</a></li>
        <li><a href="stats.html">📈 统计</a></li>
        <li><a href="mahjong-culture.html">🀄 麻将文化</a></li>
        <li><a href="posts.html">📝 心得</a></li>
        <li><a href="profile.html">👤 个人中心</a></li>
        <li><a href="admin.html" class="active" style="color:var(--accent-orange);">⚙️ 管理后台</a></li>
      </ul>
      <div class="sidebar-controls">
        <div class="sc-row">
          <button class="sidebar-btn" id="theme-btn" onclick="toggleTheme()">☀️</button>
          <button class="sidebar-btn" id="auth-btn" onclick="showLoginOverlay()">👤</button>
        </div>
      </div>
    </nav>
  </div>
</header>
<div class="content">
  <div class="page-header"><h2>⚙️ 网站管理</h2></div>

  <!-- Login gate -->
  <div class="card" id="admin-login-gate" style="text-align:center;padding:30px;">
    <div style="font-size:48px;margin-bottom:8px;">🔐</div>
    <p style="color:var(--text-tertiary);">管理员身份验证</p>
    <div class="form-group" style="max-width:300px;margin:12px auto;">
      <input class="form-input" type="password" id="admin-pwd" placeholder="请输入管理密码"
        onkeydown="if(event.key==='Enter')adminLogin()">
    </div>
    <div id="admin-login-msg" style="color:var(--accent-red);font-size:13px;margin-bottom:8px;display:none;"></div>
    <button class="btn btn-primary" onclick="adminLogin()">进入管理后台</button>
  </div>

  <!-- Admin Panel -->
  <div id="admin-panel" style="display:none;">
    <!-- Data Overview -->
    <div class="card" style="text-align:center;padding:16px;">
      <strong>📊 网站数据概览</strong>
      <div style="display:flex;justify-content:center;gap:40px;margin-top:10px;" id="data-overview">
        <div><div class="data-count" id="d-records">-</div><div class="data-label">牌局</div></div>
        <div><div class="data-count" id="d-players">-</div><div class="data-label">选手</div></div>
        <div><div class="data-count" id="d-photos">-</div><div class="data-label">照片</div></div>
        <div><div class="data-count" id="d-videos">-</div><div class="data-label">视频</div></div>
        <div><div class="data-count" id="d-posts">-</div><div class="data-label">心得</div></div>
        <div><div class="data-count" id="d-passwords">-</div><div class="data-label">密码</div></div>
      </div>
    </div>

    <div class="admin-grid">
      <!-- Reset All Passwords -->
      <div class="card admin-section">
        <h3>🔑 重置选手密码</h3>
        <p style="font-size:13px;color:var(--text-tertiary);margin-bottom:8px;">将所有选手密码重置为 123456</p>
        <button class="btn btn-outline btn-sm" onclick="resetPasswords()">重置所有密码</button>
        <div id="pwd-reset-msg" style="font-size:13px;margin-top:6px;"></div>
      </div>

      <!-- Data Export -->
      <div class="card admin-section">
        <h3>📦 数据管理</h3>
        <div style="display:flex;flex-direction:column;gap:6px;">
          <button class="btn btn-outline btn-sm" onclick="exportData()">📥 导出所有数据</button>
          <button class="btn btn-danger btn-sm" onclick="clearAllRecords()">🗑️ 清空所有牌局</button>
        </div>
        <div id="data-msg" style="font-size:13px;margin-top:6px;"></div>
      </div>
    </div>
  </div>
</div>
<footer class="site-footer">© 2026 宁海三中98届麻将交流群</footer>

<audio id="bg-music" loop src="../../music/background.mp3"></audio>
<script src="../js/i18n-mj.js"></script>
<script src="../js/main.js"></script>
<script>
// Admin password (simple, same as xie-family site pattern)
var ADMIN_PWD = 'admin888';

function adminLogin() {
  var pwd = document.getElementById('admin-pwd').value;
  var msg = document.getElementById('admin-login-msg');
  if (pwd === ADMIN_PWD) {
    document.getElementById('admin-login-gate').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    loadDataOverview();
  } else {
    msg.textContent = '密码错误';
    msg.style.display = 'block';
  }
}

async function loadDataOverview() {
  try {
    var records = await api.get('mj_records') || [];
    var posts = await api.get('mj_posts') || [];
    var friendship = await api.get('mj_friendship') || {videos:[],photos:[]};
    var passwords = await api.get('passwords') || {};
    var players = {};
    records.forEach(function(r) { r.players.forEach(function(p) { if (p.name) players[p.name] = true; }); });
    document.getElementById('d-records').textContent = records.length;
    document.getElementById('d-players').textContent = Object.keys(players).length;
    document.getElementById('d-photos').textContent = (friendship.photos||[]).length;
    document.getElementById('d-videos').textContent = (friendship.videos||[]).length;
    document.getElementById('d-posts').textContent = posts.length;
    document.getElementById('d-passwords').textContent = Object.keys(passwords).length;
  } catch(e) { console.warn(e); }
}

async function resetPasswords() {
  if (!confirm('确定将所有选手密码重置为 123456？')) return;
  var msg = document.getElementById('pwd-reset-msg');
  try {
    var passwords = {};
    (window.DEFAULT_PLAYERS || []).forEach(function(name) {
      passwords[name] = sha256('123456');
    });
    await api.save('passwords', passwords);
    msg.textContent = '✅ 已重置 ' + Object.keys(passwords).length + ' 人的密码为 123456';
    msg.style.color = 'var(--accent-green)';
  } catch(e) {
    msg.textContent = '❌ 重置失败';
    msg.style.color = 'var(--accent-red)';
  }
}

function exportData() {
  var msg = document.getElementById('data-msg');
  Promise.all([
    api.get('mj_records'),
    api.get('mj_posts'),
    api.get('mj_friendship'),
    api.get('passwords')
  ]).then(function(results) {
    var data = { records: results[0], posts: results[1], friendship: results[2], passwords: results[3] };
    var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mahjong-data-' + fmtDate(new Date()) + '.json';
    a.click();
    msg.textContent = '✅ 数据已导出';
    msg.style.color = 'var(--accent-green)';
  }).catch(function() {
    msg.textContent = '❌ 导出失败';
    msg.style.color = 'var(--accent-red)';
  });
}

function clearAllRecords() {
  if (!confirm('⚠️ 确定要清空所有牌局记录？此操作不可撤销！')) return;
  if (!confirm('再次确认：真的要删除所有数据吗？')) return;
  var msg = document.getElementById('data-msg');
  api.save('mj_records', []).then(function() {
    msg.textContent = '✅ 牌局已清空';
    msg.style.color = 'var(--accent-green)';
    loadDataOverview();
  }).catch(function() {
    msg.textContent = '❌ 清空失败';
    msg.style.color = 'var(--accent-red)';
  });
}

document.querySelector('.nav-toggle')?.addEventListener('click',function(){document.querySelector('.main-nav').classList.toggle('open');});
</script>
</body>
</html>
