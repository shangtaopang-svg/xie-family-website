<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心得 - 宁海三中98届麻将交流群</title>
  <link rel="stylesheet" href="../css/style.css?v=2">
</head>
<body>
<canvas id="weather-canvas" class="weather-canvas"></canvas>
<!-- ===== Sidebar ===== -->
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="logo">
      <div class="logo-icon">🀄</div>
      <div class="logo-text">
        <h1>宁海三中98届</h1>
        <small>麻将交流群</small>
      </div>
    </a>
    <button class="nav-toggle" aria-label="菜单">☰</button>
    <nav class="main-nav">
      <ul>
        <li><a href="../index.html" data-i18n="nav.home">🏠 首页</a></li>
        <li><a href="sessions.html" data-i18n="nav.sessions">🀄 组局</a></li>
        <li><a href="records.html" class="active" data-i18n="nav.records">📊 战绩</a></li>
        <li><a href="stats.html" data-i18n="nav.stats">📈 统计</a></li>
        
        <li><a href="mahjong-culture.html" data-i18n="nav.culture">🀄 麻将文化</a></li>
        <li><a href="posts.html" data-i18n="nav.posts">📝 心得</a></li>
      </ul>
      <div class="sidebar-controls">
        <div class="sc-row">
          <button class="weather-btn sidebar-btn" data-weather="off" title="关闭特效">✕</button>
          <button class="weather-btn sidebar-btn" data-weather="sunny" title="晴天">☀</button>
          <button class="weather-btn sidebar-btn" data-weather="rain" title="下雨">🌧</button>
          <button class="weather-btn sidebar-btn" data-weather="snow" title="下雪">❄</button>
          <button class="weather-btn sidebar-btn" data-weather="meteor" title="流星">☄</button>
        </div>
        <div class="sc-row">
          <button class="sidebar-btn" id="music-prev" title="上一首">⏮</button>
          <button class="sidebar-btn" id="music-toggle" title="播放/暂停">🔈</button>
          <button class="sidebar-btn" id="music-next" title="下一首">⏭</button>
        </div>
        <div class="sc-row">
          <button class="sidebar-btn" id="theme-btn" onclick="toggleTheme()" title="切换主题">☀️</button>
          <button class="sidebar-btn lang-btn" id="lang-btn" onclick="toggleMjLang()" title="中英文切换">EN</button>
          <button class="sidebar-btn" id="auth-btn" onclick="showLoginOverlay()" title="登录">👤</button>
        </div>
      </div>
    </nav>
  </div>
</header>

<div class="content">

  

  <div class="page-header">
    <h2>📝 麻将心得</h2>
    <button class="btn btn-primary" onclick="showPostForm()">+ 写心得</button>
  </div>
  <!-- Posts list -->
  <div id="posts-container">
    <div class="empty-state"><div class="icon">📝</div>加载中...</div>
  </div>
  <!-- Post Modal -->
  <div class="modal-overlay" id="post-modal">
    <div class="modal">
      <h3 style="margin-bottom:16px;" id="post-modal-title">✍️ 写心得</h3>
      <form onsubmit="savePost(event)">
        <input type="hidden" id="post-edit-id">

        <div class="form-group">
          <label>标题</label>
          <input class="form-input" id="post-title" placeholder="给心得起个标题" required>
        </div>
        <div class="form-group">
          <label>作者</label>
          <input class="form-input" id="post-author" placeholder="你的名字" required>
        </div>
        <div class="form-group">
          <label>内容</label>
          <textarea class="form-textarea" id="post-content" placeholder="分享你的麻将心得、技巧、趣事..." rows="6" required></textarea>
        </div>
        <div class="form-group">
          <label>标签（用空格分隔，如 #技巧 #趣事）</label>
          <input class="form-input" id="post-tags" placeholder="#技巧 #宁海麻将">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;">
          <button type="button" class="btn btn-outline" onclick="closePostModal()">取消</button>
          <button type="submit" class="btn btn-primary">发布</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="../../js/i18n.js"></script>
<audio id="bg-music" loop src="../../music/background.mp3"></audio>
<script src="../js/i18n-mj.js"></script>
<script src="../js/main.js"></script>
<script>
var allPosts = [];

(async function init() {
  allPosts = await api.get('mj_posts') || [];
  renderPosts(allPosts);
})();

function renderPosts(posts) {
  var container = document.getElementById('posts-container');
  if (!posts || !posts.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📝</div>还没有心得<br><small>点击「写心得」分享你的麻将故事</small></div>';
    return;
  }

  var sorted = posts.slice().sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
  container.innerHTML = sorted.map(function(p, i) {
    var realIdx = allPosts.indexOf(p);
    var tags = (p.tags || []).map(function(t) { return '<span class="post-tag">' + escapeHtml(t) + '</span>'; }).join('');
    var content = (p.content || '').replace(/\n/g, '<br>');
    return '<div class="card post-card">' +
      '<div class="post-title">' + escapeHtml(p.title || '无题') + '</div>' +
      '<div class="post-meta">' +
        '<span>✍️ ' + escapeHtml(p.author || '匿名') + '</span>' +
        '<span>📅 ' + fmtDate(p.date) + '</span>' +
      '</div>' +
      '<div class="post-content">' + content + '</div>' +
      (tags ? '<div class="post-tags">' + tags + '</div>' : '') +
      '<div class="post-actions">' +
        '<button class="btn btn-outline btn-sm" onclick="editPost(' + realIdx + ')">✎ 编辑</button>' +
        '<button class="btn btn-danger btn-sm" onclick="deletePost(' + realIdx + ')">🗑 删除</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function showPostForm() {
  document.getElementById('post-modal-title').textContent = '✍️ 写心得';
  document.getElementById('post-edit-id').value = '';
  document.getElementById('post-title').value = '';
  document.getElementById('post-author').value = '';
  document.getElementById('post-content').value = '';
  document.getElementById('post-tags').value = '';
  document.getElementById('post-modal').classList.add('open');
}

function closePostModal() {
  document.getElementById('post-modal').classList.remove('open');
}

function editPost(idx) {
  var p = allPosts[idx];
  if (!p) return;
  document.getElementById('post-modal-title').textContent = '✎ 编辑心得';
  document.getElementById('post-edit-id').value = idx;
  document.getElementById('post-title').value = p.title || '';
  document.getElementById('post-author').value = p.author || '';
  document.getElementById('post-content').value = p.content || '';
  document.getElementById('post-tags').value = (p.tags || []).join(' ');
  document.getElementById('post-modal').classList.add('open');
}

async function savePost(e) {
  e.preventDefault();
  var editId = document.getElementById('post-edit-id').value;
  var title = document.getElementById('post-title').value.trim();
  var author = document.getElementById('post-author').value.trim();
  var content = document.getElementById('post-content').value.trim();
  var tagsRaw = document.getElementById('post-tags').value.trim();

  if (!title || !author || !content) {
    showToast('请填写完整信息', 'error');
    return;
  }

  var tags = tagsRaw ? tagsRaw.split(/\s+/).filter(function(t) { return t; }) : [];
  var post = {
    title: title,
    author: author,
    content: content,
    tags: tags,
    date: fmtDate(new Date())
  };

  if (editId !== '') {
    allPosts[parseInt(editId)] = post;
  } else {
    allPosts.push(post);
  }

  try {
    await api.save('mj_posts', allPosts);
    showToast('发布成功 ✅');
    closePostModal();
    renderPosts(allPosts);
  } catch(e) {
    showToast('保存失败', 'error');
  }
}

async function deletePost(idx) {
  if (!confirm('确定删除这条心得？')) return;
  allPosts.splice(idx, 1);
  try {
    await api.save('mj_posts', allPosts);
    showToast('已删除');
    renderPosts(allPosts);
  } catch(e) {
    showToast('删除失败', 'error');
  }
}

document.getElementById('post-modal').addEventListener('click', function(e) {
  if (e.target === this) closePostModal();
});
</script>

<script>
(function() {
  var theme = localStorage.getItem('xie_theme') || 'light';
  var btn = document.getElementById('theme-btn');
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    if (btn) btn.textContent = '🌙';
  } else {
    if (btn) btn.textContent = '☀️';
  }
})();
function toggleTheme() {
  var html = document.documentElement;
  var btn = document.getElementById('theme-btn');
  var isDark = html.getAttribute('data-theme') === 'dark';
  if (isDark) {
    html.removeAttribute('data-theme');
    localStorage.setItem('xie_theme', 'light');
    if (btn) btn.textContent = '☀️';
  } else {
    html.setAttribute('data-theme', 'dark');
    localStorage.setItem('xie_theme', 'dark');
    if (btn) btn.textContent = '🌙';
  }
}
</script>

<script>document.querySelector('.nav-toggle')?.addEventListener('click',function(){document.querySelector('.main-nav').classList.toggle('open');});</script>

</div>

</body>
</html>
