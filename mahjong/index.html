<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🀄 宁海三中98届麻将交流群</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-wrap">
  <header class="app-header">
    <div class="app-logo">🀄 <span>宁海三中98届麻将交流群</span></div>
    <nav class="app-nav">
      <a href="index.html" class="active">首页</a>
      <a href="pages/records.html">战绩</a>
      <a href="pages/stats.html">统计</a>
      <a href="pages/posts.html">心得</a>
    </nav>
    <div style="display:flex;gap:4px;align-items:center;position:relative;">
      <button class="btn btn-outline btn-sm" id="auth-btn" onclick="showLoginOverlay()" style="font-size:13px;padding:4px 12px;white-space:nowrap;">未登录</button>
      <button class="btn btn-outline btn-sm" id="theme-btn" onclick="toggleTheme()" style="font-size:13px;padding:4px 10px;">☀️</button>
    </div>
  </header>

  <!-- Stats Overview -->
  <div class="stats-row" id="stats-overview">
    <div class="stat-card"><div class="stat-num" id="total-games">0</div><div class="stat-label">总场次</div></div>
    <div class="stat-card"><div class="stat-num positive" id="total-amount">¥0</div><div class="stat-label">总流水</div></div>
    <div class="stat-card"><div class="stat-num" id="active-players">0</div><div class="stat-label">活跃玩家</div></div>
    <div class="stat-card"><div class="stat-num" id="total-posts">0</div><div class="stat-label">心得</div></div>
  </div>

  <!-- Personal Stats (logged in) -->
  <div class="card" id="personal-card" style="display:none;">
    <div class="card-title">👤 我的月度统计 <span id="personal-month-label" style="font-weight:400;font-size:13px;color:var(--text-tertiary);"></span></div>
    <div class="stats-row" id="personal-stats-grid" style="margin-bottom:0;"></div>
    <div style="margin-top:10px;">
      <canvas id="personal-month-chart" height="120"></canvas>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
    <!-- Recent Records -->
    <div class="card">
      <div class="card-title">📊 最近战绩</div>
      <div id="recent-records"><div class="empty-state">暂无战绩</div></div>
    </div>

    <!-- Recent Posts -->
    <div class="card">
      <div class="card-title">📝 最新心得</div>
      <div id="recent-posts"><div class="empty-state">暂无心得</div></div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px;">
    <!-- Weekly Ranking -->
    <div class="card">
      <div class="card-title">🏆 总排行</div>
      <div id="weekly-ranking"><div class="empty-state">暂无数据</div></div>
    </div>

    <!-- Group Members -->
    <div class="card">
      <div class="card-title">👥 群成员</div>
      <div id="member-list" style="font-size:13px;line-height:2;">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>
</div>

<script src="../js/i18n.js"></script>
<script src="js/main.js"></script>
<script>
// Dashboard: load overview data
(async function() {
  try {
    var records = await api.get('mj_records') || [];
    var posts = await api.get('mj_posts') || [];

    // Calculate stats
    var totalGames = records.length;
    var totalAmount = records.reduce(function(s, r) {
      return s + r.players.reduce(function(ss, p) { return ss + Math.abs(p.score); }, 0);
    }, 0) / 2; // flow = sum of abs / 2
    var allPlayers = {};
    records.forEach(function(r) {
      r.players.forEach(function(p) { allPlayers[p.name] = true; });
    });
    var activePlayers = Object.keys(allPlayers).length;

    document.getElementById('total-games').textContent = totalGames;
    document.getElementById('total-amount').textContent = '¥' + totalAmount;
    document.getElementById('active-players').textContent = activePlayers;
    document.getElementById('total-posts').textContent = posts.length;

    // Recent records (last 5)
    var recentEl = document.getElementById('recent-records');
    var recent = records.slice(-5).reverse();
    if (recent.length) {
      recentEl.innerHTML = recent.map(function(r) {
        var date = r.date || '';
        var players = r.players.map(function(p) {
          var cls = p.score >= 0 ? 'positive' : 'negative';
          var sign = p.score >= 0 ? '+' : '';
          return '<span class="record-player">' + escapeHtml(p.name) + ' <span class="record-score ' + cls + '">' + sign + p.score + '</span></span>';
        }).join('');
        return '<div class="record-item"><span class="record-date">' + date + '</span><div class="record-players">' + players + '</div></div>';
      }).join('');
    }

    // Recent posts (last 3)
    var postsEl = document.getElementById('recent-posts');
    var recentPosts = posts.slice(-3).reverse();
    if (recentPosts.length) {
      postsEl.innerHTML = recentPosts.map(function(p) {
        return '<div class="record-item"><span class="record-date">' + (p.date || '') + '</span><span>' + escapeHtml(p.title || p.content.slice(0, 30)) + '</span></div>';
      }).join('');
    }

    // Weekly ranking (net score per player)
    var rankEl = document.getElementById('weekly-ranking');
    var playerScores = {};
    records.forEach(function(r) {
      r.players.forEach(function(p) {
        playerScores[p.name] = (playerScores[p.name] || 0) + p.score;
      });
    });
    var sorted = Object.keys(playerScores).sort(function(a, b) {
      return playerScores[b] - playerScores[a];
    });
    if (sorted.length) {
      var medals = ['rank-1', 'rank-2', 'rank-3'];
      rankEl.innerHTML = '<ol class="rank-list">' + sorted.map(function(name, i) {
        var score = playerScores[name];
        var medal = i < 3 ? medals[i] : '';
        var cls = score >= 0 ? 'positive' : 'negative';
        var sign = score >= 0 ? '+' : '';
        return '<li class="rank-item"><span class="rank-badge ' + medal + '">' + (i + 1) + '</span><span class="rank-name">' + escapeHtml(name) + '</span><span class="rank-score ' + cls + '">' + sign + score + '</span></li>';
      }).join('') + '</ol>';
    }
    // Personal monthly stats (if logged in)
    var loggedIn = localStorage.getItem('mj_player');
    if (loggedIn) {
      var personalCard = document.getElementById('personal-card');
      personalCard.style.display = 'block';
      var now = new Date();
      var thisMonth = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2, '0');
      document.getElementById('personal-month-label').textContent = '（' + thisMonth.replace('-', '年') + '月）';

      var monthRecords = records.filter(function(r) {
        return r.date && r.date.substring(0, 7) === thisMonth;
      });
      var myTotal = 0, myWins = 0, myLosses = 0, myGames = 0;
      monthRecords.forEach(function(r) {
        (r.players || []).forEach(function(p) {
          if (p.name === loggedIn) {
            myTotal += p.score;
            myGames++;
            if (p.score > 0) myWins++;
            else if (p.score < 0) myLosses++;
          }
        });
      });
      document.getElementById('personal-stats-grid').innerHTML =
        '<div class="stat-card"><div class="stat-num">' + myGames + '</div><div class="stat-label">本月场次</div></div>' +
        '<div class="stat-card"><div class="stat-num ' + (myTotal >= 0 ? 'positive' : 'negative') + '">' + (myTotal >= 0 ? '+' : '') + myTotal + '</div><div class="stat-label">本月净胜</div></div>' +
        '<div class="stat-card"><div class="stat-num positive">' + myWins + '</div><div class="stat-label">赢</div></div>' +
        '<div class="stat-card"><div class="stat-num negative">' + myLosses + '</div><div class="stat-label">输</div></div>';

      // Personal monthly chart
      var personalCtx = document.getElementById('personal-month-chart');
      if (personalCtx && typeof Chart !== 'undefined') {
        var myRecords = records.filter(function(r) {
          return r.date && r.date.substring(0, 7) === thisMonth;
        });
        var myScores = [];
        myRecords.forEach(function(r) {
          (r.players || []).forEach(function(p) {
            if (p.name === loggedIn) myScores.push({ date: r.date, score: p.score });
          });
        });
        if (myScores.length) {
          new Chart(personalCtx, {
            type: 'line',
            data: {
              labels: myScores.map(function(s) { return s.date ? s.date.slice(5) : ''; }),
              datasets: [{
                label: loggedIn,
                data: myScores.map(function(s) { return s.score; }),
                borderColor: '#ff6b00',
                backgroundColor: 'rgba(255,107,0,0.1)',
                fill: true,
                tension: 0.3,
                pointRadius: 4,
              }]
            },
            options: {
              responsive: true,
              plugins: { legend: { display: false } },
              scales: {
                y: { grid: { color: 'rgba(0,0,0,0.05)' } },
                x: { grid: { display: false } }
              }
            }
          });
        }
      }
    }

    // Render member list
    var members = window.DEFAULT_PLAYERS || [
      '王建军', '邵伟军', '冯善雷', '庞尚韬',
      '冯悦', '张展', '张林松', '张和翔', '张文杰'
    ];
    var nicknames = {
      '王建军': '卯兔', '邵伟军': '猩猩/屌', '冯善雷': '蛇',
      '庞尚韬': '可与', '冯悦': '青蛙', '张和翔': '胖子', '张文杰': '德杰'
    };
    var memberEl = document.getElementById('member-list');
    memberEl.innerHTML = members.map(function(name) {
      var nick = nicknames[name] ? '（' + nicknames[name] + '）' : '';
      return '<div>' + escapeHtml(name) + '<span style="color:var(--text-secondary);font-size:12px;margin-left:4px;">' + nick + '</span></div>';
    }).join('');

  } catch(e) {
    console.warn('Dashboard load error:', e);
  }
})();
</script>

<script>
(function() {
  var theme = localStorage.getItem('xie_theme') || 'light';
  var btn = document.getElementById('theme-btn');
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    if (btn) btn.textContent = '🌙';
  } else {
    if (btn) btn.textContent = '☀️';
  }
})();
function toggleTheme() {
  var html = document.documentElement;
  var btn = document.getElementById('theme-btn');
  var isDark = html.getAttribute('data-theme') === 'dark';
  if (isDark) {
    html.removeAttribute('data-theme');
    localStorage.setItem('xie_theme', 'light');
    if (btn) btn.textContent = '☀️';
  } else {
    html.setAttribute('data-theme', 'dark');
    localStorage.setItem('xie_theme', 'dark');
    if (btn) btn.textContent = '🌙';
  }
}
</script>
</body>
</html>
