<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宁海三中98届麻将交流群</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #mahjong-map-container { width:100%;height:420px; }
    .hero-map-bg #mahjong-map-container { position:absolute;top:0;left:0;width:100%;height:100%; }
    @media(max-width:900px){ #mahjong-map-container{height:260px;} }
  </style>
</head>
<body>
<!-- ===== Sidebar ===== -->
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <div class="logo-icon">🀄</div>
      <div class="logo-text">
        <h1>宁海三中98届</h1>
        <small>麻将交流群</small>
      </div>
    </a>
    <button class="nav-toggle" aria-label="菜单">☰</button>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html" class="active">🏠 首页</a></li>
        <li><a href="pages/records.html">📊 战绩</a></li>
        <li><a href="pages/stats.html">📈 统计</a></li>
        <li><a href="pages/friendship.html">🤝 友谊时刻</a></li>
        <li><a href="pages/mahjong-culture.html">🀄 麻将文化</a></li>
        <li><a href="pages/posts.html">📝 心得</a></li>
      </ul>
      <div class="sidebar-controls">
        <div class="sc-row">
          <button class="sidebar-btn" id="auth-btn" onclick="showLoginOverlay()" title="登录">👤</button>
          <button class="sidebar-btn" id="theme-btn" onclick="toggleTheme()" title="切换主题">☀️</button>
        </div>
        <div class="sc-row" id="user-info" style="display:none;font-size:11px;color:var(--text-tertiary);padding-top:4px;"></div>
      </div>
    </nav>
  </div>
</header>

<!-- ===== Content ===== -->
<div class="content">

  <!-- Hero / Map -->
  <section class="hero-section hero-map-bg">
    <div id="mahjong-map-container"></div>
    <div class="hero-info">
      <div class="hero-date-box">
        <div class="hero-date">
          <div class="hero-date-day" id="hero-day">18</div>
          <div class="hero-date-detail">
            <div class="hero-date-month" id="hero-month">6月</div>
            <div class="hero-date-weekday" id="hero-weekday">星期三</div>
          </div>
        </div>
      </div>
    </div>
    <div class="hero-motto">以牌会友 · 乐在其中</div>
    <div class="hero-sub">—— 宁海三中98届 · 麻将交流群 ——</div>
  </section>

  <!-- Stats Bar -->
  <div class="stats-bar">
    <div class="stat-item"><div class="num" id="total-games">0</div><div class="label">总场次</div></div>
    <div class="stat-item"><div class="num positive" id="total-amount">¥0</div><div class="label">总流水</div></div>
    <div class="stat-item"><div class="num" id="active-players">0</div><div class="label">活跃玩家</div></div>
    <div class="stat-item"><div class="num" id="total-posts">0</div><div class="label">心得</div></div>
    <div class="stat-item"><div class="num positive" id="my-month">-</div><div class="label">我的本月</div></div>
  </div>

  <!-- Media Row: Video + Photo -->
  <div class="media-row-section">
    <div class="media-row">
      <div class="media-col">
        <div class="media-col-header">
          <h3>🎬 友谊视频</h3>
          <div class="divider"></div>
          <p>影像记录 · 同窗情谊</p>
        </div>
        <div class="reels-container" id="video-container">
          <div class="empty-state" style="padding:20px;">暂无视频</div>
        </div>
      </div>
      <div class="media-col">
        <div class="media-col-header">
          <h3>📷 友谊照片</h3>
          <div class="divider"></div>
          <p>定格瞬间 · 永恒回忆</p>
        </div>
        <div class="photo-carousel-wrap">
          <div class="friend-carousel" id="photo-carousel">
            <div class="friend-carousel-track" id="photo-track"></div>
            <button class="carousel-btn carousel-prev" onclick="movePhoto(-1)">‹</button>
            <button class="carousel-btn carousel-next" onclick="movePhoto(1)">›</button>
          </div>
          <div class="carousel-dots" id="photo-dots"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Dashboard Grid -->
  <div class="section-wrap" style="padding-top:0;">
    <div class="grid-2-1">
      <!-- Recent Records -->
      <div class="card">
        <div class="card-title">📊 最近战绩</div>
        <div id="recent-records"><div class="empty-state">暂无战绩，快去记录吧</div></div>
        <div style="text-align:center;margin-top:12px;">
          <a href="pages/records.html" class="btn btn-outline btn-sm">查看全部 →</a>
        </div>
      </div>

      <!-- Ranking -->
      <div class="card">
        <div class="card-title">🏆 总排行</div>
        <div id="weekly-ranking"><div class="empty-state">暂无数据</div></div>
      </div>
    </div>

    <div class="grid-2">
      <!-- Monthly Personal Chart -->
      <div class="card" id="personal-card" style="display:none;">
        <div class="card-title">👤 本月走势 <span id="personal-month-label" style="font-weight:400;font-size:12px;color:var(--text-tertiary);"></span></div>
        <canvas id="personal-month-chart" height="120"></canvas>
      </div>

      <!-- Group Members -->
      <div class="card">
        <div class="card-title">👥 群成员</div>
        <div id="member-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;">
          <div class="empty-state" style="padding:10px;">加载中...</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="site-footer">© 2026 宁海三中98届麻将交流群 · 以牌会友</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/main.js"></script>
<script src="js/mahjong-map.js"></script>
<script>
// ---- Date ----
(function() {
  var d = new Date();
  document.getElementById('hero-day').textContent = d.getDate();
  document.getElementById('hero-month').textContent = (d.getMonth()+1)+'月';
  var weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  document.getElementById('hero-weekday').textContent = weekdays[d.getDay()];
})();

// ---- Nav toggle ----
document.querySelector('.nav-toggle')?.addEventListener('click', function() {
  document.querySelector('.main-nav').classList.toggle('open');
});

// ---- Dashboard ----
(async function() {
  try {
    var records = await api.get('mj_records') || [];
    var posts = await api.get('mj_posts') || [];
    var friendship = await api.get('mj_friendship') || {videos:[],photos:[]};

    // Stats
    var totalGames = records.length;
    var totalAmount = records.reduce(function(s, r) {
      return s + r.players.reduce(function(ss, p) { return ss + Math.abs(p.score); }, 0);
    }, 0) / 2;
    var allPlayers = {};
    records.forEach(function(r) { r.players.forEach(function(p) { allPlayers[p.name] = true; }); });
    document.getElementById('total-games').textContent = totalGames;
    document.getElementById('total-amount').textContent = '¥' + Math.round(totalAmount);
    document.getElementById('active-players').textContent = Object.keys(allPlayers).length;
    document.getElementById('total-posts').textContent = posts.length;

    // Recent records
    var recentEl = document.getElementById('recent-records');
    var recent = records.slice(-5).reverse();
    if (recent.length) {
      recentEl.innerHTML = recent.map(function(r) {
        return '<div class="record-item"><span class="record-date">' + (r.date||'') + '</span><div class="record-players">' +
          r.players.map(function(p) {
            var cls = p.score >= 0 ? 'positive' : 'negative';
            var sign = p.score >= 0 ? '+' : '';
            return '<span class="record-player">' + playerWithAvatar(p.name, 18) + ' <span class="record-score ' + cls + '">' + sign + p.score + '</span></span>';
          }).join('') + '</div></div>';
      }).join('');
    }

    // Ranking
    var playerScores = {};
    records.forEach(function(r) { r.players.forEach(function(p) { playerScores[p.name] = (playerScores[p.name]||0) + p.score; }); });
    var sorted = Object.keys(playerScores).sort(function(a,b){return playerScores[b]-playerScores[a];});
    if (sorted.length) {
      document.getElementById('weekly-ranking').innerHTML = '<ol class="rank-list">' +
        sorted.map(function(name, i) {
          var score = playerScores[name];
          var medal = i < 3 ? ['rank-1','rank-2','rank-3'][i] : '';
          var cls = score >= 0 ? 'positive' : 'negative';
          var sign = score >= 0 ? '+' : '';
          return '<li class="rank-item"><span class="rank-badge '+medal+'">'+(i+1)+'</span><span class="rank-name">'+playerWithAvatar(name,20)+'</span><span class="rank-score '+cls+'">'+sign+score+'</span></li>';
        }).join('') + '</ol>';
    }

    // Personal monthly
    var loggedIn = localStorage.getItem('mj_player');
    if (loggedIn) {
      document.getElementById('personal-card').style.display = 'block';
      var now = new Date();
      var thisMonth = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
      document.getElementById('personal-month-label').textContent = thisMonth;
      var monthRecs = records.filter(function(r) { return r.date && r.date.substring(0,7) === thisMonth; });
      var myTotal = 0, myScores = [];
      monthRecs.forEach(function(r) {
        r.players.forEach(function(p) {
          if (p.name === loggedIn) { myTotal += p.score; myScores.push({date:r.date,score:p.score}); }
        });
      });
      document.getElementById('my-month').textContent = (myTotal>=0?'+':'')+myTotal;
      if (myScores.length > 0) {
        new Chart(document.getElementById('personal-month-chart'), {
          type: 'line',
          data: {
            labels: myScores.map(function(s) { return s.date ? s.date.slice(5) : ''; }),
            datasets: [{
              label: loggedIn, data: myScores.map(function(s) { return s.score; }),
              borderColor: '#ff6b00', backgroundColor: 'rgba(255,107,0,0.1)',
              fill: true, tension: 0.3, pointRadius: 4,
            }]
          },
          options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{grid:{color:'rgba(0,0,0,0.05)'}},x:{grid:{display:false}}} }
        });
      }
    }

    // Members
    var members = window.DEFAULT_PLAYERS || [];
    var nicknames = {'王建军':'卯兔','邵伟军':'猩猩','冯善雷':'蛇','庞尚韬':'可与','冯悦':'青蛙','张展':'展昭','张和翔':'胖子','张文杰':'德杰'};
    document.getElementById('member-list').innerHTML = members.map(function(name) {
      var nick = nicknames[name] ? '<span style="font-size:10px;color:var(--text-tertiary);">'+nicknames[name]+'</span>' : '';
      return '<div style="display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;border:1px solid var(--glass-border);background:var(--glass-bg);">' +
        avatarHtml(name,24) + '<div><div style="font-size:12px;">'+escapeHtml(name)+'</div>'+nick+'</div></div>';
    }).join('');

    // Friendship media
    var videos = friendship.videos || [];
    var vc = document.getElementById('video-container');
    if (videos.length) {
      vc.innerHTML = videos.slice().reverse().map(function(v) {
        return '<div class="reel-item"><video class="reel-video" src="'+v.url+'" controls playsinline preload="metadata"></video>' +
          '<div class="reel-info"><div class="title">'+escapeHtml(v.title||'')+'</div><div class="desc">'+(v.date||'')+'</div></div></div>';
      }).join('');
    }
    var photos = friendship.photos || [];
    renderPhotos(photos);
  } catch(e) { console.warn(e); }
})();

// Photo carousel
var photoIndex = 0;
var photoData = [];
function renderPhotos(photos) {
  photoData = photos;
  var track = document.getElementById('photo-track');
  var dots = document.getElementById('photo-dots');
  if (!photos.length) {
    track.innerHTML = '<div class="friend-carousel-slide"><div class="empty-state" style="height:100%;display:flex;align-items:center;justify-content:center;">暂无照片</div></div>';
    dots.innerHTML = ''; return;
  }
  track.innerHTML = photos.map(function(p) {
    return '<div class="friend-carousel-slide"><img src="'+p.url+'" alt="'+escapeHtml(p.title||'')+'"><div class="slide-label">'+escapeHtml(p.title||'')+'</div></div>';
  }).join('');
  dots.innerHTML = photos.map(function(_,i) {
    return '<div class="carousel-dot'+(i===0?' active':'')+'" onclick="goToPhoto('+i+')"></div>';
  }).join('');
  photoIndex = 0;
}
function movePhoto(dir) { goToPhoto(photoIndex+dir); }
function goToPhoto(idx) {
  if (!photoData.length) return;
  if (idx<0) idx=photoData.length-1; if(idx>=photoData.length) idx=0;
  photoIndex=idx;
  document.getElementById('photo-track').style.transform='translateX(-'+(idx*100)+'%)';
  document.querySelectorAll('#photo-dots .carousel-dot').forEach(function(d,i){d.classList.toggle('active',i===idx);});
}
setInterval(function() { if (photoData.length>1) movePhoto(1); }, 4000);
</script>
</body>
</html>
