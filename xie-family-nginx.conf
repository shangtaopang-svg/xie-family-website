server {
    listen 80;
    server_name _;
    charset utf-8;
    root /opt/xie-family-v2;
    index intro.html;

    # API - proxy to Node.js backend on port 3001
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 200M;
    }

    # Uploads - Nginx serves directly with sendfile
    location /uploads/ {
        alias /opt/xie-family-v2/uploads/;
        sendfile on;
        tcp_nopush on;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Video files - optimized streaming
    location ~* \.(mp4|webm)$ {
        root /opt/xie-family-v2;
        sendfile on;
        tcp_nopush on;
        aio on;
        directio 8m;
        output_buffers 1 2m;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|woff2?|mp3|pdf)$ {
        root /opt/xie-family-v2;
        sendfile on;
        tcp_nopush on;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Main routing - SPA support
    location / {
        try_files $uri $uri/ /index.html;
        expires 0;
        add_header Cache-Control "no-cache";
    }

    client_max_body_size 200M;
}
