server {
    listen 80;
    server_name _;

    root /opt/xie-family;
    index index.html;

    # API requests - proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:5800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 200M;
    }

    # Uploads directory - serve static files
    location /uploads/ {
        alias /opt/xie-family/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # JS files - proxy through Node.js to bypass Nginx sendfile issues
    location ~* \.js$ {
        proxy_pass http://127.0.0.1:5800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
    }

    # Other static assets - serve directly
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|mp3|mp4|pdf)$ {
        expires 7d;
    }

    # Xie family site - main routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 200M;
}
