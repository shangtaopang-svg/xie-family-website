<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>功德卷轴 · 下枫槎谢氏</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5f0eb;
      background-image:
        repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(139,26,26,0.03) 80px, rgba(139,26,26,0.03) 81px),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(139,26,26,0.02) 40px, rgba(139,26,26,0.02) 41px);
      min-height: 100vh;
      font-family: 'Noto Serif SC', serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .page-wrap {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 10px 20px 40px;
    }

    /* ===== Page Header ===== */
    .page-title {
      font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: #1a1a1a;
      letter-spacing: 0.4em;
      text-align: center;
      margin: 15px 0 4px;
    }
    .page-subtitle {
      font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      color: #c41e3a;
      letter-spacing: 0.2em;
      text-align: center;
      margin-bottom: 20px;
    }

    /* ===== Section ===== */
    .section {
      margin-bottom: 30px;
    }
    .section-header {
      text-align: center;
      padding: 14px 20px;
      background: #fffcf5;
      border: 1px solid #e8ddd0;
      border-radius: 8px;
      margin-bottom: 12px;
      position: relative;
    }
    .section-header h2 {
      font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      color: #1a1a1a;
      letter-spacing: 0.15em;
    }
    .section-header h2 small {
      font-family: 'Noto Serif SC', serif;
      font-size: 0.65rem;
      color: #b0a090;
      letter-spacing: 0.1em;
      margin-left: 8px;
    }

    /* ===== Scroll Card ===== */
    .scroll-card {
      margin-bottom: 14px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #e0d5c5;
      background: #fffcf5;
    }

    /* Card Header (clickable toggle) */
    .scroll-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: linear-gradient(135deg, #faf5ee, #f5ede0);
      cursor: pointer;
      user-select: none;
      transition: background 0.2s;
    }
    .scroll-card-header:hover {
      background: linear-gradient(135deg, #f5ede0, #efe5d5);
    }
    .scroll-card-header .info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .scroll-card-header .info h3 {
      font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: clamp(0.9rem, 1.6vw, 1.05rem);
      color: #2c1810;
      font-weight: 400;
      letter-spacing: 0.05em;
    }
    .scroll-card-header .info .count-badge {
      font-size: 0.65rem;
      color: #fff;
      background: #c41e3a;
      padding: 1px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .scroll-card-header .info .empty-badge {
      font-size: 0.6rem;
      color: #b0a090;
      background: #f0e8e0;
      padding: 1px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    /* Toggle button */
    .toggle-btn {
      width: 64px;
      height: 26px;
      border-radius: 13px;
      border: 1px solid #d0c0a8;
      background: #ffffff;
      color: #8a7030;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Noto Serif SC', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      flex-shrink: 0;
    }
    .toggle-btn:hover {
      background: #f5ede0;
      border-color: #c41e3a;
      color: #c41e3a;
    }
    .toggle-btn.open {
      background: #c41e3a;
      border-color: #c41e3a;
      color: #fff;
    }
    .toggle-btn.open:hover {
      background: #a81830;
    }

    /* ===== Scroll Paper (collapsible) ===== */
    .scroll-paper-wrap {
      overflow: hidden;
      max-height: 0;
      transition: max-height 2.5s cubic-bezier(0.22, 0.1, 0.15, 1);
    }
    .scroll-paper-wrap.open {
      max-height: 6000px;
    }

    .scroll-paper {
      background: linear-gradient(135deg, #fdf8f0 0%, #f8f0e0 30%, #faf3e5 60%, #f5edd8 100%);
      position: relative;
      overflow: hidden;
      border-top: 1px solid #e0d5c5;
    }
    .scroll-paper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40px;
      background: linear-gradient(180deg, rgba(253,248,240,0.95) 0%, rgba(253,248,240,0.3) 40%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }
    .scroll-paper::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      background: linear-gradient(0deg, rgba(253,248,240,0.95) 0%, rgba(253,248,240,0.3) 40%, transparent 100%);
      pointer-events: none;
      z-index: 2;
    }
    .scroll-edge-left, .scroll-edge-right {
      position: absolute;
      top: 0; bottom: 0;
      width: 14px;
      z-index: 3;
      pointer-events: none;
    }
    .scroll-edge-left {
      left: 0;
      background: linear-gradient(90deg, rgba(180,150,100,0.2) 0%, transparent 60%);
    }
    .scroll-edge-right {
      right: 0;
      background: linear-gradient(270deg, rgba(180,150,100,0.2) 0%, transparent 60%);
    }

    .scroll-content {
      position: relative;
      z-index: 5;
      padding: 40px 24px 40px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 14px;
      min-height: 100px;
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #c0b0a0;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }
    .empty-state .icon { font-size: 2rem; margin-bottom: 8px; opacity: 0.4; }

    /* ===== Name Column ===== */
    .name-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      padding: 6px 3px;
      border-radius: 4px;
      transition: all 0.3s ease;
      position: relative;
      min-width: 44px;
    }
    .name-col:hover { background: rgba(196,30,58,0.05); }
    .name-col .char {
      font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: clamp(0.82rem, 1.5vw, 1.05rem);
      line-height: 1.4;
      color: #2c1810;
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 0.03em;
      transition: all 0.3s ease;
    }
    .name-col .amount-tag {
      font-size: 0.55rem;
      color: #b0a090;
      margin-top: 5px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Red highlight (>=1万) */
    .name-col.top .char {
      font-weight: 900;
      color: #c41e3a;
      text-shadow: 0 0 4px rgba(196,30,58,0.12);
    }
    .name-col.top:hover .char {
      text-shadow: 0 0 10px rgba(196,30,58,0.25), 0 0 20px rgba(196,30,58,0.08);
    }
    .name-col.top .amount-tag {
      color: #c41e3a;
      font-weight: 700;
    }

    /* Medium (>=2000) */
    .name-col.medium .char {
      font-weight: 700;
      color: #4a4030;
    }
    .name-col.medium .amount-tag {
      color: #8a7030;
    }

    /* ===== Modal ===== */
    .mw-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .mw-modal.open { display: flex; }
    .mw-modal-box {
      max-width: 400px; width: 100%;
      padding: 28px 24px;
      background: #ffffff;
      border: 1px solid #e8ddd0;
      border-radius: 8px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-height: 80vh; overflow-y: auto;
    }
    .mw-modal-close {
      position: absolute; top: 10px; right: 14px;
      background: none; border: none;
      color: #b0a090; font-size: 20px;
      cursor: pointer; line-height: 1;
      font-family: 'Noto Serif SC', serif;
    }
    .mw-modal-close:hover { color: #1a1a1a; }
    .mw-modal-name {
      font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: 1.4rem; color: #1a1a1a; margin-bottom: 4px;
    }
    .mw-modal-gen {
      font-size: 0.8rem; color: #b0a090; margin-bottom: 10px;
    }
    .mw-modal-amount {
      font-size: 0.85rem; color: #c41e3a; font-weight: 600; margin-bottom: 14px;
    }
    .mw-modal-bio {
      font-size: 0.85rem; line-height: 1.8; color: #4a4a4a;
      padding-top: 12px; border-top: 1px solid #f0e8e0;
      min-height: 30px;
    }

    /* ===== Inscription ===== */
    .page-inscription {
      text-align: center;
      padding: 16px 20px 0;
    }
    .page-inscription p {
      font-family: 'Noto Serif SC', 'STKaiti', serif;
      font-size: clamp(0.75rem, 1.3vw, 0.85rem);
      line-height: 2;
      color: #c0b0a0;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .page-wrap { padding: 5px 10px 30px; }
      .scroll-card-header { padding: 10px 12px; }
      .scroll-content { padding: 30px 10px; gap: 4px 8px; }
      .name-col .char { font-size: 0.78rem; }
      .name-col { min-width: 36px; }
      .toggle-btn { width: 56px; height: 24px; font-size: 0.65rem; }
    }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="page-title">下枫槎功德卷</div>
  <div class="page-subtitle">凡捐资修谱建祠者 · 勒名于斯 · 永志不忘</div>

  <!-- ===== Section 1: 圆谱庆典 ===== -->
  <div class="section">
    <div class="section-header">
      <h2>2026年农历四月初一 · 圆谱庆典捐（筹）款 <small>YUANPU CELEBRATION</small></h2>
    </div>

    <!-- Scroll 1: 族人捐款名单 -->
    <div class="scroll-card" data-scroll="clan">
      <div class="scroll-card-header" onclick="toggleScroll('clan')">
        <div class="info">
          <h3>一 · 族人捐款名单</h3>
          <span class="count-badge" id="badge-clan">65人</span>
        </div>
        <button class="toggle-btn" id="btn-clan">展开 ▾</button>
      </div>
      <div class="scroll-paper-wrap" id="wrap-clan">
        <div class="scroll-paper">
          <div class="scroll-edge-left"></div>
          <div class="scroll-edge-right"></div>
          <div class="scroll-content" id="content-clan"></div>
        </div>
      </div>
    </div>

    <!-- Scroll 2: 族人筹款名单 -->
    <div class="scroll-card" data-scroll="external">
      <div class="scroll-card-header" onclick="toggleScroll('external')">
        <div class="info">
          <h3>二 · 族人筹款名单</h3>
          <span class="count-badge" id="badge-external">142人</span>
        </div>
        <button class="toggle-btn" id="btn-external">展开 ▾</button>
      </div>
      <div class="scroll-paper-wrap" id="wrap-external">
        <div class="scroll-paper">
          <div class="scroll-edge-left"></div>
          <div class="scroll-edge-right"></div>
          <div class="scroll-content" id="content-external"></div>
        </div>
      </div>
    </div>

    <!-- Scroll 3: 外来宗亲助款名单 -->
    <div class="scroll-card" data-scroll="social">
      <div class="scroll-card-header" onclick="toggleScroll('social')">
        <div class="info">
          <h3>三 · 外来宗亲助款名单</h3>
          <span class="count-badge" id="badge-social">143人</span>
        </div>
        <button class="toggle-btn" id="btn-social">展开 ▾</button>
      </div>
      <div class="scroll-paper-wrap" id="wrap-social">
        <div class="scroll-paper">
          <div class="scroll-edge-left"></div>
          <div class="scroll-edge-right"></div>
          <div class="scroll-content" id="content-social"></div>
        </div>
      </div>
    </div>

    <!-- Scroll 4: 社会各界助款名单 -->
    <div class="scroll-card" data-scroll="extra1">
      <div class="scroll-card-header" onclick="toggleScroll('extra1')">
        <div class="info">
          <h3>四 · 社会各界（宗族）助款名单</h3>
          <span class="count-badge" id="badge-extra1">16个单位</span>
        </div>
        <button class="toggle-btn" id="btn-extra1">展开 ▾</button>
      </div>
      <div class="scroll-paper-wrap" id="wrap-extra1">
        <div class="scroll-paper">
          <div class="scroll-edge-left"></div>
          <div class="scroll-edge-right"></div>
          <div class="scroll-content" id="content-extra1"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Section 2: 宗祠修缮 ===== -->
  <div class="section">
    <div class="section-header">
      <h2>宗祠修缮捐款 <small>TEMPLE RENOVATION</small></h2>
    </div>

    <div class="scroll-card" data-scroll="temple">
      <div class="scroll-card-header" onclick="toggleScroll('temple')">
        <div class="info">
          <h3>宗祠修缮捐款名单</h3>
          <span class="empty-badge">待上传</span>
        </div>
        <button class="toggle-btn" id="btn-temple">展开 ▾</button>
      </div>
      <div class="scroll-paper-wrap" id="wrap-temple">
        <div class="scroll-paper">
          <div class="scroll-edge-left"></div>
          <div class="scroll-edge-right"></div>
          <div class="scroll-content">
            <div class="empty-state">
              <div class="icon">🏛️</div>
              <p>数据待上传</p>
              <p style="font-size:0.7rem;margin-top:6px;">请提供宗祠修缮捐款名单</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="page-inscription">
    <p>公元二〇二六年丙午春 · 下枫槎谢氏阖族敬立</p>
  </div>
</div>

<!-- Modal -->
<div class="mw-modal" id="mwModal" onclick="if(event.target===this)closeModal()">
  <div class="mw-modal-box" id="mwModalBox"></div>
</div>

<script>
// ===== Data =====
var meritData = [];
var currentOpen = null;

// Scroll configurations
var scrolls = {
  clan:   { file: '../data/merit.json',  btn: 'btn-clan',  wrap: 'wrap-clan',  content: 'content-clan' },
  external: { file: '../data/merit-fundraising.json', btn: 'btn-external', wrap: 'wrap-external', content: 'content-external' },
  social: { file: '../data/merit-external.json', btn: 'btn-social', wrap: 'wrap-social', content: 'content-social' },
  extra1: { file: '../data/merit-social.json', btn: 'btn-extra1', wrap: 'wrap-extra1', content: 'content-extra1' },
  temple: { file: null, btn: 'btn-temple', wrap: 'wrap-temple' }
};

// Load data for all scrolls that have files
function loadAll() {
  loadScrollData('clan');
  loadScrollData('external');
  loadScrollData('social');
  loadScrollData('extra1');
}

function loadScrollData(key) {
  var cfg = scrolls[key];
  if (!cfg.file) return;
  fetch(cfg.file + '?' + Date.now()).then(function(r){return r.json()}).then(function(d){
    meritData = d;
    localStorage.setItem('xie_merit_data', JSON.stringify(d));
    renderScroll(key, d);
  }).catch(function(){
    var stored = localStorage.getItem('xie_merit_data');
    if (stored) {
      try { var d = JSON.parse(stored); renderScroll(key, d); } catch(e) {}
    }
  });
}

function renderScroll(key, data) {
  var copy = data.slice();
  copy.sort(function(a,b){
    return (b.amountValue||0) - (a.amountValue||0) || a.id - b.id;
  });

  var container = document.getElementById(scrolls[key].content);
  if (!container) return;

  var html = '';
  copy.forEach(function(p){
    var amt = p.amountValue || 0;
    var cls = 'name-col';
    if (amt >= 10000) cls += ' top';
    else if (amt >= 2000) cls += ' medium';

    html += '<div class="' + cls + '" data-id="' + p.id + '" onclick="openModal(' + p.id + ')">';
    p.name.split('').forEach(function(ch){
      html += '<span class="char">' + esc(ch) + '</span>';
    });
    var amtText = p.amount;
    if (/^\d+元$/.test(p.amount)) {
      var amt = p.amountValue || 0;
      amtText = amt >= 10000
        ? (amt/10000).toFixed(amt%10000===0?0:1) + '万'
        : amt + '元';
    }
    html += '<div class="amount-tag">' + amtText + '</div>';
    html += '</div>';
  });

  container.innerHTML = html;
}

// ===== Toggle Scroll =====
function toggleScroll(key) {
  var wrap = document.getElementById(scrolls[key].wrap);
  var btn = document.getElementById(scrolls[key].btn);
  if (!wrap) return;

  var isOpen = wrap.classList.contains('open');

  if (isOpen) {
    // Close: animate to 0
    wrap.style.maxHeight = wrap.scrollHeight + 'px';
    wrap.offsetHeight; // force reflow
    wrap.classList.remove('open');
    wrap.style.maxHeight = '0';
    btn.textContent = '展开 ▾';
    btn.classList.remove('open');
  } else {
    // Open: calculate exact height and animate
    wrap.classList.add('open');
    wrap.style.maxHeight = 'none';
    var h = wrap.scrollHeight;
    wrap.style.maxHeight = '0';
    wrap.offsetHeight; // force reflow
    wrap.style.maxHeight = h + 'px';
    btn.textContent = '收起 ▴';
    btn.classList.add('open');

    // Play sound on first open
    if (!window._soundPlayed) { window._soundPlayed = true; playScrollSound(); }
  }
}

// ===== Sound =====
function playScrollSound() {
  try {
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var len = ctx.sampleRate * 1.8;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      var t = i / ctx.sampleRate;
      var env = Math.max(0, 1 - t / 1.8);
      var noise = (Math.random() * 2 - 1) * 0.1;
      var rumble = Math.sin(i*0.06)*0.2 + Math.sin(i*0.1)*0.12 + Math.sin(i*0.03)*0.25;
      d[i] = (noise + rumble) * env * 0.18;
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var flt = ctx.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = 280;
    var gn = ctx.createGain();
    gn.gain.setValueAtTime(0.08, 0);
    gn.gain.exponentialRampToValueAtTime(0.002, 1.8);
    src.connect(flt); flt.connect(gn); gn.connect(ctx.destination);
    src.start();
  } catch(e) {}
}

// ===== Modal =====
function openModal(id) {
  var p = null;
  for (var i = 0; i < meritData.length; i++) {
    if (meritData[i].id === id) { p = meritData[i]; break; }
  }
  if (!p) return;
  var box = document.getElementById('mwModalBox');
  var genHtml = p.generation ? '<div class="mw-modal-gen">第' + p.generation + '世孙</div>' : '';
  var bioHtml = p.biography
    ? '<div class="mw-modal-bio">' + esc(p.biography) + '</div>'
    : '<div class="mw-modal-bio" style="color:#b0a090;font-style:italic;">暂无生平记载</div>';
  box.innerHTML =
    '<button class="mw-modal-close" onclick="closeModal()">✕</button>' +
    '<div class="mw-modal-name">' + esc(p.name) + '</div>' +
    genHtml +
    '<div class="mw-modal-amount">' + esc(p.amount) + ' · ' + esc(p.category) + '</div>' +
    bioHtml;
  document.getElementById('mwModal').classList.add('open');
}

function closeModal() {
  document.getElementById('mwModal').classList.remove('open');
}

function esc(t) {
  if (!t) return '';
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== Init =====
loadAll();
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
</script>
</body>
</html>
