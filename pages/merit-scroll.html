// ===== Toggle Scroll =====
function toggleScroll(key) {
  var wrap = document.getElementById(scrolls[key].wrap);
  var btn = document.getElementById(scrolls[key].btn);
  if (!wrap) return;

  var isOpen = wrap.classList.contains('open');

  if (isOpen) {
    // Close: animate to 0
    wrap.style.maxHeight = wrap.scrollHeight + 'px';
    wrap.offsetHeight; // force reflow
    wrap.classList.remove('open');
    wrap.style.maxHeight = '0';
    btn.textContent = '展开 ▾';
    btn.classList.remove('open');
  } else {
    // Open: calculate exact height and animate
    wrap.classList.add('open');
    wrap.style.maxHeight = 'none';
    var h = wrap.scrollHeight;
    wrap.style.maxHeight = '0';
    wrap.offsetHeight; // force reflow
    wrap.style.maxHeight = h + 'px';
    btn.textContent = '收起 ▴';
    btn.classList.add('open');

    // Play sound on first open
    if (!window._soundPlayed) { window._soundPlayed = true; playScrollSound(); }
  }
}

// ===== Sound =====
function playScrollSound() {
  try {
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var len = ctx.sampleRate * 1.8;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      var t = i / ctx.sampleRate;
      var env = Math.max(0, 1 - t / 1.8);
      var noise = (Math.random() * 2 - 1) * 0.1;
      var rumble = Math.sin(i*0.06)*0.2 + Math.sin(i*0.1)*0.12 + Math.sin(i*0.03)*0.25;
      d[i] = (noise + rumble) * env * 0.18;
    }
    var src = ctx.createBufferSource();
    src.buffer = buf;
    var flt = ctx.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = 280;
    var gn = ctx.createGain();
    gn.gain.setValueAtTime(0.08, 0);
    gn.gain.exponentialRampToValueAtTime(0.002, 1.8);
    src.connect(flt); flt.connect(gn); gn.connect(ctx.destination);
    src.start();
  } catch(e) {}
}

// ===== Modal =====
function openModal(id) {
  var p = null;
  for (var i = 0; i < meritData.length; i++) {
    if (meritData[i].id === id) { p = meritData[i]; break; }
  }
  if (!p) return;
  var box = document.getElementById('mwModalBox');
  var genHtml = p.generation ? '<div class="mw-modal-gen">第' + p.generation + '世孙</div>' : '';
  var bioHtml = p.biography
    ? '<div class="mw-modal-bio">' + esc(p.biography) + '</div>'
    : '<div class="mw-modal-bio" style="color:#b0a090;font-style:italic;">暂无生平记载</div>';
  box.innerHTML =
    '<button class="mw-modal-close" onclick="closeModal()">✕</button>' +
    '<div class="mw-modal-name">' + esc(p.name) + '</div>' +
    genHtml +
    '<div class="mw-modal-amount">' + esc(p.amount) + ' · ' + esc(p.category) + '</div>' +
    bioHtml;
  document.getElementById('mwModal').classList.add('open');
}

function closeModal() {
  document.getElementById('mwModal').classList.remove('open');
}

function esc(t) {
  if (!t) return '';
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== Init =====

// ===== Preface Auto-unroll on page load =====
function autoUnrollPreface() {
  var ps = document.getElementById('prefaceScroll');
  if (!ps) return;
  // Delay to let page render first
  window._prefaceTimer = setTimeout(function(){
    ps.classList.add('open');
    // Play sound
    if (!window._psound) {
      window._psound = true;
      try {
        var ctx = new (window.AudioContext||window.webkitAudioContext)();
        var len = ctx.sampleRate * 1.5;
        var buf = ctx.createBuffer(1, len, ctx.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) {
          var t = i / ctx.sampleRate;
          var env = Math.max(0, 1 - t / 1.5);
          var noise = (Math.random() * 2 - 1) * 0.08;
          var rumble = Math.sin(i*0.04)*0.2 + Math.sin(i*0.08)*0.1 + Math.sin(i*0.02)*0.25;
          d[i] = (noise + rumble) * env * 0.15;
        }
        var src = ctx.createBufferSource();
        src.buffer = buf;
        var flt = ctx.createBiquadFilter();
        flt.type = 'lowpass'; flt.frequency.value = 250;
        var gn = ctx.createGain();
        gn.gain.setValueAtTime(0.08, 0);
        src.connect(flt); flt.connect(gn); gn.connect(ctx.destination);
        src.start();
      } catch(e) {}
    }
  }, 600);
}

document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
// ===== Major Donors Spotlight (Top 5 by total) =====
var _allTotals = {};

function accumulateDonors(key, data) {
  data.forEach(function(p){
    var name = p.name;
    if (!_allTotals[name]) _allTotals[name] = 0;
    _allTotals[name] += (p.amountValue || 0);
  });
}

function renderMajors() {
  var grid = document.getElementById('majorsGrid');
  if (!grid) return;

  var sorted = Object.keys(_allTotals).map(function(name){
    return { name: name, total: _allTotals[name] };
  }).sort(function(a,b){ return b.total - a.total; });

  var top = sorted.slice(0, 5);
  if (!top.length) { grid.innerHTML = ''; return; }

  var medals = ['🥇', '🥈', '🥉', '🏅', '🏅'];
  var html = '';
  top.forEach(function(p, i){
    var amtText = p.total >= 10000
      ? (p.total/10000).toFixed(p.total%10000===0?0:1) + '万'
      : p.total + '元';
    html += '<div class="major-item">';
    html += '<div class="medal">' + medals[i] + '</div>';
    html += '<div class="name">' + esc(p.name) + '</div>';
    html += '<div class="amount">' + amtText + '</div>';
    html += '</div>';
  });
  grid.innerHTML = html;
}

// Extend renderScroll to accumulate totals and render majors
var origRender = renderScroll;
renderScroll = function(key, data) {
  origRender(key, data);
  if (key === 'clan' || key === 'temple') {
    accumulateDonors(key, data);
    if (key === 'temple') { renderMajors(); }
  }
};
