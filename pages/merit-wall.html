<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>功德堂 · 下枫槎谢氏</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&family=ZCOOL+QingKe+HuangYou&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=3">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      background-image:
        repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(139,26,26,0.035) 80px, rgba(139,26,26,0.035) 81px),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(139,26,26,0.025) 40px, rgba(139,26,26,0.025) 41px);
      color: #1a1a1a;
      font-family: 'Noto Serif SC', 'STKaiti', 'KaiTi', serif;
      min-height: 100vh;
    }
    .mw-wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }

    /* ===== Banner ===== */
    .mw-banner {
      text-align: center; padding: 70px 20px 45px;
      position: relative;
      background: #ffffff;
      border-bottom: 2px solid #c41e3a;
    }
    .mw-banner::before {
      content: ''; position: absolute; inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='80' height='80' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='80' height='80' fill='none' stroke='rgba(139,26,26,0.04)' stroke-width='0.5'/%3E%3C/svg%3E");
      opacity: 0.3;
    }
    .mw-banner h1 {
      font-family: 'ZCOOL QingKe HuangYou', 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: clamp(3rem, 7vw, 5rem);
      color: #1a1a1a; letter-spacing: 0.25em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: relative; margin-bottom: 10px;
    }
    .mw-banner .sub {
      font-family: 'Zhi Mang Xing', 'Noto Serif SC', serif;
      font-size: clamp(1.0rem, 2.5vw, 1.3rem);
      color: #c41e3a; letter-spacing: 0.3em;
      position: relative;
    }
    .mw-banner .sub::before, .mw-banner .sub::after {
      content: '◇'; color: #c41e3a; margin: 0 14px; font-size: 0.6em; opacity: 0.4;
    }

    /* ===== Toolbar ===== */
    .mw-toolbar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      margin: 24px 0 20px; padding: 14px 18px;
      background: #f8f6f3; border-radius: 10px;
      border: 1px solid #e8ddd0;
    }
    .mw-toolbar input {
      flex: 1; min-width: 160px; padding: 8px 14px; border-radius: 8px;
      border: 1px solid #d4c8b8; background: #ffffff;
      color: #1a1a1a; font-size: 13px; font-family: inherit; outline: none;
    }
    .mw-toolbar input:focus { border-color: #c41e3a; box-shadow: 0 0 0 2px rgba(196,30,58,0.08); }
    .mw-toolbar input::placeholder { color: #b0a090; }
    .mw-toolbar select {
      padding: 8px 12px; border-radius: 8px;
      border: 1px solid #d4c8b8; background: #ffffff;
      color: #1a1a1a; font-size: 12px; font-family: inherit; cursor: pointer; outline: none;
    }
    .mw-toolbar .stat {
      font-size: 12px; color: #b0a090; margin-left: auto;
    }

    /* ===== Brick Grid ===== */
    .mw-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px; margin-bottom: 50px;
    }

    /* ===== Single Brick ===== */
    .mw-brick {
      position: relative; padding: 24px 18px 18px;
      background: #ffffff;
      border: 1px solid #e8ddd0;
      border-radius: 8px; cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      opacity: 0; transform: translateY(30px);
      display: flex; flex-direction: column; align-items: center; text-align: center;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .mw-brick.visible { opacity: 1; transform: translateY(0); }
    .mw-brick:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      border-color: #c41e3a;
    }
    .mw-brick.highlight {
      border-color: #c41e3a; border-width: 1.5px;
      background: linear-gradient(135deg, #fffcf5, #fff8f0);
    }
    .mw-brick.highlight::before {
      content: '● 大功德'; position: absolute; top: 6px; right: 10px;
      font-size: 10px; color: #c41e3a; letter-spacing: 1px;
    }
    .mw-brick.highlight .brick-name { color: #c41e3a; }
    .mw-brick::after {
      content: ''; position: absolute; inset: 4px;
      border: 1px solid rgba(196,30,58,0.06);
      border-radius: 5px; pointer-events: none;
    }
    .brick-name {
      font-size: 1.4rem; font-weight: 700; color: #1a1a1a;
      letter-spacing: 0.05em; margin-bottom: 4px;
    }
    .brick-gen {
      font-size: 0.8rem; color: #b0a090;
      margin-bottom: 8px;
    }
    .brick-amount {
      font-size: 0.85rem; color: #c41e3a; font-weight: 600;
      padding: 3px 16px; border: 1px solid #e8ddd0;
      border-radius: 20px; background: #fef6f3;
      margin-bottom: 6px;
    }
    .brick-category {
      font-size: 0.72rem; color: #b0a090;
      margin-bottom: 6px;
    }
    .brick-branch {
      font-size: 0.75rem; color: #c0b0a0;
      margin-bottom: 10px;
    }
    /* Respect */
    .brick-respect {
      display: flex; align-items: center; gap: 6px; margin-top: auto;
    }
    .respect-btn {
      width: 28px; height: 28px; border-radius: 50%;
      border: 1px solid #e8ddd0;
      background: #ffffff;
      color: #c41e3a; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif;
    }
    .respect-btn:hover { background: #fef6f3; transform: scale(1.15); border-color: #c41e3a; }
    .respect-btn.done { opacity: 0.3; cursor: default; transform: none; }
    .respect-count {
      font-size: 12px; color: #b0a090; min-width: 20px;
    }

    /* ===== Empty state ===== */
    .mw-empty {
      grid-column: 1 / -1; text-align: center; padding: 80px 20px;
      color: #d0c8b8; font-size: 14px;
    }

    /* ===== Modal ===== */
    .mw-modal {
      display: none; position: fixed; inset: 0; z-index: 99999;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; padding: 20px;
    }
    .mw-modal.open { display: flex; }
    .mw-modal-box {
      max-width: 480px; width: 100%; padding: 30px;
      background: #ffffff;
      border: 1px solid #e8ddd0; border-radius: 10px;
      position: relative; max-height: 80vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
    }
    .mw-modal-close {
      position: absolute; top: 12px; right: 16px;
      background: none; border: none; color: #d0c8b8;
      font-size: 22px; cursor: pointer; line-height: 1;
    }
    .mw-modal-close:hover { color: #1a1a1a; }
    .mw-modal-name {
      font-size: 1.6rem; font-weight: 700; color: #1a1a1a;
      margin-bottom: 4px; font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
    }
    .mw-modal-gen { font-size: 0.85rem; color: #b0a090; margin-bottom: 12px; }
    .mw-modal-amount {
      font-size: 0.9rem; color: #c41e3a; font-weight: 600;
      padding: 4px 16px; border: 1px solid #e8ddd0; border-radius: 20px;
      display: inline-block; margin-bottom: 14px; background: #fef6f3;
    }
    .mw-modal-bio {
      font-size: 0.9rem; line-height: 1.9; color: #4a4a4a;
      margin-bottom: 12px; padding: 12px 0; border-top: 1px solid #f0e8e0;
    }
    .mw-modal-tribute {
      font-size: 0.85rem; line-height: 1.7; color: #666666;
      font-style: italic; padding: 10px 14px;
      background: #f8f6f3; border-radius: 8px;
      border-left: 3px solid #c41e3a;
    }
    .mw-modal-tribute::before { content: '「'; }
    .mw-modal-tribute::after { content: '」'; }

    /* ===== Inscription ===== */
    .mw-inscription {
      text-align: center; padding: 40px 30px;
      border-top: 1px solid #f0e8e0;
      position: relative;
    }
    .mw-inscription::before {
      content: '— ◇ —'; position: absolute; top: -8px; left: 50%;
      transform: translateX(-50%);
      font-size: 10px; color: #c41e3a; letter-spacing: 8px; opacity: 0.5;
      background: #ffffff; padding: 0 16px;
    }
    .mw-inscription h3 {
      font-family: 'ZCOOL QingKe HuangYou', 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: 1.4rem; color: #c41e3a; margin-bottom: 16px; letter-spacing: 0.2em;
    }
    .mw-inscription p {
      font-family: 'Zhi Mang Xing', 'Noto Serif SC', serif;
      font-size: 1.1rem; line-height: 2.3; color: #4a4a4a;
      max-width: 700px; margin: 0 auto;
    }

    /* ===== Print ===== */
    @media print {
      body { background: #fff !important; color: #222 !important; }
      .mw-banner { background: #fff !important; border-bottom: 2px solid #c41e3a; padding: 30px 20px; }
      .mw-banner h1 { color: #222 !important; }
      .mw-banner .sub { color: #c41e3a !important; }
      .mw-toolbar { display: none !important; }
      .mw-brick { opacity: 1 !important; transform: none !important; break-inside: avoid; background: #fff !important; border: 1px solid #c41e3a !important; }
      .brick-name { color: #222 !important; }
      .brick-gen, .brick-branch, .brick-category { color: #666 !important; }
      .brick-amount { color: #c41e3a !important; border-color: #c41e3a !important; }
      .mw-brick.highlight { border-width: 2px !important; }
      .mw-brick.highlight::before { color: #c41e3a !important; }
      .respect-btn, .respect-count { display: none !important; }
      .mw-inscription p { color: #444 !important; }
      .mw-inscription { border-top-color: #c41e3a !important; }
      .mw-modal { display: none !important; }
      .mw-brick:hover { transform: none !important; box-shadow: none !important; }
      .mw-brick::after { border-color: rgba(196,30,58,0.2) !important; }
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .mw-banner { padding: 50px 16px 30px; }
      .mw-toolbar select { flex: 1; }
      .mw-grid { gap: 10px; }
      .mw-brick { padding: 18px 14px 14px; }
      .mw-modal-box { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="mw-wrap">
  <!-- Banner -->
  <div class="mw-banner">
    <h1>下枫槎功德堂</h1>
    <div class="sub">凡捐资修谱建祠者 · 勒名于墙 · 永志不忘</div>
  </div>

  <!-- Toolbar -->
  <div class="mw-toolbar" id="mw-toolbar">
    <input type="text" id="mw-search" placeholder="🔍 搜索姓名..." oninput="filterMerit()">
    <select id="mw-category" onchange="filterMerit()">
      <option value="">全部功德</option>
      <option value="修谱功德">修谱功德</option>
      <option value="建祠功德">建祠功德</option>
      <option value="双项功德">双项功德</option>
    </select>
    <select id="mw-sort" onchange="renderMerit()">
      <option value="generation">按辈分</option>
      <option value="date">按时间</option>
      <option value="respects">按致敬</option>
    </select>
    <span class="stat" id="mw-stat"></span>
  </div>

  <!-- Grid -->
  <div class="mw-grid" id="mw-grid"></div>

  <!-- Modal -->
  <div class="mw-modal" id="mw-modal" onclick="if(event.target===this)closeModal()">
    <div class="mw-modal-box" id="mw-modal-box"></div>
  </div>

  <!-- Inscription -->
  <div class="mw-inscription">
    <h3>碑 记</h3>
    <p>
      盖闻木有本而枝叶茂，水有源而流派长。吾谢氏之先，出自姬姓。周宣王封元舅申伯于谢邑，
      因以国为氏，至今两千八百余载。明隆庆壬申，彬公、乾公昆仲迁居双枫古槎之下，开基立业，
      耕读传家，迄今四百五十余年。今有合族诸君，或捐资修谱以存世系，或慷慨建祠以奉先祖，
      或奔走联络以睦族谊。诸公共襄盛举，功在宗族，德被后昆。谨勒名于墙，彰善励来，
      俾后人知我族之昌盛，实赖先德之流泽也。
    </p>
    <p style="margin-top:12px;font-size:0.85rem;color:#b0a090;">
      公元二〇二六年丙午春  ·  下枫槎谢氏阖族敬立
    </p>
  </div>
</div>

<script>
// ===== Data =====
var meritData = [];
var respKey = 'mw_respected_';

function loadMerit() {
  // Always fetch fresh data from server, use localStorage as cache fallback
  fetch('../data/merit.json?' + Date.now()).then(function(r){return r.json()}).then(function(d){
    meritData = d;
    localStorage.setItem('xie_merit_data', JSON.stringify(d));
    renderMerit();
  }).catch(function(){
    var stored = localStorage.getItem('xie_merit_data');
    if (stored) {
      try { meritData = JSON.parse(stored); renderMerit(); return; } catch(e) {}
    }
    meritData = [];
    renderMerit();
  });
}

// ===== Render =====
function renderMerit() {
  var data = meritData.slice();
  var sort = document.getElementById('mw-sort').value;
  if (sort === 'generation') data.sort(function(a,b){return a.generation-b.generation || a.id-b.id;});
  else if (sort === 'date') data.sort(function(a,b){return (a.date||'0').localeCompare(b.date||'0') || a.id-b.id;});
  else if (sort === 'respects') data.sort(function(a,b){return (b.respects||0)-(a.respects||0) || a.id-b.id;});

  var grid = document.getElementById('mw-grid');
  var html = '';
  data.forEach(function(p, i){
    var hl = p.highlight ? ' highlight' : '';
    var respected = localStorage.getItem(respKey + p.id) === '1';
    html += '<div class="mw-brick' + hl + '" data-id="' + p.id + '" onclick="openModal(' + p.id + ')" style="transition-delay:' + (i * 0.04) + 's">';
    html += '<div class="brick-name">' + esc(p.name) + '</div>';
    html += '<div class="brick-gen">第' + p.generation + '世孙</div>';
    html += '<div class="brick-amount">' + esc(p.amount) + '</div>';
    html += '<div class="brick-category">' + esc(p.category) + '</div>';
    html += '<div class="brick-branch">' + esc(p.branch) + '</div>';
    html += '<div class="brick-respect">';
    html += '<span class="respect-btn' + (respected?' done':'') + '" onclick="event.stopPropagation();doRespect(' + p.id + ')" title="致敬">敬</span>';
    html += '<span class="respect-count" id="rc-' + p.id + '">' + (p.respects||0) + '</span>';
    html += '</div></div>';
  });
  if (data.length === 0) {
    html = '<div class="mw-empty">暂无功德记录</div>';
  }
  grid.innerHTML = html;
  document.getElementById('mw-stat').textContent = data.length + ' 人';

  // Scroll-in animation
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('visible'); } });
  }, {threshold:0.1});
  grid.querySelectorAll('.mw-brick').forEach(function(b){ observer.observe(b); });

  applyFilter(); // re-apply any active filter
}

// ===== Filter =====
function filterMerit() {
  var q = document.getElementById('mw-search').value.trim().toLowerCase();
  var cat = document.getElementById('mw-category').value;
  document.querySelectorAll('.mw-brick').forEach(function(b){
    var name = b.querySelector('.brick-name').textContent.toLowerCase();
    var catEl = b.querySelector('.brick-category').textContent;
    var show = (!q || name.indexOf(q) >= 0) && (!cat || catEl === cat);
    b.style.display = show ? '' : 'none';
  });
  var visible = document.querySelectorAll('.mw-brick[style*="display: none"]');
  var total = document.querySelectorAll('.mw-brick').length;
  document.getElementById('mw-stat').textContent = (total - visible.length) + ' / ' + total + ' 人';
}

function applyFilter() { filterMerit(); }

// ===== Modal =====
function openModal(id) {
  var p = null;
  for (var i = 0; i < meritData.length; i++) { if (meritData[i].id === id) { p = meritData[i]; break; } }
  if (!p) return;
  var box = document.getElementById('mw-modal-box');
  box.innerHTML =
    '<button class="mw-modal-close" onclick="closeModal()">✕</button>' +
    '<div class="mw-modal-name">' + esc(p.name) + '</div>' +
    '<div class="mw-modal-gen">第' + p.generation + '世孙 · ' + esc(p.branch) + '</div>' +
    '<div class="mw-modal-amount">' + esc(p.amount) + ' · ' + esc(p.category) + '</div>' +
    (p.biography ? '<div class="mw-modal-bio">' + esc(p.biography) + '</div>' : '') +
    (p.tribute ? '<div class="mw-modal-tribute">' + esc(p.tribute) + '</div>' : '');
  document.getElementById('mw-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('mw-modal').classList.remove('open');
}

// ===== Respect =====
function doRespect(id) {
  if (localStorage.getItem(respKey + id) === '1') return;
  localStorage.setItem(respKey + id, '1');
  for (var i = 0; i < meritData.length; i++) {
    if (meritData[i].id === id) {
      meritData[i].respects = (meritData[i].respects || 0) + 1;
      break;
    }
  }
  localStorage.setItem('xie_merit_data', JSON.stringify(meritData));
  var el = document.getElementById('rc-' + id);
  if (el) el.textContent = parseInt(el.textContent) + 1;
  var btn = el ? el.previousElementSibling : null;
  if (btn) btn.classList.add('done');
}

// ===== Util =====
function esc(t) { if (!t) return ''; return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ===== Init =====
loadMerit();

// Keyboard: ESC close modal
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
