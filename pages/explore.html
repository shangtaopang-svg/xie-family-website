  <script>
    (function(){
      var nav = document.getElementById('navhubNav');
      var links = nav ? Array.prototype.slice.call(nav.querySelectorAll('a')) : [];
      var title = document.getElementById('navhubTitle');
      var desc = document.getElementById('navhubDesc');
      var note = document.getElementById('navhubNote');
      var count = document.getElementById('navhubCount');
      var mark = document.getElementById('navhubMark');
      var enter = document.getElementById('navhubEnter');
      var enterText = document.getElementById('navhubEnterText');
      var filter = document.getElementById('navhubFilter');
      var currentLang = localStorage.getItem('xie_lang') === 'en' ? 'en' : 'zh';
      var marks = ['史','今','聚','告','闻','影','人','萃','谱','卷','听','联'];
      var english = [
        ['Family History','From the Xie family origin and migrations to the shared memory of Xiafengcha Village.','Learn where the family came from and how we arrived here today.'],
        ['Today at Xiafengcha','Explore today’s Xiafengcha through village views, daily life and recent changes.','The home village is not only history; it continues to grow every day.'],
        ['Family Activities','Records of ancestor ceremonies, reunions and family activities.','Keep every gathering close, so family memories have a place to return to.'],
        ['News','Village notices, family announcements and important updates.','Important messages are collected here for every family member.'],
        ['Reports','News coverage and outside records connected with Xiafengcha and the Xie family.','See the village and family through different recorded perspectives.'],
        ['Media Archive','Photos and videos preserving village views, people and family activities.','Some memories are best kept in images and revisited together.'],
        ['Notable Figures','People and stories from the Xie family that are worth remembering.','Follow the people who carry the family spirit forward.'],
        ['Xie Collection','Family documents, literature, stories and cultural materials gathered in one place.','Bring scattered family materials together, one piece at a time.'],
        ['Genealogy','Search the Xie family tree and discover connections between relatives.','Enter a name and follow the family tree to your connection.'],
        ['Merit Scroll','A record of contributions to the ancestral hall, genealogy and family community.','Every contribution becomes a memory passed on to the next generation.'],
        ['Listen to Xiafengcha','Audio stories of the village, family history and local memories.','Put on your headphones and hear a story from Xiafengcha.'],
        ['Contact Us','A place for submissions, suggestions and family contact.','Have a story, document or suggestion? We would love to hear from you.']
      ];
      var ui = {
        zh: { brand:'下枫槎谢氏', sub:'家族网站', search:'快速查找栏目…', nav:'栏目导航', back:'返回开启页', top:'下枫槎 · 谢氏家族', home:'进入主首页', eyebrow:'FAMILY NAVIGATION', hint:'选择左侧栏目查看内容', theme:'主题', language:'语言', light:'浅色', dark:'深色', langValue:'简体中文', enter:'进入' },
        en: { brand:'Xie Family of Xiafengcha', sub:'Family Website', search:'Search sections…', nav:'Navigation', back:'Back to opening', top:'Xiafengcha · Xie Family', home:'Main home', eyebrow:'FAMILY NAVIGATION', hint:'Select a section on the left', theme:'Theme', language:'Language', light:'Light', dark:'Dark', langValue:'English', enter:'Open ' }
      };
      function value(link, field) {
        var index = Number(link.getAttribute('data-index')) || 0;
        if (currentLang === 'en') return english[index] ? english[index][field === 'title' ? 0 : field === 'desc' ? 1 : 2] : '';
        return link.getAttribute('data-' + field) || '';
      }
      function select(link) {
        links.forEach(function(item){
          var active = item === link;
          item.classList.toggle('active', active);
          if (active) item.setAttribute('aria-current', 'page'); else item.removeAttribute('aria-current');
          item.querySelector('b').textContent = value(item, 'title');
        });
        var index = Number(link.getAttribute('data-index')) || 0;
        title.textContent = value(link, 'title');
        desc.textContent = value(link, 'desc');
        note.textContent = value(link, 'note');
        count.textContent = String(index + 1).padStart(2, '0') + ' / ' + String(links.length).padStart(2, '0');
        mark.textContent = marks[index] || '谢';
        enter.href = link.getAttribute('href');
        enterText.textContent = ui[currentLang].enter + value(link, 'title');
      }
      links.forEach(function(link){ link.addEventListener('click', function(e){ e.preventDefault(); select(link); }); });
      function applyFilter() {
        var query = filter ? filter.value.trim().toLowerCase() : '';
        links.forEach(function(link){
          var index = Number(link.getAttribute('data-index')) || 0;
          var searchText = (value(link, 'title') + ' ' + value(link, 'desc') + ' ' + (currentLang === 'en' && english[index] ? english[index][0] : '')).toLowerCase();
          link.hidden = !!query && searchText.indexOf(query) === -1;
        });
      }
      if (filter) {
        filter.addEventListener('input', applyFilter);
        document.addEventListener('keydown', function(e){ if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); filter.focus(); } });
      }
      function syncLanguage() {
        var text = ui[currentLang];
        document.documentElement.lang = currentLang === 'en' ? 'en' : 'zh-CN';
        document.title = currentLang === 'en' ? 'Explore · Xie Family of Xiafengcha' : '探索栏目 · 下枫槎谢氏';
        document.querySelector('.navhub-brand b').textContent = text.brand;
        document.querySelector('.navhub-brand small').textContent = text.sub;
        filter.placeholder = text.search;
        filter.setAttribute('aria-label', text.search);
        document.getElementById('navhubNavTitle').textContent = text.nav;
        document.getElementById('navhubBackText').textContent = text.back;
        document.getElementById('navhubTopBrand').textContent = text.top;
        document.getElementById('navhubHomeText').textContent = text.home;
        document.getElementById('navhubEyebrow').textContent = text.eyebrow;
        document.getElementById('navhubDetailHint').textContent = text.hint;
        document.getElementById('navhubThemeLabel').textContent = text.theme;
        document.getElementById('navhubLanguageLabel').textContent = text.language;
        document.getElementById('navhubLanguageValue').textContent = currentLang === 'en' ? 'English' : '简体中文';
        var active = links.find(function(link){ return link.classList.contains('active'); }) || links[0];
        if (active) select(active);
        applyFilter();
      }
      var themeControl = document.getElementById('navhubThemeControl');
      var themeValue = document.getElementById('navhubThemeValue');
      var languageControl = document.getElementById('navhubLanguageControl');
      var languageValue = document.getElementById('navhubLanguageValue');
      var themeMeta = document.getElementById('navhubThemeColor');
      function syncTheme() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        themeValue.textContent = isDark ? ui[currentLang].dark : ui[currentLang].light;
        themeControl.setAttribute('aria-label', currentLang === 'en' ? (isDark ? 'Switch to light mode' : 'Switch to dark mode') : (isDark ? '切换到白天模式' : '切换到黑夜模式'));
        languageValue.textContent = currentLang === 'en' ? 'English' : '简体中文';
        if (themeMeta) themeMeta.setAttribute('content', isDark ? '#000000' : '#f7f8f7');
      }
      themeControl.addEventListener('click', function(){
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark');
        try { localStorage.setItem('xie_theme', isDark ? 'light' : 'dark'); localStorage.setItem('theme', isDark ? 'light' : 'dark'); } catch (e) {}
        syncTheme();
      });
      enter.addEventListener('click', function(){
        try { sessionStorage.setItem('back_to', window.location.href); } catch (e) {}
      });
      languageControl.addEventListener('click', function(){
        currentLang = currentLang === 'en' ? 'zh' : 'en';
        try { localStorage.setItem('xie_lang', currentLang); } catch (e) {}
        syncLanguage();
        syncTheme();
      });
      syncLanguage();
      syncTheme();
    })();
  </script>
