<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 · 下枫槎谢氏</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
      background: #0a0a0a; color: #f5f5f5; min-height: 100vh;
      padding-bottom: 80px;
    }
    .header { padding: 48px 20px 20px; text-align: center; }
    .header .avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: #D4FF3A; color: #000;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; margin: 0 auto 12px;
    }
    .header h1 { font-size: 22px; font-weight: 700; color: #fff; }
    .header p { font-size: 13px; color: #888; margin-top: 4px; }

    .info-card {
      margin: 0 16px 16px; padding: 20px;
      background: #141414; border: 1px solid #2a2a2a; border-radius: 20px;
    }
    .info-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid #2a2a2a;
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { font-size: 13px; color: #888; }
    .info-value { font-size: 14px; color: #fff; font-weight: 500; }

    .menu-list { margin: 0 16px 16px; }
    .menu-item {
      display: flex; align-items: center; gap: 14px;
      padding: 16px; text-decoration: none;
      background: #141414; border: 1px solid #2a2a2a; border-radius: 14px;
      margin-bottom: 8px;
    }
    .menu-item:active { opacity: 0.6; }
    .menu-icon { font-size: 20px; width: 28px; text-align: center; }
    .menu-text { flex: 1; font-size: 14px; color: #fff; font-weight: 500; }
    .menu-arrow { font-size: 12px; color: #D4FF3A; opacity: 0.5; }

    .unreg-card {
      margin: 0 16px 16px; padding: 36px 24px;
      background: #141414; border: 1px solid #2a2a2a; border-radius: 20px;
      text-align: center;
    }
    .unreg-card h3 { font-size: 18px; color: #fff; margin-bottom: 8px; }
    .unreg-card p { font-size: 13px; color: #888; margin-bottom: 20px; line-height: 1.6; }
    .unreg-btn {
      display: inline-flex; padding: 14px 32px;
      background: #D4FF3A; color: #000; border-radius: 999px;
      font-size: 15px; font-weight: 700; text-decoration: none;
    }
    .unreg-btn:active { opacity: 0.8; }
    /* ===== 底部黄色胶囊导航 ===== */
    .mb-tabbar {
      display: flex !important; gap: 8px; padding: 8px 16px;
      justify-content: center; align-items: center;
      position: fixed; bottom: 0; left: 0; right: 0;
      background: transparent; border: none; z-index: 999999;
    }
    .mb-tab {
      display: flex; align-items: center; gap: 4px;
      padding: 8px 14px; border-radius: 999px;
      background: rgba(255,255,255,0.08); border: none;
      text-decoration: none; color: rgba(255,255,255,0.5);
      font-size: 12px; transition: all 0.2s;
    }
    .mb-tab.active { background: #FFC107; color: #000; font-weight: 700; }
    .mb-tab:active { transform: scale(0.96); }
    .mb-tab-icon { font-size: 14px; }
    .mb-tab-label { font-size: 11px; }
    .back-page-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 8px 18px; border-radius: 999px;
      background: #FFC107; color: #000;
      text-decoration: none; font-size: 12px; font-weight: 700;
      box-shadow: 0 2px 8px rgba(255,193,7,0.3);
    }
    .back-page-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
<div id="app"></div>


<script>
(function(){
  var data = localStorage.getItem('mb_clan_data');
  var app = document.getElementById('app');

  if (!data) {
    app.innerHTML = '<div class="header"><div class="avatar">?</div><h1>未登记</h1><p>您尚未登记</p></div><div class="unreg-card"><h3>📋 欢迎登记</h3><p>登记后即可查看个人信息</p><a href="clan-register.html" class="unreg-btn">📋 立即登记</a></div>';
    return;
  }

  var info = JSON.parse(data);
  var isClan = info.isClan === true || info.type === '族人';
  var typeLabel = isClan ? '下枫槎谢氏 · 族人' : '下枫槎村 · 访客';
  var avatar = info.name ? info.name.charAt(0) : '?';

  var cardHtml = '<div class="header"><div class="avatar">' + avatar + '</div><h1>' + (info.name || '-') + '</h1><p>' + typeLabel + '</p></div><div class="info-card"><div class="info-row"><span class="info-label">姓名</span><span class="info-value">' + (info.name || '-') + '</span></div><div class="info-row"><span class="info-label">电话</span><span class="info-value">' + (info.phone || '-') + '</span></div><div class="info-row"><span class="info-label">类型</span><span class="info-value">' + (info.type || '-') + '</span></div>';

  if (isClan) {
    cardHtml += '<div class="info-row"><span class="info-label">字辈/世代</span><span class="info-value">' + (info.generation || '-') + '</span></div><div class="info-row"><span class="info-label">父亲</span><span class="info-value">' + (info.father || '-') + '</span></div><div class="info-row"><span class="info-label">分支</span><span class="info-value">' + (info.branch || '-') + '</span></div>';
  } else {
    cardHtml += '<div class="info-row"><span class="info-label">微信</span><span class="info-value">' + (info.wechat || '-') + '</span></div><div class="info-row"><span class="info-label">来访目的</span><span class="info-value">' + (info.purpose || '-') + '</span></div>';
  }
  cardHtml += '<div class="info-row"><span class="info-label">登记时间</span><span class="info-value">' + (info.time || '-') + '</span></div></div><div class="menu-list"><a href="clan-register.html" class="menu-item"><span class="menu-icon">✏️</span><span class="menu-text">编辑资料</span><span class="menu-arrow">▶</span></a></div>';

  app.innerHTML = cardHtml;
})();
  </script>
<script>document.getElementById("backBtn")&&document.getElementById("backBtn").addEventListener("click",function(e){e.preventDefault();try{var u=sessionStorage.getItem("back_to");if(u&&u!==window.location.href&&!u.includes(location.host+"/?")){location.href=u;return}}catch(ex){}if(window.history.length>1)window.history.go(-1);else location.href="../entrance.html"});</script>

</body>
</html>
