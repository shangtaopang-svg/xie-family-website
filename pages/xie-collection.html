<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谢氏集萃 · 下枫槎谢氏</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css?v=5">
<style>
.page-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 60px; }
.page-header { text-align: center; margin-bottom: 32px; }
.page-header h1 { font-size: 26px; font-weight: 700; color: var(--text); letter-spacing: 4px; }
.page-header .sub { font-size: 13px; color: var(--text-light); margin-top: 6px; letter-spacing: 2px; }
.back-link { display: inline-block; margin-bottom: 14px; color: var(--text-light); text-decoration: none; font-size: 13px; }
.back-link:hover { color: var(--primary); }

.cat-tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
.cat-tab { padding: 7px 20px; border-radius: 20px; border: 2px solid var(--border); background: var(--card); cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text-light); font-family: var(--font); transition: all 0.2s; }
.cat-tab:hover { border-color: var(--primary); color: var(--primary); }
.cat-tab.active { background: var(--primary-dark); color: #fff; border-color: var(--primary-dark); }
.cat-tab .badge { display: inline-block; background: rgba(255,255,255,0.2); color: #fff; font-size: 11px; padding: 0 7px; border-radius: 10px; margin-left: 4px; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
.card-grid .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-light); }
.card-grid .empty-state .icon { font-size: 48px; display: block; margin-bottom: 10px; }
.card-grid .empty-state p { font-size: 14px; }

.collect-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.04); cursor:pointer; position:relative; }
.collect-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.12); }

/* ===== 悬浮预览 ===== */
.card-hover-wrap { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; display:flex; }
.card-cover { position:absolute; inset:0; z-index:2; transition:transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94); background:#e8e5e0; display:flex; align-items:center; justify-content:center; }
.card-cover img { width:100%; height:100%; object-fit:cover; display:block; }
.card-cover .placeholder { font-size:38px; color:#ccc; }
.card-cover .play-badge { position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.7); color:#fff; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; transition:transform 0.15s; }
.collect-card:hover .play-badge { transform:scale(1.1); background:rgba(0,0,0,0.85); }

.card-preview { position:absolute; inset:0; z-index:1; transition:transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94); transform:translateX(100%); }
.card-preview .preview-inner { width:100%; height:100%; }
.card-preview iframe { width:100%; height:100%; border:none; }

.collect-card:hover .card-cover { transform:translateX(-40%); }
.collect-card:hover .card-preview { transform:translateX(0); }

.collect-card .info { padding: 10px 12px; position:relative; z-index:3; background:var(--card); }
.collect-card .info .title { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.collect-card .info .meta { display: flex; align-items: center; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.collect-card .info .meta .tag { font-size: 11px; padding: 2px 8px; border-radius: 3px; font-weight: 600; }
.collect-card .info .meta .tag.bilibili { background: #e8f0fe; color: #1e90ff; }
.collect-card .info .meta .tag.video { background: #fef2f2; color: #e53e3e; }
.collect-card .info .meta .tag.wechat { background: #f0faf4; color: #27ae60; }
.collect-card .info .meta .tag.other { background: #f5f0e8; color: #8a7a6a; }
.collect-card .info .meta .cat { font-size: 11px; padding: 2px 8px; border-radius: 3px; background: #f0ede8; color: var(--text-light); }

.no-data-hint { text-align: center; margin-top: 60px; padding: 40px; }
.no-data-hint .icon { font-size: 48px; display: block; margin-bottom: 10px; }
.no-data-hint p { font-size: 14px; color: var(--text-light); }
.no-data-hint .link { display: inline-block; margin-top: 12px; padding: 8px 20px; border: 2px solid var(--primary); border-radius: 6px; color: var(--primary); text-decoration: none; font-weight: 600; font-size: 13px; }

@media (max-width: 600px) {
  .page-wrap { padding: 80px 14px 40px; }
  .card-grid { grid-template-columns: 1fr; }
  .cat-tab { padding: 6px 14px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="page-wrap">
  <a href="../index.html" class="back-link">← 返回首页</a>
  <div class="page-header">
    <h1>📚 谢氏集萃</h1>
    <p class="sub">汇集谢氏起源 · 历史名人 · 宗族文化</p>
  </div>

  <div class="cat-tabs" id="catTabs"></div>
  <div class="card-grid" id="cardGrid"></div>
  <div id="noDataHint" class="no-data-hint" style="display:none">
    <span class="icon">📭</span>
    <p>暂无内容，管理员请到后台添加</p>
    <a href="admin.html" class="link">🔐 管理后台</a>
  </div>
</div>

<script>
// ===== 从服务器加载数据 =====
var collectionData = [];

function loadData(callback) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/xie-collection', true);
  xhr.onload = function() {
    try {
      var d = JSON.parse(xhr.responseText);
      if (d && d.length) { collectionData = d; if(callback) callback(); return; }
    } catch(e) {}
    // fallback: localStorage
    try {
      var raw = localStorage.getItem('xie_admin_xieCollection');
      if (raw) { collectionData = JSON.parse(raw); if(callback) callback(); return; }
    } catch(e2) {}
    if (callback) callback();
  };
  xhr.onerror = function() {
    try {
      var raw = localStorage.getItem('xie_admin_xieCollection');
      if (raw) { collectionData = JSON.parse(raw); }
    } catch(e) {}
    if (callback) callback();
  };
  xhr.send();
}
var TABS = [
  { id: 'all', label: '全部', icon: '📋' },
  { id: 'origin', label: '家族起源', icon: '🏛' },
  { id: 'celebrity', label: '历史名人', icon: '👤' },
  { id: 'genealogy', label: '宗谱文化', icon: '📜' }
];
var CAT_MAP = { '家族起源': 'origin', '历史名人': 'celebrity', '宗谱文化': 'genealogy' };
var CAT_REV = { origin: '家族起源', celebrity: '历史名人', genealogy: '宗谱文化' };
var SOURCE_CLASS = { 'B站': 'bilibili', '视频号': 'video', '公众号': 'wechat' };

function render(cat) {
  cat = cat || 'all';
  var grid = document.getElementById('cardGrid');
  var noData = document.getElementById('noDataHint');

  if (!collectionData.length) {
    grid.innerHTML = '';
    noData.style.display = 'block';
    document.getElementById('catTabs').innerHTML = '';
    return;
  }
  noData.style.display = 'none';

  var filtered = cat === 'all' ? collectionData : collectionData.filter(function(i){ return (CAT_MAP[i.cat] || i.cat) === cat; });

  // 分类标签
  var tabsHtml = '';
  TABS.forEach(function(t){
    var cnt = t.id === 'all' ? collectionData.length : collectionData.filter(function(i){ return (CAT_MAP[i.cat] || i.cat) === t.id; }).length;
    var active = t.id === cat ? ' active' : '';
    tabsHtml += '<button class="cat-tab' + active + '" onclick="render(\'' + t.id + '\')">' + t.icon + ' ' + t.label + ' <span class="badge">' + cnt + '</span></button>';
  });
  document.getElementById('catTabs').innerHTML = tabsHtml;

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty-state"><span class="icon">📭</span><p>该分类暂无内容</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(function(item){
    var title = item.title || '未命名';
    var url = item.url || '#';
    var source = item.source || '其他';
    var catLabel = item.cat ? (CAT_REV[item.cat] || item.cat) : '';
    var desc = item.desc || '';
    var hasPoster = item.poster && (item.poster.indexOf('/') >= 0 || item.poster.indexOf('http') === 0);
    var srcClass = SOURCE_CLASS[source] || 'other';
    var dataAttrs = 'data-poster="' + (item.poster || '') + '" data-url="' + url.replace(/"/g,'&quot;') + '"';

    var bvMatch = url.match(/bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/i);
    var bvid = bvMatch ? bvMatch[1] : null;

    return '<a href="' + url + '" target="_blank" rel="noopener" class="collect-card" style="text-decoration:none"' + dataAttrs + '>' +
      '<div class="card-hover-wrap">' +
        '<div class="card-cover">' +
          (hasPoster ? '<img src="' + item.poster + '" alt="" loading="lazy" referrerpolicy="no-referrer">' : '<span class="placeholder">🎬</span>') +
          '<span class="play-badge">▶</span>' +
        '</div>' +
        (bvid ? '<div class="card-preview"><div class="preview-inner" data-bvid="' + bvid + '"></div></div>' : '') +
      '</div>' +
      '<div class="info">' +
        '<div class="meta">' +
          '<span class="tag ' + srcClass + '">' + source + '</span>' +
          (catLabel ? '<span class="cat">' + catLabel + '</span>' : '') +
        '</div>' +
        '<div class="title">' + title + '</div>' +
      '</div></a>';
  }).join('');

  // 对没有封面的B站视频尝试自动获取封面
  setTimeout(function(){
    var cards = grid.querySelectorAll('.collect-card');
    cards.forEach(function(card){
      var poster = card.dataset.poster;
      if (poster) return;
      var videoUrl = card.dataset.url;
      if (!videoUrl) return;
      var bvid = (videoUrl.match(/bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/i) || [])[1];
      if (!bvid) { bvid = (videoUrl.match(/b23\.tv\/([a-zA-Z0-9]+)/i) || [])[1]; }
      if (!bvid) return;
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/bilibili-cover?bvid=' + bvid, true);
      xhr.onload = function(){
        try {
          var r = JSON.parse(xhr.responseText);
          if (r.cover) {
            var cover = card.querySelector('.card-cover');
            if (cover) {
              cover.innerHTML = '<img src="' + r.cover + '" alt="" loading="lazy" referrerpolicy="no-referrer">' + (cover.querySelector('.play-badge') ? cover.querySelector('.play-badge').outerHTML : '▶');
            }
          }
        } catch(e){}
      };
      xhr.send();
    });
  }, 500);
}

// 悬浮懒加载 B站 iframe（用mouseover代替mouseenter支持事件代理）
document.addEventListener('mouseover', function(e){
  var el = e.target;
  if (!el || !el.closest) return;
  var card = el.closest('.collect-card');
  if (!card) return;
  if (card._previewLoaded) return;
  card._previewLoaded = true;
  var inner = card.querySelector('.preview-inner');
  if (!inner) return;
  var bvid = inner.dataset.bvid;
  if (!bvid) return;
  var iframe = document.createElement('iframe');
  iframe.src = 'https://player.bilibili.com/player.html?bvid=' + bvid + '&autoplay=1&muted=1&high_quality=1';
  iframe.allow = 'autoplay; fullscreen';
  iframe.setAttribute('allowfullscreen', '');
  iframe.loading = 'lazy';
  iframe.style.cssText = 'width:100%;height:100%;border:none;';
  inner.appendChild(iframe);
}, true);

loadData(function(){
  render('all');
});

// 监听 localStorage 变化（后台修改后自动更新）
window.addEventListener('storage', function(e) {
  if (e.key === 'xie_admin_xieCollection') {
    loadData(function(){
      var activeTab = document.querySelector('.cat-tab.active');
      render(activeTab ? activeTab.dataset.cat : 'all');
    });
  }
});
</script>
</body>
</html>
