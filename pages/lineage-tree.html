<!DOCTYPE html>
<!-- 世系图谱独立页：手机端从族谱查询进入，默认竖屏；点击 ⛶ 后全屏并立即横屏，桌面端也可访问。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世系图谱 · 下枫槎谢氏</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="../css/style.css?v=20260901-entry-switch-02">
  <link rel="stylesheet" href="../css/genealogy-tree.css?v=20260830-lineage-landscape-06">
  <!-- 实时同步关键：supabase.js 提供 window.dbGetAll，共享 JS 内 tryLoadLiveGenealogy 据此从后台拉最新数据 -->
  <script defer src="../js/i18n.js"></script>
  <script defer src="../js/supabase.js?v=3"></script>
  <link rel="manifest" href="../manifest.json">
  <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("../sw.js");</script>
  <style>
    body { padding-bottom: 40px; }
    /* 顶部返回链接（桌面/非全屏可见） */
    .lineage-back-bar { padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
    .lineage-back-bar a { color: var(--accent-orange); text-decoration: none; font-size: 14px; font-weight: 600; }
    .lineage-back-bar a:hover { text-decoration: underline; }
    .lineage-back-bar .sep { flex: 1; }
    .lineage-back-bar .hint { font-size: 12px; color: var(--text-tertiary); }
    /* Admin-style 世系树（与 pages/genealogy.html 内联 apt CSS 同步，桌面端 renderTreeSVG 走 buildAdminTreeHtml） */
    .apt-tree{position:relative;padding:20px;display:flex;flex-direction:column;align-items:flex-start;}
    .apt-person{display:flex;flex-direction:column;align-items:center;}
    .apt-card{display:flex;flex-direction:column;align-items:flex-start;padding:8px 14px;border-radius:8px;border:2px solid var(--glass-border);background:var(--bg-card);cursor:pointer;transition:all 0.15s;position:relative;min-width:120px;}
    .apt-card-inner{width:100%;}
    .apt-card-actions{display:flex;gap:2px;margin-bottom:4px;opacity:0.5;}
    .apt-card-actions:hover{opacity:1;}
    .apt-btn-add,.apt-btn-del{width:20px;height:20px;border:none;border-radius:50%;font-size:12px;line-height:1;cursor:pointer;font-weight:700;padding:0;transition:transform 0.1s;}
    .apt-btn-add{background:#4a9eff;color:#fff;}
    .apt-btn-del{background:#e74c3c;color:#fff;}
    .apt-card:hover{border-color:var(--accent-orange);box-shadow:0 2px 8px rgba(251,146,60,0.12);transform:translateY(-1px);}
    .apt-male{border-left:3px solid #4a9eff;}
    .apt-name{font-size:14px;font-weight:600;color:#ff6b00!important;white-space:nowrap;}
    .apt-meta{font-size:10px;color:var(--text-tertiary);margin-top:2px;}
    .apt-branch{font-size:9px;padding:1px 6px;border-radius:3px;background:var(--accent-orange-dim);color:var(--accent-orange);margin-top:2px;display:inline-block;}
    .apt-children-count{font-size:8px;color:var(--text-tertiary);margin-top:2px;opacity:0.5;}
    .apt-children{position:relative;}
    .apt-child{display:flex;flex-direction:column;align-items:center;position:relative;flex:none;}
    .apt-cards-row{display:flex;gap:6px;position:relative;}
    .apt-subs-row{display:block;}
    .apt-sub{position:absolute;top:0;left:0;width:max-content;}
    .apt-sub-bridge{position:absolute;height:2px;background:var(--accent-orange);opacity:0.18;pointer-events:none;}
    .apt-connector{width:2px;height:18px;background:var(--accent-orange);opacity:0.2;margin:0 auto;}
    .apt-vline{width:2px;height:12px;background:var(--accent-orange);opacity:0.15;}
    .apt-children-wrap{display:block;}
    .apt-hline{position:absolute;top:0;left:6px;right:6px;height:2px;background:var(--accent-orange);opacity:0.15;}
    .apt-btn-expand{width:18px;height:18px;border:none;border-radius:50%;font-size:10px;line-height:1;cursor:pointer;background:var(--accent-orange);color:#fff;transition:transform 0.1s;}
    .apt-btn-expand:hover{transform:scale(1.2);}
  </style>
</head>
<body class="genealogy-tree-page">
  <div class="lineage-back-bar">
    <a href="genealogy.html">← 返回族谱查询</a>
    <span class="sep"></span>
    <span class="hint">点击姓名查看详情 · ⛶ 可全屏横屏</span>
  </div>

  <!-- ===== 世系图谱（与 genealogy.html 同一 section DOM，共享 JS/CSS） ===== -->
  <div class="glass-card" style="padding:24px;margin-bottom:30px;opacity:0;" id="genealogy-tree-section">
    <div class="lineage-tree-toolbar" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
      <h3 style="font-family:var(--font-title);color:var(--text-primary);font-size:17px;font-weight:500;margin:0;">🌳 世系图谱 <a href="focus-tree.html" style="font-size:11px;font-weight:400;color:var(--accent-orange);text-decoration:none;margin-left:8px;">🌳 世系树</a></h3>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span style="font-size:12px;color:var(--text-tertiary);">点击姓名查看详情</span>
        <button class="btn btn-sm" onclick="treeZoomIn()" title="放大">🔍+</button>
        <button class="btn btn-sm" onclick="treeZoomOut()" title="缩小">🔍−</button>
        <button class="btn btn-sm" onclick="treeZoomReset()" title="重置缩放">1:1</button>
        <button class="btn btn-sm" onclick="pageTreeFullscreen()" style="font-size:11px;padding:5px 12px;border-radius:6px;border:1px solid var(--glass-border);background:var(--glass-bg);cursor:pointer;"><span>⛶ 全屏</span><span class="mbl-fs-label" style="display:none;">⛶ 横屏</span></button><span id="tree-zoom-level" style="font-size:11px;color:var(--text-tertiary);min-width:32px;text-align:center;">100%</span>
        <button class="btn btn-sm" onclick="pageTreeFullscreen()" title="全屏观看" style="background:var(--accent-orange-dim);border-color:var(--accent-orange);">⛶ 全屏</button>
        <button class="btn btn-sm" id="mbl-global-btn" onclick="toggleMobileGlobal()" title="整树全貌 / 可读切换（手机端）" style="display:none;font-size:11px;padding:5px 12px;border-radius:6px;border:1px solid var(--glass-border);background:var(--glass-bg);cursor:pointer;">☗ 全貌</button>
        <button class="btn btn-sm" onclick="exportTreePNG()" title="导出为图片" style="background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.3);">📥 导出</button>
        <span style="width:1px;height:18px;background:var(--divider);margin:0 4px;"></span>
      </div>
    </div>
    <!-- 视图切换标签 -->
    <div class="lineage-tree-filters" style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center;padding:6px 0;">
      <span style="font-size:12px;color:var(--text-tertiary);font-weight:500;">分支：</span>
      <button class="btn btn-xs" id="filter-continuous" onclick="filterBranch('连续完整世系')" style="background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff;border:none;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;box-shadow:0 1px 4px rgba(234,88,12,0.35);">连续完整世系（炎帝→后枫槎）</button>
      <button class="btn btn-xs" id="filter-allsystem" onclick="filterBranch('全世系总览')" style="background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:none;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;box-shadow:0 1px 4px rgba(16,185,129,0.35);">全世系总览（炎帝→现在）</button>
      <button class="btn btn-xs" id="filter-all" onclick="filterBranch('all')" style="background:var(--accent-orange);color:#fff;border:none;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;border-radius:6px;">全部世系</button>
      <button class="btn btn-xs" id="filter-yuangud" onclick="filterBranch('远古世系')" style="background:var(--glass-bg);color:var(--text-secondary);border:1px solid var(--glass-border);padding:4px 12px;font-size:12px;cursor:pointer;border-radius:6px;">远古世系</button>
      <button class="btn btn-xs" id="filter-shenbo" onclick="filterBranch('申伯世系')" style="background:var(--glass-bg);color:var(--text-secondary);border:1px solid var(--glass-border);padding:4px 12px;font-size:12px;cursor:pointer;border-radius:6px;">申伯世系</button>
      <button class="btn btn-xs" id="filter-dongshan" onclick="filterBranch('始宁东山世系')" style="background:var(--glass-bg);color:var(--text-secondary);border:1px solid var(--glass-border);padding:4px 12px;font-size:12px;cursor:pointer;border-radius:6px;">始宁东山世系</button>
      <button class="btn btn-xs" id="filter-linhai" onclick="filterBranch('临海下渡世系')" style="background:var(--glass-bg);color:var(--text-secondary);border:1px solid var(--glass-border);padding:4px 12px;font-size:12px;cursor:pointer;border-radius:6px;">临海下渡世系</button>
      <button class="btn btn-xs" id="filter-shima" onclick="filterBranch('石马下谢分房')" style="background:var(--glass-bg);color:var(--text-secondary);border:1px solid var(--glass-border);padding:4px 12px;font-size:12px;cursor:pointer;border-radius:6px;">石马（下谢）分房派</button>
      <button class="btn btn-xs" id="filter-houfengcha" onclick="filterBranch('本宗世系图（后枫槎）')" style="background:var(--glass-bg);color:var(--text-secondary);border:1px solid var(--glass-border);padding:4px 12px;font-size:12px;cursor:pointer;border-radius:6px;">本宗世系图（后枫槎）</button>
    </div>
    <!-- 树容器 -->
    <div class="genealogy-tree-scroll" id="tree-scroll-container">
      <div id="tree-container"></div>
    </div>
<button id="fs-close-btn" onclick="exitPageFullscreen()" style="display:none;position:absolute;top:16px;right:16px;z-index:99999;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:14px;cursor:pointer;">✕ 退出全屏</button>
  </div>

  <!-- 共享世系图谱 JS（数据/渲染/全屏横屏）必须先于 admin.js onload 执行。
       手机端进入页面保持竖屏；点击 ⛶ 全屏/横屏按钮后立即启用 CSS 横屏兜底，
       同时尝试系统方向锁（pageTreeFullscreen）。 -->
  <script src="../js/genealogy-tree.js?v=20260830-lineage-landscape-05"></script>
  <script src="../js/admin.js?v=110" onload="if(window.renderTreeSVG&&window.getGenealogyData)setTimeout(function(){renderTreeSVG(getGenealogyData())},100)"></script>
<link rel="stylesheet" href="/css/ai.css?v=96">
<script src="/js/ai-assistant.js?v=97" defer></script>
<link rel="stylesheet" href="/css/public-access-gate.css?v=20260826-access-04">
<script src="/js/public-access-gate.js?v=20260828-trusted-device-02" defer></script>
</body>
</html>
