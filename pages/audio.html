<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);font-family:"Noto Serif SC","Source Han Serif SC",serif;color:#fff;overflow-x:hidden}
.audio-page{max-width:800px;margin:0 auto;padding:40px 24px 60px}
.audio-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
.audio-header .back{color:rgba(255,255,255,0.5);text-decoration:none;font-size:14px;transition:color .2s}
.audio-header .back:hover{color:#fff}
.audio-header h1{font-size:22px;font-weight:600;letter-spacing:4px;color:rgba(255,255,255,0.9)}
.audio-header .spacer{width:60px}
.player-card{background:rgba(255,255,255,0.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;padding:36px 32px 32px;border:1px solid rgba(255,255,255,0.08);margin-bottom:32px}
.now-playing{text-align:center;margin-bottom:24px}
.now-playing .np-emoji{font-size:42px;margin-bottom:8px}
.now-playing .np-title{font-size:20px;font-weight:600;color:#fff;margin-bottom:4px}
.now-playing .np-sub{font-size:13px;color:rgba(255,255,255,0.4);letter-spacing:2px}
.now-playing .np-status{font-size:12px;color:rgba(255,255,255,0.3);margin-top:4px}
.progress-wrap{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.progress-time{font-size:12px;color:rgba(255,255,255,0.4);white-space:nowrap;min-width:36px}
.progress-bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.1);cursor:pointer;position:relative;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#c9a84c,#f0d68a);width:0%;transition:width .1s}
.controls{display:flex;align-items:center;justify-content:center;gap:20px}
.ctrl-btn{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .2s;background:rgba(255,255,255,0.08);color:#fff}
.ctrl-btn:hover{background:rgba(255,255,255,0.15);transform:scale(1.05)}
.ctrl-btn.primary{width:60px;height:60px;background:linear-gradient(135deg,#c9a84c,#f0d68a);color:#1a1a2e;font-size:24px;box-shadow:0 4px 20px rgba(201,168,76,0.3)}
.ctrl-btn.primary:hover{transform:scale(1.08);box-shadow:0 6px 30px rgba(201,168,76,0.4)}
.ctrl-btn:disabled{opacity:.3;cursor:default;transform:none!important}
#subtitle-wrap{display:none;margin-bottom:24px;background:rgba(255,255,255,0.04);border-radius:16px;padding:20px 24px;max-height:280px;overflow-y:auto;border:1px solid rgba(255,255,255,0.06)}
#subtitle-wrap::-webkit-scrollbar{width:4px}
#subtitle-wrap::-webkit-scrollbar-track{background:transparent}
#subtitle-wrap::-webkit-scrollbar-thumb{background:rgba(201,168,76,0.2);border-radius:2px}
#subtitle-content{font-size:16px;line-height:2.2;color:rgba(255,255,255,0.7);font-family:'Noto Serif SC',serif}
.section-title-audio{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title-audio h2{font-size:16px;font-weight:600;color:rgba(255,255,255,0.6);letter-spacing:2px}
.section-title-audio .bg-toggle{font-size:12px;color:rgba(255,255,255,0.3);cursor:pointer;transition:color .2s;background:none;border:none;font-family:inherit}
.section-title-audio .bg-toggle:hover{color:#fff}
.chapter-list{display:flex;flex-direction:column;gap:10px}
.chapter{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:14px;cursor:pointer;transition:all .3s;background:rgba(255,255,255,0.03);border:1px solid transparent}
.chapter:hover{background:rgba(255,255,255,0.06)}
.chapter.active{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.2)}
.chapter.done{opacity:.6}
.chapter .ch-emoji{font-size:24px;flex-shrink:0;width:32px;text-align:center}
.chapter .ch-info{flex:1}
.chapter .ch-title{font-size:15px;font-weight:500;color:rgba(255,255,255,0.8)}
.chapter .ch-status{font-size:16px;flex-shrink:0;width:24px;text-align:center}
.chapter .ch-status.done{color:#4caf50}
.chapter .ch-status.playing{color:#c9a84c;animation:pulse 1.2s infinite}
.chapter .ch-status.pending{color:rgba(255,255,255,0.15)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* ambient particles */
@keyframes float{0%,100%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:0.6}50%{transform:translateY(-30vh) translateX(10px);opacity:0.3}90%{opacity:0}100%{transform:translateY(-60vh) translateX(-5px);opacity:0}}
.ambient-particle{position:fixed;width:3px;height:3px;border-radius:50%;background:rgba(201,168,76,0.3);pointer-events:none;z-index:0;animation:float 8s infinite}
.ambient-particle:nth-child(1){left:10%;animation-delay:0s;width:2px;height:2px}
.ambient-particle:nth-child(2){left:30%;animation-delay:2s;width:4px;height:4px}
.ambient-particle:nth-child(3){left:50%;animation-delay:4s;width:2px;height:2px}
.ambient-particle:nth-child(4){left:70%;animation-delay:1s;width:3px;height:3px}
.ambient-particle:nth-child(5){left:90%;animation-delay:3s;width:2px;height:2px}
.ambient-particle:nth-child(6){left:20%;animation-delay:5s;width:3px;height:3px}
.ambient-particle:nth-child(7){left:60%;animation-delay:6s;width:2px;height:2px}
.ambient-particle:nth-child(8){left:80%;animation-delay:7s;width:4px;height:4px}

/* bg music - redesigned */
.bg-indicator{display:flex;align-items:center;gap:12px;margin-top:20px;padding:14px 20px;background:linear-gradient(135deg,rgba(201,168,76,0.06),rgba(201,168,76,0.02));border-radius:12px;border:1px solid rgba(201,168,76,0.08);font-size:12px;color:rgba(255,255,255,0.4);cursor:pointer;transition:all .3s}
.bg-indicator:hover{background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.04));border-color:rgba(201,168,76,0.15)}
.bg-indicator .eq{display:flex;align-items:flex-end;gap:2px;height:16px}
.bg-indicator .eq span{width:3px;background:linear-gradient(180deg,#f0d68a,#c9a84c);border-radius:2px}
.bg-indicator .eq .b1{height:6px;animation:eqBar .8s ease-in-out infinite alternate}
.bg-indicator .eq .b2{height:10px;animation:eqBar 1.1s ease-in-out infinite alternate .15s}
.bg-indicator .eq .b3{height:14px;animation:eqBar .9s ease-in-out infinite alternate .3s}
.bg-indicator .eq .b4{height:8px;animation:eqBar 1.0s ease-in-out infinite alternate .2s}
.bg-indicator .eq .b5{height:12px;animation:eqBar 1.2s ease-in-out infinite alternate .1s}
.bg-indicator .eq .b6{height:7px;animation:eqBar .7s ease-in-out infinite alternate .35s}
@keyframes eqBar{0%{height:3px;opacity:.3}100%{opacity:1}}
.bg-indicator .bg-label{flex:1}
.bg-indicator .bg-label .bg-title{font-size:13px;color:rgba(255,255,255,0.5)}
.bg-indicator .bg-label .bg-desc{font-size:11px;color:rgba(255,255,255,0.25);margin-top:2px}
.bg-indicator .bg-toggle-btn{font-size:18px;opacity:.4;transition:opacity .2s}
.bg-indicator:hover .bg-toggle-btn{opacity:.8}
@media(max-width:560px){.ambient-particle{display:none}}
@media(max-width:560px){.audio-page{padding:24px 16px 40px}.audio-header h1{font-size:18px}.player-card{padding:24px 20px}.now-playing .np-emoji{font-size:32px}.now-playing .np-title{font-size:17px}.chapter{padding:14px 16px}#subtitle-wrap{padding:14px 16px;max-height:200px}#subtitle-content{font-size:14px}}
</style>

<script>
var currentChapter = 0;
var isPlaying = false;
var audioEl = null;
var bgMusic = null;
var bgOn = true;
var subtitleWrap = null;
var srtEntries = [];

function formatTime(s) {
  if (!s && s !== 0) return '0:00';
  var m = Math.floor(s / 60);
  var sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}
function parseSRT(text) {
  var entries = [];
  var blocks = text.trim().split(/\n\s*\n/);
  blocks.forEach(function(block) {
    var lines = block.split('\n');
    var tsLine = lines.find(function(l) { return l.indexOf('-->') >= 0; });
    if (!tsLine) return;
    var parts = tsLine.split('-->');
    var start = srtToSec(parts[0].trim());
    var end = srtToSec(parts[1].trim());
    var txt = lines.slice(2).filter(function(l) { return l.trim(); }).join('');
    entries.push({ start: start, end: end, text: txt });
  });
  return entries;
}
function srtToSec(t) {
  var p = t.replace(',', '.').split(':');
  return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
}
function buildSubtitles(entries) {
  srtEntries = entries;
  var html = '';
  entries.forEach(function(e, i) {
    var clean = e.text.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    html += '<span class="sub-sentence" data-idx="' + i + '" style="transition:color .3s,background .3s;border-radius:4px;padding:0 2px;">' + clean + '</span>';
  });
  document.getElementById('subtitle-content').innerHTML = html;
  document.getElementById('subtitle-wrap').style.display = 'block';
  if (subtitleWrap) subtitleWrap.scrollTop = 0;
}
function clearSubtitleHighlight() {
  document.querySelectorAll('.sub-sentence').forEach(function(el) {
    el.style.color = ''; el.style.background = '';
  });
}
var lastHighlighted = -1;
function updateSubtitle(currentTime) {
  var found = -1;
  for (var i = 0; i < srtEntries.length; i++) {
    if (currentTime >= srtEntries[i].start && currentTime < srtEntries[i].end) {
      found = i; break;
    }
  }
  if (found !== lastHighlighted) {
    clearSubtitleHighlight();
    if (found >= 0) {
      document.querySelectorAll('.sub-sentence').forEach(function(el) {
        if (parseInt(el.dataset.idx) === found) {
          el.style.color = '#f0d68a';
          el.style.background = 'rgba(201,168,76,0.12)';
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      });
    }
    lastHighlighted = found;
  }
}
function renderChapters() {
  var html = '';
  AUDIO_SCRIPT.forEach(function(ch, i) {
    var active = i === currentChapter ? 'active' : '';
    var status = '';
    if (i < currentChapter) status = '<span class="ch-status done">✓</span>';
    else if (i === currentChapter && isPlaying) status = '<span class="ch-status playing">▶</span>';
    else if (i === currentChapter) status = '<span class="ch-status playing" style="opacity:0.5;">○</span>';
    else status = '<span class="ch-status pending">' + (i + 1) + '</span>';
    html += '<div class="chapter ' + active + '" onclick="goToChapter(' + i + ')">'
      + '<span class="ch-emoji">' + ch.emoji + '</span>'
      + '<div class="ch-info"><div class="ch-title">' + ch.title + '</div></div>'
      + '<div class="ch-status-wrap">' + status + '</div></div>';
  });
  document.getElementById('chapter-list').innerHTML = html;
}
renderChapters();
function updateNowPlaying(ch) {
  if (!ch) ch = AUDIO_SCRIPT[currentChapter];
  document.getElementById('np-emoji').textContent = ch.emoji;
  document.getElementById('np-title').textContent = ch.title;
  if (audioEl && audioEl.duration && isFinite(audioEl.duration)) {
    document.getElementById('prog-total').textContent = formatTime(audioEl.duration);
  }
}
function updatePlayButton() {
  document.getElementById('btn-play').textContent = isPlaying ? '⏸' : '▶';
}
function updateNavButtons() {
  document.getElementById('btn-prev').disabled = currentChapter <= 0;
  document.getElementById('btn-next').disabled = currentChapter >= AUDIO_SCRIPT.length - 1;
}
function updateStatus(text) {
  document.getElementById('np-status').textContent = text;
}
function loadChapter(index, autoplay) {
  if (autoplay === undefined) autoplay = true;
  if (audioEl) { audioEl.pause(); audioEl.src = ''; }
  currentChapter = index;
  var ch = AUDIO_SCRIPT[currentChapter];
  updateNowPlaying(ch);
  renderChapters();
  updateNavButtons();
  updateStatus('加载中…');
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('prog-current').textContent = '0:00';
  document.getElementById('subtitle-wrap').style.display = 'none';
  srtEntries = [];
  lastHighlighted = -1;

  fetch('../music/chapter_' + ch.id + '.srt')
    .then(function(r) { return r.text(); })
    .then(function(t) {
      var entries = parseSRT(t);
      if (entries.length) entries[entries.length - 1].end += 3;
      buildSubtitles(entries);
    }).catch(function() {});

  audioEl = new Audio('../music/chapter_' + ch.id + '.mp3');
  audioEl.preload = 'auto';
  audioEl.addEventListener('loadedmetadata', function() {
    if (audioEl.duration && isFinite(audioEl.duration))
      document.getElementById('prog-total').textContent = formatTime(audioEl.duration);
    if (autoplay) audioEl.play().catch(function() { updateStatus('点击 ▶ 开始收听'); });
  });
  audioEl.addEventListener('timeupdate', function() {
    if (audioEl.duration && audioEl.duration > 0) {
      document.getElementById('progress-fill').style.width = (audioEl.currentTime / audioEl.duration * 100) + '%';
      document.getElementById('prog-current').textContent = formatTime(audioEl.currentTime);
    }
    updateSubtitle(audioEl.currentTime);
  });
  audioEl.addEventListener('play', function() {
    isPlaying = true; updatePlayButton(); updateStatus('正在播放…'); renderChapters();
    if (bgOn) startBgMusic();
  });
  audioEl.addEventListener('pause', function() {
    isPlaying = false; updatePlayButton();
    if (audioEl.currentTime >= audioEl.duration - 0.5) {
      updateStatus('播放完成');
      if (currentChapter < AUDIO_SCRIPT.length - 1) {
        currentChapter++; loadChapter(currentChapter, true);
      } else { updateStatus('全部播放完毕'); }
    } else { updateStatus('已暂停'); }
  });
  audioEl.addEventListener('ended', function() {
    isPlaying = false; updatePlayButton(); updateStatus('播放完成'); clearSubtitleHighlight();
    if (currentChapter < AUDIO_SCRIPT.length - 1) {
      currentChapter++; loadChapter(currentChapter, true);
    } else { updateStatus('全部播放完毕'); }
  });
}
function togglePlay() {
  // Start bg music on first play
  if (!bgMusic) { ensureBgMusic(); startBgMusic(); }
  if (!audioEl) { loadChapter(currentChapter, true); return; }
  if (audioEl.paused) { audioEl.play().catch(function() {}); }
  else { audioEl.pause(); if (bgMusic) bgMusic.pause(); }
}
function prevChapter() { if (currentChapter > 0) loadChapter(currentChapter - 1, true); }
function nextChapter() { if (currentChapter < AUDIO_SCRIPT.length - 1) loadChapter(currentChapter + 1, true); }
function goToChapter(i) { if (i !== currentChapter || !audioEl) loadChapter(i, true); }
function seekProgress(e) {
  if (!audioEl || !audioEl.duration) return;
  var bar = document.getElementById('progress-bar');
  var rect = bar.getBoundingClientRect();
  audioEl.currentTime = ((e.clientX - rect.left) / rect.width) * audioEl.duration;
}
function startBgMusic() {
  ensureBgMusic();
  if (bgMusic.paused) {
    bgMusic.play().catch(function(e) { console.log('bg music:', e); });
  }
  document.getElementById('eq-bars').style.opacity = '1';
  document.getElementById('bg-title').textContent = '🎵 望府楼山间 · 氛围音乐';
  document.getElementById('bg-desc').textContent = '正在播放 · 点击关闭';
  document.getElementById('bg-toggle-icon').textContent = '🔊';
}
function pauseBgMusic() {
  if (bgMusic) bgMusic.pause();
  document.getElementById('eq-bars').style.opacity = '0.15';
  document.getElementById('bg-title').textContent = '🎵 望府楼山间 · 氛围音乐';
  document.getElementById('bg-desc').textContent = '已暂停 · 点击播放';
  document.getElementById('bg-toggle-icon').textContent = '🔇';
}
function toggleBgMusic() {
  bgOn = !bgOn;
  if (!bgOn) { pauseBgMusic(); } else {
    if (isPlaying) startBgMusic();
    else {
      // Preload bg music
      if (!bgMusic) { bgMusic = new Audio('/uploads/background_music_1781405764749.mp3'); bgMusic.loop = true; bgMusic.volume = 0.1; }

      document.getElementById('eq-bars').style.opacity = '0.15';

      document.getElementById('bg-desc').textContent = '播放语音时自动响起';

    }
  }
}
