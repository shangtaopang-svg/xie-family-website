    .gallery-item .caption { position:absolute; bottom:0; left:0; right:0; padding:24px 10px 8px; background:linear-gradient(transparent,rgba(0,0,0,0.6)); color:#fff; font-size:12px; opacity:0; transition:opacity 0.3s; }

<body><script>
(function(){
  var ptKey = 'pt_go';
  var pt = document.getElementById('page-transition');
  
  // If arriving from transition (sessionStorage flag)
  if (sessionStorage.getItem(ptKey)) {
    sessionStorage.removeItem(ptKey);
    if (!pt) {
      pt = document.createElement('div');
      pt.id = 'page-transition';
      pt.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgb(7,16,31);display:flex;flex-direction:column;align-items:center;justify-content:center;';
      pt.innerHTML = '<div style="text-align:center;animation:ptFade 0.3s ease both;"><div style="width:55px;height:55px;margin:0 auto 20px;"><svg viewBox="-3 -4 39 39" style="width:100%;height:100%;"><polygon fill="transparent" stroke="#04BF00" stroke-width="1.5" points="16,0 32,32 0,32" stroke-dasharray="17" style="animation:ptDash 2.5s cubic-bezier(0.35,0.04,0.63,0.95) infinite;"/></svg></div><div style="font-size:18px;color:#fff;letter-spacing:1px;white-space:nowrap;">ShangTaoPang 正在工作中<span style="display:inline;animation:ptDot 1.4s ease infinite;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.2s;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.4s;">.</span></div><div style="margin:18px auto 0;height:5px;width:100%;background:rgba(0,0,0,0.25);border-radius:30px;padding:0;"><div style="height:5px;border-radius:30px;background:#04BF00;width:0;animation:ptSlide 1.5s ease forwards;"></div></div></div>';
      document.body.appendChild(pt);
    }
    // Fade out after brief display
    setTimeout(function(){ pt.style.transition='opacity 0.5s ease'; pt.style.opacity='0'; setTimeout(function(){ pt.style.display='none'; },500); },300);
    return;
  }
  
  // If overlay HTML exists on page (from index.html), ensure it's hidden
  if (pt) pt.style.display = 'none';
  
  // Intercept nav clicks directly (inline, reliable)
  document.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if (!a) return;
    var h = a.getAttribute('href');
    if (!h || h==='#' || h.startsWith('javascript:') || h.startsWith('http') || h.startsWith('tel:') || h.startsWith('mailto:') || !h.includes('.html')) return;
    var cur = window.location.pathname.split('/').pop() || 'index.html';
    if (h === cur || h === './'+cur) return;
    e.preventDefault();
    e.stopPropagation();
    sessionStorage.setItem(ptKey, '1');
    // Show overlay with all inline styles
    var ov = document.getElementById('page-transition') || document.createElement('div');
    ov.id = 'page-transition';
    ov.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgb(7,16,31);display:flex;flex-direction:column;align-items:center;justify-content:center;';
    ov.innerHTML = '<div style="margin-top:16px;height:3px;width:0;background:#04BF00;border-radius:2px;animation:ptSlide 0.7s ease-in-out forwards;"></div><div style="text-align:center;animation:ptFade 0.3s ease both;"><div style="width:55px;height:55px;margin:0 auto 20px;"><svg viewBox="-3 -4 39 39" style="width:100%;height:100%;"><polygon fill="transparent" stroke="#04BF00" stroke-width="1.5" points="16,0 32,32 0,32" stroke-dasharray="17" style="animation:ptDash 2.5s cubic-bezier(0.35,0.04,0.63,0.95) infinite;"/></svg></div><div style="font-size:18px;color:#fff;letter-spacing:1px;white-space:nowrap;">ShangTaoPang 正在工作中<span style="display:inline;animation:ptDot 1.4s ease infinite;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.2s;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.4s;">.</span></div><div style="margin:18px auto 0;height:5px;width:100%;background:rgba(0,0,0,0.25);border-radius:30px;padding:0;"><div style="height:5px;border-radius:30px;background:#04BF00;width:0;animation:ptSlide 1.5s ease forwards;"></div></div></div>';
    if (!document.getElementById('pt-keyframes')) {
      var ks = document.createElement('style');
      ks.id = 'pt-keyframes';
      ks.textContent = '@keyframes ptSlide{0%{width:0}100%{width:100%}}@keyframes ptDash{0%{stroke-dashoffset:0}50%{stroke-dashoffset:-17}100%{stroke-dashoffset:-34}}@keyframes ptFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes ptDot{0%,100%{opacity:0.2}50%{opacity:1}}';
      document.head.appendChild(ks);
    }
    if (ov.parentNode !== document.body) document.body.appendChild(ov);
    setTimeout(function(){ window.location.href = h; }, 800);
  });
})();
</script>

<script>
(function() {
  var theme = localStorage.getItem('xie_theme') || 'light';
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();
function toggleTheme() {
  var html = document.documentElement;
  var isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('xie_theme', isDark ? 'light' : 'dark');
}
// Load photos from admin data or carousel directory
(async function() {
  var grid = document.getElementById('gallery-grid');
  try {
    // Try admin photos first
    var adminPhotos = JSON.parse(localStorage.getItem('xie_admin_photos') || '[]');
    var carouselImgs = [
      '../images/carousel/11.jpg','../images/carousel/23.jpg','../images/carousel/121.jpg','../images/carousel/123.jpg',
      '../images/carousel/38.jpg','../images/carousel/40.jpg','../images/carousel/42.jpg','../images/carousel/51.jpg',
      '../images/carousel/88.jpg','../images/carousel/W020230307562232959074.jpg','../images/carousel/W020230307562236561236.jpg',
      '../images/carousel/W020230307562239043622.png','../images/carousel/W020230307562241110405.jpg'
    ];
    var allPhotos = [];
    if (adminPhotos.length) {
      // Get file store data
      var files = await (window.getAllFiles ? getAllFiles('photo_') : Promise.resolve([]));
      var fileMap = {};
      (files || []).forEach(function(f) { var id = parseInt(f.name.replace('photo_','')); fileMap[id] = f.dataUrl; });
      adminPhotos.forEach(function(p) {
        if (p.file_url || fileMap[p.id]) allPhotos.push({ src: p.file_url || fileMap[p.id], title: p.title || '家族照片' });
      });
    }
    // Fallback: carousel images
    if (!allPhotos.length) {
      carouselImgs.forEach(function(src) { allPhotos.push({ src: src, title: '' }); });
    }
    if (!allPhotos.length) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">暂无照片</div>'; return; }
    grid.innerHTML = allPhotos.map(function(p) {
      return '<div class="gallery-item" onclick="openPhotoLightbox(\'' + p.src + '\',\'' + (p.title||'') + '\')">' +
        '<img src="' + p.src + '" alt="' + (p.title||'') + '" loading="lazy">' +
        (p.title ? '<div class="caption">' + p.title + '</div>' : '') +
      '</div>';
    }).join('');
  } catch(e) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">加载失败</div>'; }
})();
</script>
