<script>
(function() {
  var theme = localStorage.getItem('xie_theme') || 'light';
  if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();
function toggleTheme() {
  var html = document.documentElement;
  var isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? '' : 'dark');
  localStorage.setItem('xie_theme', isDark ? 'light' : 'dark');
}
// Load photos from admin data or carousel directory
(function() {
  var grid = document.getElementById('gallery-grid');
  function renderPhotos(photos) {
    if (!photos || !photos.length) {
      // Fallback: carousel images
      photos = ['../images/carousel/11.jpg','../images/carousel/23.jpg','../images/carousel/121.jpg','../images/carousel/123.jpg',
        '../images/carousel/38.jpg','../images/carousel/40.jpg','../images/carousel/42.jpg','../images/carousel/51.jpg',
        '../images/carousel/88.jpg','../images/carousel/W020230307562232959074.jpg','../images/carousel/W020230307562236561236.jpg',
        '../images/carousel/W020230307562239043622.png','../images/carousel/W020230307562241110405.jpg'];
    }
    grid.innerHTML = photos.map(function(p) {
      var src = p.file_url || p.src || p;
      var title = p.title || '';
      return '<div class="gallery-item" onclick="openPhotoLightbox(' + "'" + src + "'" + ',' + "'" + title + "'" + ')">' +
        '<img src="' + src + '" alt="' + title + '" loading="lazy">' +
        (title ? '<div class="caption">' + title + '</div>' : '') + '</div>';
    }).join('');
  }
  try {
    var adminPhotos = JSON.parse(localStorage.getItem('xie_admin_photos') || '[]');
    if (adminPhotos.length) {
      if (window.getAllFiles) {
        getAllFiles('photo_').then(function(files) {
          var fileMap = {};
          (files || []).forEach(function(f) { var id = parseInt(f.name.replace('photo_','')); if (id) fileMap[id] = f.dataUrl; });
          adminPhotos.forEach(function(p) {
            if (p.file_url || fileMap[p.id]) p.src = p.file_url || fileMap[p.id];
          });
          renderPhotos(adminPhotos.filter(function(p) { return p.src; }));
        }).catch(function() { renderPhotos([]); });
      } else {
        renderPhotos(adminPhotos.filter(function(p) { return p.file_url; }));
      }
    } else {
      renderPhotos([]);
    }
  } catch(e) { renderPhotos([]); }
})();
</script>
