    .honor-item:hover .honor-title { color:var(--accent-orange); }
    .honor-meta { font-size:13px; color:var(--text-tertiary); line-height:1.4; }
    .honor-link { flex-shrink:0; font-size:12px; color:var(--text-tertiary); text-decoration:none; transition:color 0.2s; white-space:nowrap; cursor:pointer; }
    .honor-link:hover { color:var(--accent-orange); }
    @media (max-width:768px) {
      .honor-item { padding:14px 0; gap:14px; }
      .honor-icon { font-size:24px; }
      .honor-title { font-size:15px; }

  <script>
    // Canvas animated background
    // bg-canvas removed

    function escapeHtml(text) {
      if (!text) return '';
      var d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }
    function escapeAttr(text) {
      if (!text) return '';
      return text.replace(/'/g, "\'").replace(/"/g, '&quot;');
    }

    function showHonorModal(item) {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
      var box = document.createElement('div');
      box.style.cssText = 'background:var(--bg-primary);border:1px solid var(--glass-border);border-radius:12px;max-width:720px;width:100%;max-height:80vh;overflow-y:auto;padding:36px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.3);';
      var fullContent = item.content || '';
      var hasUrl = item.url && item.url.trim() !== '';
      box.innerHTML = '<button onclick="this.parentElement.parentElement.remove()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-tertiary);">✕</button>'
        + '<div style="font-size:36px;margin-bottom:8px;">' + (item.icon || '🏆') + '</div>'
        + '<h2 style="font-family:var(--font-title);color:var(--text-primary);font-size:20px;font-weight:600;margin-bottom:12px;padding-right:30px;">' + escapeHtml(item.title) + '</h2>'
        + '<div style="font-size:13px;color:var(--text-tertiary);margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--divider);">'
        + (item.date ? '<span>' + item.date + '</span>' : '')
        + (item.awarder ? ' · ' + escapeHtml(item.awarder) : '')
        + '</div>'
        + '<div style="font-size:14px;color:var(--text-secondary);line-height:2;">' + escapeHtml(fullContent).replace(/\n/g, '<br>') + '</div>'
        + (hasUrl ? '<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--divider);"><a href="' + escapeAttr(item.url) + '" target="_blank" style="color:var(--accent-orange);font-size:13px;text-decoration:none;">查看详情 →</a></div>' : '');
      overlay.appendChild(box);
      overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
      document.body.appendChild(overlay);
    }

    function renderHonors() {
      var data = JSON.parse(localStorage.getItem('xie_admin_honors'));
      if (!data || !data.length) {
        data = [
          { id: 1, title: '浙江省美丽乡村示范村', date: '2025-12-01', awarder: '浙江省农业农村厅', icon: '🏆', url: '', content: '下枫椿村凭借优美的自然风光、整洁的村容村貌和深厚的文化底蕴，被评为浙江省美丽乡村示范村。这一荣誉是对全村人民共同努力的肯定。' },
          { id: 2, title: '宁海县文明村', date: '2025-06-15', awarder: '宁海县人民政府', icon: '🥇', url: '', content: '下枫椿村在精神文明建设方面成效显著，村民自治有序、邻里和睦、文化活跃，获评宁海县文明村称号。' },
          { id: 3, title: '谢氏宗祠文物保护单位', date: '2024-03-20', awarder: '宁海县文化和广电电视旅游体育局', icon: '📜', url: '', content: '下枫椿谢氏宗祠始建于清乾隆年间，三进两厠格局，雕梁画栋，具有较高的历史、艺术和科学价值，被列为县级文物保护单位。' }
        ];
      }
      data.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
      var html = '';
      data.forEach(function(item) {
        html += '<div class="honor-item" onclick="showHonorModal(' + JSON.stringify(item).replace(/"/g, '&quot;') + ')">'
          + '<span class="honor-icon">' + (item.icon || '🏆') + '</span>'
          + '<span class="honor-info">'
          + '<span class="honor-title">' + escapeHtml(item.title) + '</span>'
          + '<span class="honor-meta">' + (item.date || '') + ' · ' + escapeHtml(item.awarder || '') + '</span>'
          + '</span>'
          + (item.url ? '<a href="' + escapeAttr(item.url) + '" target="_blank" class="honor-link" onclick="event.stopPropagation()">详情 →</a>' : '<span class="honor-link" onclick="event.stopPropagation()">阅读 →</span>')
          + '</div>';
      });
      if (!html) {
        html = '<div style="text-align:center;padding:40px 20px;color:var(--text-tertiary);font-size:13px;">暂无荣誉</div>';
      }
      document.getElementById('honors-list').innerHTML = html;
    }
    renderHonors();
    if (window.dbGetAll) {
      dbGetAll('honors', { order: 'date.desc' }).then(function(supabaseData) {
        if (supabaseData && supabaseData.length > 0) {
          localStorage.setItem('xie_admin_honors', JSON.stringify(supabaseData));
          renderHonors();
        }
      }).catch(function() {});
    }
  </script>
