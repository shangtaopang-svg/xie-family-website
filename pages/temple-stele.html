<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修祠堂捐款名录 · 碑记</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1510;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif SC', 'STKaiti', serif;
      padding: 40px 20px;
    }
    .stele-wrap {
      max-width: 820px;
      width: 100%;
      background: linear-gradient(135deg, #2a2218 0%, #1e1810 50%, #2a2218 100%);
      border: 2px solid #4a3a28;
      border-radius: 4px;
      padding: 50px 40px 50px 50px;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 60px rgba(0,0,0,0.3);
    }
    /* Stone texture overlay */
    .stele-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='5'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    /* Worn edges */
    .stele-wrap::after {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(180,150,100,0.1);
      border-radius: 2px;
      pointer-events: none;
    }

    .stele-title {
      text-align: center;
      font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
      font-size: clamp(2rem, 4.5vw, 3rem);
      color: #d4af5a;
      letter-spacing: 0.3em;
      margin-bottom: 40px;
      text-shadow: 0 0 20px rgba(212,175,90,0.15);
      position: relative;
    }

    .stele-content {
      display: flex;
      flex-direction: row-reverse;
      justify-content: center;
      gap: 12px 24px;
      flex-wrap: wrap;
      position: relative;
    }

    /* Vertical text column */
    .text-col {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      color: #e8ddd0;
      line-height: 2;
      letter-spacing: 0.1em;
      min-height: 100px;
      padding: 0 4px;
      font-weight: 400;
      text-shadow: 0 0 4px rgba(0,0,0,0.5);
    }
    .text-col .hl {
      color: #d4af5a;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(212,175,90,0.2);
    }
    .text-col .amt {
      color: #c0a870;
      font-size: 0.8em;
    }

    /* Title row at top */
    .stele-header {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: clamp(0.9rem, 1.5vw, 1.1rem);
      color: #c9a84c;
      letter-spacing: 0.2em;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .stele-footer {
      text-align: center;
      margin-top: 40px;
      font-size: clamp(0.7rem, 1.2vw, 0.85rem);
      color: rgba(180,150,100,0.4);
      letter-spacing: 0.15em;
      position: relative;
    }
    .stele-footer::before {
      content: '';
      display: block;
      width: 60%;
      margin: 0 auto 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(180,150,100,0.3), transparent);
    }

    /* Empty state */
    .placeholder-note {
      text-align: center;
      color: rgba(180,150,100,0.3);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      padding: 60px 20px;
      writing-mode: horizontal-tb;
    }
    .placeholder-note .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    @media (max-width: 640px) {
      .stele-wrap { padding: 30px 16px 30px 20px; }
      .stele-content { gap: 6px 12px; }
      .text-col { font-size: 0.75rem; line-height: 1.8; }
    }
  </style>
</head>
<body>
<div class="stele-wrap">
  <div class="stele-title">修祠堂捐款名录</div>
  <div class="stele-content" id="steleContent">
    <!-- 第一列 -->
    <div class="text-col">
      <span class="hl">谢</span>世忠　<span class="amt">拾萬圓</span><br>
      <span class="hl">谢</span>行龙　<span class="amt">拾萬圓</span><br>
      <span class="hl">谢</span>伟中　<span class="amt">伍萬圓</span><br>
      <span class="hl">谢</span>云国　<span class="amt">叁萬捌</span>
    </div>
    <!-- 第二列 -->
    <div class="text-col">
      <span class="hl">谢</span>海港　<span class="amt">貳萬圓</span><br>
      <span class="hl">谢</span>平彪　<span class="amt">貳萬圓</span><br>
      <span class="hl">谢</span>世能　<span class="amt">壹萬圓</span><br>
      <span class="hl">谢</span>行尉　<span class="amt">壹萬圓</span>
    </div>
    <!-- 第三列 -->
    <div class="text-col">
      <span class="hl">谢</span>建国　<span class="amt">壹萬圓</span><br>
      <span class="hl">谢</span>世夫　<span class="amt">壹萬圓</span><br>
      <span class="hl">谢</span>高飞　<span class="amt">壹萬圓</span><br>
      <span class="hl">谢</span>京翰　<span class="amt">壹萬圓</span>
    </div>
    <!-- 第四列 -->
    <div class="text-col">
      <span class="hl">谢</span>行安　<span class="amt">壹萬圓</span><br>
      <span class="hl">谢</span>海飞　<span class="amt">壹萬圓</span><br>
      <span class="hl">谢</span>世省　<span class="amt">壹萬圓</span><br>
      <span class="hl">谢</span>永军　<span class="amt">壹萬圓</span>
    </div>
    <!-- 第五列 -->
    <div class="text-col">
      <span class="hl">谢</span>建杰　<span class="amt">伍仟圓</span><br>
      <span class="hl">谢</span>中良　<span class="amt">伍仟圓</span><br>
      <span class="hl">谢</span>行平　<span class="amt">伍仟圓</span><br>
      <span class="hl">谢</span>会福　<span class="amt">伍仟圓</span>
    </div>
    <!-- 第六列 -->
    <div class="text-col">
      <span class="hl">谢</span>世彩　<span class="amt">叁仟圓</span><br>
      <span class="hl">谢</span>行海　<span class="amt">叁仟圓</span><br>
      <span class="hl">谢</span>建禄　<span class="amt">叁仟圓</span><br>
      <span class="hl">谢</span>孝满　<span class="amt">叁仟圓</span>
    </div>
    <!-- 第七列 -->
    <div class="text-col">
      <span class="hl">谢</span>伟国　<span class="amt">貳仟圓</span><br>
      <span class="hl">谢</span>建军　<span class="amt">貳仟圓</span><br>
      <span class="hl">谢</span>兴隆　<span class="amt">貳仟圓</span><br>
      <span class="hl">谢</span>海峰　<span class="amt">貳仟圓</span>
    </div>
    <!-- 第八列 -->
    <div class="text-col">
      <span class="hl">谢</span>孝弟　<span class="amt">壹仟圓</span><br>
      <span class="hl">谢</span>孝强　<span class="amt">壹仟圓</span><br>
      <span class="hl">谢</span>孝国　<span class="amt">壹仟圓</span><br>
      <span class="hl">谢</span>湖北　<span class="amt">壹仟貳</span>
    </div>
  </div>
  <div class="stele-footer">公元二〇二六年 · 下枫槎谢氏阖族敬立</div>
</div>
</body>
</html>
