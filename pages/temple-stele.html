<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修祠堂捐款名录 · 碑记</title>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f0eb;
      background-image:
        repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(139,26,26,0.03) 80px, rgba(139,26,26,0.03) 81px),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(139,26,26,0.02) 40px, rgba(139,26,26,0.02) 41px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif SC', 'STKaiti', serif;
      padding: 40px 20px;
    }
    .stele-wrap {
      max-width: 820px;
      width: 100%;
      background: linear-gradient(135deg, #fdf8f0, #f8f0e0);
      border: 1px solid #d4c8b8;
      border-radius: 6px;
      padding: 50px 40px 50px 50px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    /* Paper texture overlay */
    .stele-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .stele-title {
      text-align: center;
      font-family: 'ZCOOL XiaoWei', 'Noto Serif SC', 'STSong', serif;
      font-size: clamp(2rem, 4.5vw, 3rem);
      color: #1a1a1a;
      letter-spacing: 0.3em;
      margin-bottom: 40px;
      position: relative;
    }
    .stele-title::after {
      content: '';
      display: block;
      width: 60px;
      height: 2px;
      margin: 12px auto 0;
      background: linear-gradient(90deg, transparent, #c41e3a, transparent);
    }

    .stele-content {
      display: flex;
      flex-direction: row-reverse;
      justify-content: center;
      gap: 12px 24px;
      flex-wrap: wrap;
      position: relative;
    }

    /* Vertical text column */
    .text-col {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      color: #2c1810;
      line-height: 2;
      letter-spacing: 0.1em;
      min-height: 100px;
      padding: 0 4px;
      font-weight: 400;
    }
    .text-col .hl {
      color: #c41e3a;
      font-weight: 700;
    }
    .text-col .amt {
      color: #c41e3a;
      font-size: 0.8em;
      font-weight: 600;
    }

    /* Title row at top */
    .stele-header {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: clamp(0.9rem, 1.5vw, 1.1rem);
      color: #c9a84c;
      letter-spacing: 0.2em;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .stele-footer {
      text-align: center;
      margin-top: 40px;
      font-size: clamp(0.7rem, 1.2vw, 0.85rem);
      color: #b0a090;
      letter-spacing: 0.15em;
      position: relative;
    }
    .stele-footer::before {
      content: '';
      display: block;
      width: 60%;
      margin: 0 auto 20px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c41e3a, transparent);
      opacity: 0.3;
    }

    /* Empty state */
    .placeholder-note {
      text-align: center;
      color: rgba(180,150,100,0.3);
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      padding: 60px 20px;
      writing-mode: horizontal-tb;
    }
    .placeholder-note .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    @media (max-width: 640px) {
      body { padding: 20px 8px; }
      .stele-wrap { padding: 24px 12px; }
      .stele-title { font-size: 1.4rem; margin-bottom: 24px; letter-spacing: 0.2em; }
      .stele-content { gap: 4px 8px; }
      .text-col { font-size: 0.65rem; line-height: 1.6; padding: 0 2px; }
      .stele-footer { font-size: 0.6rem; margin-top: 24px; }
    }
  </style>
  <script defer src="../js/sidebar.js"></script>
</head>
<body>

</div>
