<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>世系树</title>
<style>
body{background:#111;color:#eee;font-family:sans-serif;padding:20px;}
.tree{display:flex;flex-direction:column;align-items:center;}
.row{display:flex;justify-content:center;gap:30px;position:relative;}
.node{display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.card{padding:8px 20px;border-radius:8px;border:2px solid #555;background:rgba(255,255,255,0.05);text-align:center;min-width:80px;}
.card:hover{border-color:#fb923c;background:rgba(251,146,60,0.1);}
.card.focus{border-color:#fb923c;background:rgba(251,146,60,0.15);box-shadow:0 0 15px rgba(251,146,60,0.2);}
.name{font-size:16px;font-weight:700;color:#fff;}
.gen{font-size:10px;color:rgba(255,255,255,0.3);margin-top:2px;}
.line{width:2px;height:25px;background:rgba(255,255,255,0.1);margin:0 auto;}
.bar{width:80%;height:2px;background:rgba(255,255,255,0.08);margin:0 auto;position:relative;}
.search{margin-bottom:20px;}
.search input{width:100%;padding:8px 12px;border-radius:6px;border:1px solid #333;background:#222;color:#fff;font-size:14px;max-width:300px;}
</style>
</head>
<body>
<div class="search"><input id="s" placeholder="搜索姓名..." oninput="doSearch(this.value)"></div>
<div id="tree" class="tree"></div>
<script>
// Seed data - directly embedded
var data = [
  {id:1,name:'小四公',gen:0,branch:'石马',father:null,hl:true},
  {id:2,name:'文杲公',gen:1,branch:'枫槎始祖',father:1,hl:true},
  {id:3,name:'攒公',gen:2,branch:'后枫槎',father:2,hl:true},
  {id:4,name:'撰公',gen:2,branch:'前枫槎',father:2,hl:true},
  {id:5,name:'伯能',gen:3,branch:'后枫槎',father:3},
  {id:6,name:'伯逊',gen:3,branch:'前枫槎',father:3},
  {id:7,name:'祖甲',gen:4,branch:'后枫槎',father:5},
  {id:8,name:'彬公',gen:16,branch:'后枫槎',father:null,hl:true},
  {id:9,name:'乾公',gen:16,branch:'后枫槎',father:null,hl:true},
];

var currentId = 2;

function get(id){for(var i=0;i<data.length;i++){if(data[i].id===id)return data[i];}return null;}
function kids(id){return data.filter(function(p){return p.father===id;});}

function render(){
  var p = get(currentId); if(!p) return;
  var html = '<div class="row">';
  // Parent
  if(p.father !== null){
    var f = get(p.father);
    if(f){
      html += '<div class="node" onclick="go('+f.id+')"><div class="card"><div class="name">'+f.name+'</div><div class="gen">'+(f.gen?'第'+f.gen+'世':'')+'</div></div></div>';
    }
  }
  html += '</div><div class="line"></div>';
  // Current
  var col = '#fb923c';
  html += '<div class="row"><div class="node"><div class="card focus" style="border-color:'+col+'"><div class="name">'+p.name+'</div><div class="gen">'+(p.gen?'第'+p.gen+'世 · ':'')+(p.branch||'')+'</div></div></div></div>';
  // Children
  var ch = kids(p.id);
  if(ch.length>0){
    html += '<div class="line"></div>';
    if(ch.length>1) html += '<div class="bar"></div>';
    html += '<div class="row">';
    ch.forEach(function(c){
      var cc = '#666';
      if(c.branch.indexOf('后枫槎')>=0) cc='#22c55e';
      else if(c.branch.indexOf('前枫槎')>=0) cc='#6366f1';
      var bg = c.hl?cc+'20':'transparent';
      html += '<div class="node" onclick="go('+c.id+')"><div style="width:2px;height:12px;background:rgba(255,255,255,0.1);"></div><div class="card" style="border-color:'+cc+'40;background:'+bg+'"><div class="name">'+c.name+'</div><div class="gen">'+(c.gen?'第'+c.gen+'世':'')+'</div></div></div>';
    });
    html += '</div>';
  }
  document.getElementById('tree').innerHTML = html;
}

function go(id){currentId=id;render();}

function doSearch(q){
  if(!q){render();return;}
  var results = data.filter(function(p){return p.name.indexOf(q)>=0;});
  if(results.length>0){go(results[0].id);}
}

render();
</script>
</body>
</html>
