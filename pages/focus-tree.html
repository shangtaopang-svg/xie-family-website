<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>谢氏世系树</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0f0f13;color:#e0e0e0;font-family:"Noto Serif SC","SimSun",serif;padding:20px;text-align:center;}
.s{max-width:400px;margin:0 auto 24px;}
.s input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;font-size:15px;text-align:center;outline:none;}
.s input:focus{border-color:#fb923c;}
.sr{position:absolute;left:50%;transform:translateX(-50%);background:#1a1a24;border:1px solid rgba(255,255,255,0.1);border-radius:8px;max-height:240px;overflow-y:auto;z-index:100;display:none;width:300px;}
.si{padding:8px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);font-size:14px;}
.si:hover{background:rgba(251,146,60,0.1);}
.si .sg{color:rgba(255,255,255,0.4);font-size:11px;margin-left:8px;}
.sr-box{position:relative;max-width:400px;margin:0 auto;}
</style>
</head>
<body>
<div class="s"><input id="s" placeholder="输入姓名搜索..." autocomplete="off"></div>
<div class="sr-box"><div class="sr" id="sr"></div></div>
<div id="tree-wrap" style="position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.06);border-radius:8px;min-height:300px;cursor:grab;">
  <div id="tree" style="transform-origin:0 0;"><div style="padding:60px;text-align:center;color:rgba(255,255,255,0.3);">加载数据中...</div></div>
  <div style="position:absolute;bottom:10px;right:10px;display:flex;gap:4px;z-index:10;">
    <button id="zoom-in" style="width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.6);color:#fff;font-size:18px;cursor:pointer;">+</button>
    <button id="zoom-out" style="width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.6);color:#fff;font-size:18px;cursor:pointer;">−</button>
    <button id="zoom-reset" style="width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);background:rgba(0,0,0,0.6);color:#fff;font-size:14px;cursor:pointer;">⟳</button>
  </div>
</div>
<div style="text-align:center;margin-top:8px;">
  <button id="mode-toggle" style="padding:5px 16px;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:rgba(255,255,255,0.6);font-size:12px;cursor:pointer;">📋 查看全部世系</button>
</div>
<script>
function getFullSeedData() {
    return [
      {id:1,name:'谢小四',gender:'男',generation:'—',generation_num:0,branch:'石马(下谢)',birth_date:'宋靖康年间',is_alive:'否',highlight:true,biography:'会稽人，宋靖康年间迁居石马，入浙东之近祖。下枫槎谢氏之直系渊源。'},
      {id:2,name:'文杲公',gender:'男',generation:'—',generation_num:1,branch:'枫槎始祖',father_id:1,birth_date:'北宋宣和(约1125)',is_alive:'否',highlight:true,biography:'字克源，宋登仕郎，越溪司巡检。英敏卓荦，文武兼备，始居岩下，为枫槎谢氏之始迁祖。至今近九百载，传三十六世。'},
      {id:3,name:'攒公',gender:'男',generation:'—',generation_num:2,branch:'后枫槎派',father_id:2,is_alive:'否',highlight:true,biography:'文杲公长子，分居后枫槎，开一派之先河。'},
      {id:4,name:'撰公',gender:'男',generation:'—',generation_num:2,branch:'前枫槎派',father_id:2,is_alive:'否',highlight:true,biography:'文杲公次子，分居前枫槎，与前枫槎派并立。'},
      {id:5,name:'彬公',gender:'男',generation:'—',generation_num:16,branch:'后枫槎东房',birth_date:'明隆庆壬申(1572)',is_alive:'否',highlight:true,biography:'字叔仅，十六世祖。明隆庆六年壬申（1572年），时遭洪水之患，岁季始迁枫槎，为下枫槎开基之祖。'},
      {id:6,name:'乾公',gender:'男',generation:'—',generation_num:16,branch:'后枫槎东房',birth_date:'明隆庆壬申(1572)',is_alive:'否',highlight:true,biography:'与彬公昆仲，明隆庆六年壬申（1572年），山洪暴发，庐舍为墟。与彬公相度地势，遂迁于双枫古槎之下，因名其地曰下枫槎。'},
      {id:7,name:'云先公',gender:'男',generation:'之',generation_num:21,branch:'西大房二份',birth_date:'清乾隆间',is_alive:'否',biography:'名大性，西大房二份之祖。乾隆二十七年（1762年）首倡并主持修建下枫槎谢氏宗祠，敦睦堂由此而立。'},
      {id:8,name:'文对',gender:'男',generation:'—',generation_num:1,branch:'枫槎分支',father_id:2,is_alive:'否',highlight:true,biography:'文杲公之子，枫槎谢氏分支祖。'}
    ];
  }
  function getGenealogyData() {
  // Simply return localStorage data, no seed merging
  try {
    var stored = localStorage.getItem('xie_admin_genealogy');
    if (stored) {
      var data = JSON.parse(stored);
      return data;
    }
  } catch(e) {}
  // Fallback: seed data when nothing in localStorage
  var seed = getFullSeedData();
  localStorage.setItem('xie_admin_genealogy', JSON.stringify(seed));
  return seed;
}



function esc(t){if(!t)return '';return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function gc(p){
  if(!p||!p.branch)return'#666';
  if(p.branch.indexOf('后枫槎')>=0)return'#22c55e';
  if(p.branch.indexOf('前枫槎')>=0)return'#6366f1';
  if(p.branch.indexOf('石马')>=0)return'#f59e0b';
  return'#666';
}

var allData = [];
var curId = null;

function findPerson(id){
  for(var i=0;i<allData.length;i++){if(Number(allData[i].id)===Number(id))return allData[i];}
  return null;
}

function getFather(p){
  if(!p||!p.father_id||p.father_id===0||p.father_id===''||p.father_id==='0')return null;
  return findPerson(Number(p.father_id));
}

function getChildren(pid){
  var result=[];
  for(var i=0;i<allData.length;i++){
    if(allData[i].father_id&&Number(allData[i].father_id)===Number(pid))result.push(allData[i]);
  }
  return result;
}

// Ancestor chain: go up 10 generations
function buildAncestors(p, maxGen){
  var chain=[];
  var cur=p;
  for(var i=0;i<maxGen;i++){
    var f=getFather(cur);
    if(!f)break;
    chain.unshift(f);
    cur=f;
  }
  return chain;
}

// Build descendant tree recursively (limited depth and width)
function buildDescendantTree(pid, depth, maxDepth, maxWidth){
  if(depth>maxDepth)return'';
  var kids=getChildren(pid);
  if(kids.length===0)return'';
  var h='';
  h+='<div style="width:2px;height:14px;background:rgba(255,255,255,0.08);margin:0 auto;"></div>';
  if(kids.length>1){
    h+='<div style="position:relative;width:80%;height:1px;margin:0 auto;"><div style="position:absolute;top:0;left:10%;width:80%;height:1px;background:rgba(255,255,255,0.08);"></div></div>';
  }
  var shown=kids.slice(0,maxWidth);
  h+='<div style="display:flex;justify-content:center;gap:'+(kids.length>5?'6px':'10px')+';flex-wrap:wrap;">';
  shown.forEach(function(c){
    var ccol=gc(c);
    var hl=!!(c.highlight||/^(申伯|小四公|文杲公|攒公|撰公|彬公|乾公)$/.test(c.name));
    h+='<div style="display:flex;flex-direction:column;align-items:center;">';
    h+='<div onclick="show('+c.id+')" style="cursor:pointer;padding:'+(depth>2?'2px 6px':'4px 10px')+';border-radius:6px;border:2px solid '+ccol+'40;background:'+(hl?ccol+'15':'transparent')+';min-width:'+(depth>2?'30px':'40px')+';">';
    h+='<div style="font-size:'+(depth>2?'10px':'12px')+';font-weight:600;color:#fff;">'+esc(c.name)+'</div>';
    h+='<div style="font-size:9px;color:rgba(255,255,255,0.3);">'+(c.generation_num?'第'+c.generation_num+'世':'')+'</div></div>';
    // Recursively show grandchildren
    if(depth<maxDepth){
      h+=buildDescendantTree(c.id, depth+1, maxDepth, maxWidth);
    }
    h+='</div>';
  });
  if(kids.length>maxWidth){
    h+='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="padding:4px 8px;font-size:10px;color:rgba(255,255,255,0.3);">+其他'+(kids.length-maxWidth)+'人</div></div>';
  }
  h+='</div>';
  return h;
}

function buildTree(p){
  if(!p)return'<div style="padding:40px;color:rgba(255,255,255,0.3);">未找到</div>';
  var col=gc(p);
  var gen=p.generation_num?'第'+p.generation_num+'世':'';
  var gi=p.gender==='女'?'👩':'👤';

  // Build ancestor chain (10 generations up)
  var ancestors=buildAncestors(p,10);

  var h='<div style="text-align:center;width:100%;overflow-x:auto;padding:10px 0;">';

  // Show ancestors (oldest first, then down to current person)
  ancestors.forEach(function(a){
    var acol=gc(a);
    h+='<div onclick="show('+a.id+')" style="cursor:pointer;display:inline-block;padding:4px 14px;border-radius:6px;border:1px solid '+acol+'30;background:'+acol+'10;margin-bottom:2px;">';
    h+='<div style="font-size:13px;font-weight:600;color:#fff;">'+esc(a.name)+'</div>';
    h+='<div style="font-size:9px;color:rgba(255,255,255,0.3);">'+(a.generation_num?'第'+a.generation_num+'世':'')+'</div></div>';
    h+='<div style="width:2px;height:12px;background:rgba(255,255,255,0.08);margin:0 auto;"></div>';
  });

  // Current person
  h+='<div style="display:inline-block;padding:8px 22px;border-radius:10px;border:2px solid '+col+';background:rgba(251,146,60,0.12);box-shadow:0 0 20px rgba(251,146,60,0.15);">';
  h+='<div style="font-size:18px;font-weight:700;color:#fff;">'+gi+' '+esc(p.name)+'</div>';
  h+='<div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">'+gen+(p.branch&&p.branch!=='—'?' · '+esc(p.branch):'')+'</div></div>';

  // Descendants (recursive, 5 generations down, max 6 wide)
  h+=buildDescendantTree(p.id, 1, 5, 6);

  h+='</div>';
  return h;
}

function show(id){
  curId=id;
  var p=null;for(var i=0;i<allData.length;i++){if(Number(allData[i].id)===Number(id)){p=allData[i];break;}}
  if(!p){document.getElementById('tree').innerHTML='<div style="padding:40px;color:#ef4444;">未找到id='+id+'</div>';return;}
  document.getElementById('tree').innerHTML = buildTree(p);
  // Reset zoom
  zs=1;zx=0;zy=0;applyZoom();
}

function loadData(){
  try{allData = (typeof getGenealogyData==='function')?getGenealogyData():[];}catch(e){}
  if(!allData||!allData.length){document.getElementById('tree').innerHTML='<div style="padding:60px;text-align:center;color:rgba(255,255,255,0.3);">暂无数据</div>';return;}
  document.getElementById('tree').innerHTML='<div style="padding:40px;text-align:center;color:rgba(255,255,255,0.3);">记录数: '+allData.length+'，尝试加载...</div>';
  if(allData.length<=10){
    document.getElementById('tree').innerHTML='<div style="padding:40px;text-align:center;color:#fb923c;">正在从服务器加载完整数据('+allData.length+'条)...</div>';
    var dbg = document.getElementById('tree');
    fetch('/api/data/genealogy').then(function(r){return r.json();}).then(function(remoteData){
      if(remoteData&&remoteData.length>10){
        allData = remoteData;
        localStorage.setItem('xie_admin_genealogy', JSON.stringify(remoteData));
        dbg.innerHTML='<div style="padding:20px;text-align:center;color:#22c55e;">已加载'+remoteData.length+'条数据</div>';
        var did=null;
        for(var i=0;i<allData.length;i++){if(allData[i].name&&allData[i].name.indexOf('文杲')>=0){did=allData[i].id;break;}}
        if(!did&&allData.length>0)did=allData[0].id;
        if(did!=null)show(did);
      } else {
        dbg.innerHTML='<div style="padding:20px;text-align:center;color:#ef4444;">服务器返回数据为空</div>';
      }
    }).catch(function(err){
      dbg.innerHTML='<div style="padding:20px;text-align:center;color:#ef4444;">加载失败: '+err.message+'</div>';
    });
  } else {
    showFirst();
  }
  function showFirst(){
    var did=null;
    for(var i=0;i<allData.length;i++){if(allData[i].name&&allData[i].name.indexOf('文杲')>=0){did=allData[i].id;break;}}
    if(!did&&allData.length>0)did=allData[0].id;
    document.getElementById('tree').innerHTML='<div style="padding:40px;text-align:center;color:rgba(255,255,255,0.3);">正在显示...</div>';
    show(did);
  }
}

var si=document.getElementById('s');
var sr=document.getElementById('sr');
si.oninput=function(){
  var q=this.value.trim();
  if(!q){sr.style.display='none';if(curId!=null)show(curId);return;}
  var matches=[];
  for(var i=0;i<allData.length;i++){
    if(allData[i].name&&allData[i].name.indexOf(q)>=0)matches.push(allData[i]);
  }
  if(matches.length===0){sr.innerHTML='<div style="padding:10px;color:rgba(255,255,255,0.3);font-size:13px;">未找到</div>';sr.style.display='block';return;}
  var sshtml='';
  for(var mi=0;mi<Math.min(matches.length,15);mi++){
    var m=matches[mi];var gen=m.generation_num?'第'+m.generation_num+'世':'';
    sshtml+='<div class="si" data-sid="'+m.id+'">'+esc(m.name)+'<span class="sg">'+gen+'</span></div>';
  }
  sr.innerHTML=sshtml;
  sr.querySelectorAll('.si').forEach(function(el){el.onclick=function(){var id=parseInt(this.getAttribute('data-sid'));show(id);si.value='';sr.style.display='none';};});
};

// === Zoom & Pan ===
var tw = document.getElementById('tree-wrap');
var treeEl = document.getElementById('tree');
var zs = 1, zx = 0, zy = 0;
var isDrag = false, dzx, dzy, dox, doy;

function applyZoom(){
  treeEl.style.transform = 'translate('+zx+'px,'+zy+'px) scale('+zs+')';
}

tw.onwheel = function(e){
  e.preventDefault();
  var rect = tw.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var ns = zs * (e.deltaY > 0 ? 0.85 : 1.18);
  ns = Math.max(0.1, Math.min(10, ns));
  zx = mx - (mx - zx) * ns / zs;
  zy = my - (my - zy) * ns / zs;
  zs = ns;
  applyZoom();
};

tw.onmousedown = function(e){
  if(e.target.tagName==='INPUT')return;
  isDrag = true; dzx = e.clientX; dzy = e.clientY; dox = zx; doy = zy;
  tw.style.cursor = 'grabbing';
};
window.onmousemove = function(e){
  if(!isDrag) return;
  zx = dox + (e.clientX - dzx);
  zy = doy + (e.clientY - dzy);
  applyZoom();
};
window.onmouseup = function(){isDrag=false;tw.style.cursor='grab';};

document.getElementById('zoom-in').onclick = function(){
  var rect = tw.getBoundingClientRect();
  zs = Math.min(10, zs * 1.4);
  zx = rect.width/2 - (rect.width/2 - zx) * (zs/(zs/1.4));
  applyZoom();
};
document.getElementById('zoom-out').onclick = function(){
  zs = Math.max(0.1, zs / 1.4);
  applyZoom();
};
document.getElementById('zoom-reset').onclick = function(){zs=1;zx=0;zy=0;applyZoom();};

// === Full tree mode ===
var isFullMode = false;
var modeBtn = document.getElementById('mode-toggle');

function renderFullTree(){
  var genMap={}, genList=[];
  // Find 文杲公's generation as the starting point
  var startGen = 0;
  for(var i=0;i<allData.length;i++){
    if(allData[i].name && allData[i].name.indexOf('文杲')>=0){
      startGen = parseInt(allData[i].generation_num)||0;
      break;
    }
  }
  if(!startGen) startGen = 0;

  allData.forEach(function(p){
    var g = parseInt(p.generation_num)||0;
    if(g<startGen)return; // Skip ancient ancestors before 文杲公
    if(!genMap[g]){genMap[g]=[];genList.push(g);}
    genMap[g].push(p);
  });
  genList.sort(function(a,b){return a-b;});
  var minG=genList[0], maxG=genList[genList.length-1];

  // Add generation labels on the left
  genList.forEach(function(g,i){
    if(!document.getElementById('gen-label-layer')){
      // labels will be rendered as part of position map
    }
  });

  // Build position map: for each person, compute x position within their generation
  var posMap={};
  var genNum = {}; // renumbered generation number
  genList.forEach(function(g,i){
    genNum[g] = i+1; // 文杲公 = 第1世
  });

  genList.forEach(function(g){
    var list=genMap[g];
    // Sort: children after their parents, grouped by father_id
    list.sort(function(a,b){
      var pa=Number(a.father_id)||0, pb=Number(b.father_id)||0;
      if(pa!==pb)return pa-pb;
      return (a.name||'').localeCompare(b.name||'');
    });
    var total=list.length;
    list.forEach(function(p,i){
      var x = (total>1 ? i/(total-1) : 0.5) * Math.max(total*56, 600);
      posMap[p.id] = {x:x, y:(g-minG)*52 + 30, gen:g, name:p.name, branch:p.branch||'', hl:!!(p.highlight||/^(申伯|小四公|文杲公|攒公|撰公|彬公|乾公)$/.test(p.name)), father:p.father_id, id:p.id};
    });
  });

  var totalW = 300;
  for(var k in posMap){if(posMap[k].x+60>totalW)totalW=posMap[k].x+60;}

  var h='<div style="position:relative;width:'+totalW+'px;height:'+(genList.length*52+60)+'px;">';

  // Draw generation labels on the left
  genList.forEach(function(g,i){
    var y=i*52+30;
    h+='<div style="position:absolute;left:0;top:'+(y-10)+'px;width:48px;font-size:11px;color:rgba(255,255,255,0.25);font-weight:600;text-align:right;padding-right:8px;">'+(i+1)+'世</div>';
  });

  // Draw connection lines
  allData.forEach(function(p){
    if(!p.father_id||p.father_id===''||p.father_id==='0')return;
    var c=posMap[p.id], f=posMap[Number(p.father_id)];
    if(!c||!f)return;
    var y1=f.y+20, y2=c.y-8;
    h+='<svg style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible;"><path d="M'+f.x+','+y1+' C'+f.x+','+((y1+y2)/2)+' '+c.x+','+((y1+y2)/2)+' '+c.x+','+y2+'" stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none"/></svg>';
  });

  // Draw people
  for(var k in posMap){
    var p=posMap[k];
    var col='#666';
    if(p.branch.indexOf('后枫槎')>=0)col='#22c55e';
    else if(p.branch.indexOf('前枫槎')>=0)col='#6366f1';
    else if(p.branch.indexOf('石马')>=0)col='#f59e0b';
    h+='<div onclick="show('+p.id+');toggleMode();" style="position:absolute;left:'+(p.x-26+55)+'px;top:'+(p.y-8)+'px;padding:2px 6px;border-radius:3px;border:1px solid '+col+'30;background:'+(p.hl?col+'15':'transparent')+';font-size:11px;font-weight:'+(p.hl?'700':'400')+';cursor:pointer;white-space:nowrap;color:#fff;">'+esc(p.name)+'</div>';
  }

  h+='</div>';
  return h;
}

function toggleMode(){
  isFullMode = !isFullMode;
  if(isFullMode){
    modeBtn.textContent = '🔍 切换聚焦模式';
    document.getElementById('tree').innerHTML = renderFullTree();
  } else {
    modeBtn.textContent = '📋 查看全部世系';
    if(curId!=null)show(curId);
  }
  zs=1;zx=0;zy=0;applyZoom();
}

modeBtn.onclick = toggleMode;

// Boot
try{
  if(document.getElementById('s')&&typeof getGenealogyData==='function'){loadData();}
  else setTimeout(function(){location.reload();},500);
}catch(e){document.getElementById('tree').innerHTML='<div style="padding:40px;color:#ef4444;">JS Error: '+e.message+'</div>';}
</script>
</body>
</html>
