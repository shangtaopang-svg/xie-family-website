  function getGenealogyData() {
  var combined = [];
  try {
    var stored = localStorage.getItem('xie_admin_genealogy');
    if (stored) combined = JSON.parse(stored);
  } catch(e) {}
  if (!combined.length) combined = getFullSeedData();
  // Ancient lineage data
  var ancient = getAncientGenealogyData();
  var ancientNames = {};
  for (var ai = 0; ai < ancient.length; ai++) ancientNames[ancient[ai].name] = true;
  combined = combined.filter(function(p) {
    if (ancientNames[p.name]) return false;
    var base = p.name.replace(/\(.*\)$/, '');
    if (base !== p.name && ancientNames[base]) return false;
    return true;
  });
  // Connect stored 文杲公 to ancient 小四
  for (var ci = 0; ci < combined.length; ci++) {
    if (combined[ci].name === '文杲公' || combined[ci].name === '文杲') {
      for (var ai = 0; ai < ancient.length; ai++) {
        if (ancient[ai].name === '小四') { combined[ci].father_id = ancient[ai].id; break; }
      }
    }
  }
  return combined.concat(ancient);

function gc(p){
  if(!p||!p.branch)return'#666';
  if(p.branch.indexOf('后枫槎')>=0)return'#22c55e';
  if(p.branch.indexOf('前枫槎')>=0)return'#6366f1';
  if(p.branch.indexOf('石马')>=0)return'#f59e0b';
  return'#666';
}

var allData = [];
var curId = null;

function findPerson(id){
  for(var i=0;i<allData.length;i++){if(Number(allData[i].id)===Number(id))return allData[i];}
  return null;
}

function getFather(p){
  if(!p||!p.father_id||p.father_id===0||p.father_id===''||p.father_id==='0')return null;
  return findPerson(Number(p.father_id));
}

function getChildren(pid){
  var result=[];
  for(var i=0;i<allData.length;i++){
    if(allData[i].father_id&&Number(allData[i].father_id)===Number(pid))result.push(allData[i]);
  }
  return result;
}

// Ancestor chain: go up 10 generations
function buildAncestors(p, maxGen){
  var chain=[];
  var cur=p;
  for(var i=0;i<maxGen;i++){
    var f=getFather(cur);
    if(!f)break;
    chain.unshift(f);
    cur=f;
  }
  return chain;
}

    var ccol=gc(c);
    var hl=!!(c.highlight||/^(申伯|小四公|文杲公|攒公|撰公|彬公|乾公)$/.test(c.name));
    h+='<div style="display:flex;flex-direction:column;align-items:center;">';
    h+='<div onclick="show('+c.id+')" style="cursor:pointer;padding:'+(depth>2?'2px 6px':'4px 10px')+';border-radius:6px;border:2px solid '+ccol+'40;background:'+(hl?ccol+'15':'transparent')+';min-width:'+(depth>2?'30px':'40px')+';">';
    h+='<div style="font-size:'+(depth>2?'10px':'12px')+';font-weight:600;color:#fff;">'+esc(c.name)+'</div>';
    h+='<div style="font-size:9px;color:rgba(255,255,255,0.3);">'+(c.generation_num?'第'+c.generation_num+'世':'')+'</div></div>';
    // Recursively show grandchildren
    if(depth<maxDepth){
      h+=buildDescendantTree(c.id, depth+1, maxDepth, maxWidth);
    }
    h+='</div>';
  });
  if(kids.length>maxWidth){
    h+='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="padding:4px 8px;font-size:10px;color:rgba(255,255,255,0.3);">+其他'+(kids.length-maxWidth)+'人</div></div>';
  }
  h+='</div>';
  return h;
}

function buildTree(p){
  if(!p)return'<div style="padding:40px;color:rgba(255,255,255,0.3);">未找到</div>';
  var col=gc(p);
  var gen=p.generation_num?'第'+p.generation_num+'世':'';
  var gi=p.gender==='女'?'👩':'👤';

  // Build ancestor chain (10 generations up)
  var ancestors=buildAncestors(p,10);

  var h='<div style="text-align:center;width:100%;overflow-x:auto;padding:10px 0;">';

  // Show ancestors (oldest first, then down to current person)
  ancestors.forEach(function(a){
    var acol=gc(a);
    h+='<div onclick="show('+a.id+')" style="cursor:pointer;display:inline-block;padding:4px 14px;border-radius:6px;border:1px solid '+acol+'30;background:'+acol+'10;margin-bottom:2px;">';
    h+='<div style="font-size:13px;font-weight:600;color:#fff;">'+esc(a.name)+'</div>';
    h+='<div style="font-size:9px;color:rgba(255,255,255,0.3);">'+(a.generation_num?'第'+a.generation_num+'世':'')+'</div></div>';
    h+='<div style="width:2px;height:12px;background:rgba(255,255,255,0.08);margin:0 auto;"></div>';
  });

  // Current person
  h+='<div style="display:inline-block;padding:8px 22px;border-radius:10px;border:2px solid '+col+';background:rgba(251,146,60,0.12);box-shadow:0 0 20px rgba(251,146,60,0.15);">';
  h+='<div style="font-size:18px;font-weight:700;color:#fff;">'+gi+' '+esc(p.name)+'</div>';
  h+='<div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;">'+gen+(p.branch&&p.branch!=='—'?' · '+esc(p.branch):'')+'</div></div>';

  // Descendants (recursive, 5 generations down, max 6 wide)
  h+=buildDescendantTree(p.id, 1, 10, 6);

  h+='</div>';
  return h;
}

function show(id){
  curId=id;
  var p=null;for(var i=0;i<allData.length;i++){if(Number(allData[i].id)===Number(id)){p=allData[i];break;}}
  if(!p){document.getElementById('tree').innerHTML='<div style="padding:40px;color:#ef4444;">未找到id='+id+'</div>';return;}
  document.getElementById('tree').innerHTML = buildTree(p);
  // Reset zoom
  zs=1;zx=0;zy=0;applyZoom();
}

function loadData(){
  try{allData = (typeof getGenealogyData==='function')?getGenealogyData():[];}catch(e){}
  if(!allData||!allData.length){document.getElementById('tree').innerHTML='<div style="padding:60px;text-align:center;color:rgba(255,255,255,0.3);">暂无数据</div>';return;}
  document.getElementById('tree').innerHTML='<div style="padding:40px;text-align:center;color:rgba(255,255,255,0.3);">记录数: '+allData.length+'，尝试加载...</div>';
  if(allData.length<=10){
    document.getElementById('tree').innerHTML='<div style="padding:40px;text-align:center;color:#fb923c;">正在从服务器加载完整数据('+allData.length+'条)...</div>';
    var dbg = document.getElementById('tree');
    fetch('/api/data/genealogy').then(function(r){return r.json();}).then(function(remoteData){
      if(remoteData&&remoteData.length>10){
        allData = remoteData;
        localStorage.setItem('xie_admin_genealogy', JSON.stringify(remoteData));
        dbg.innerHTML='<div style="padding:20px;text-align:center;color:#22c55e;">已加载'+remoteData.length+'条数据</div>';
        var did=null;
        for(var i=0;i<allData.length;i++){if(allData[i].name&&allData[i].name.indexOf('文杲')>=0){did=allData[i].id;break;}}
        if(!did&&allData.length>0)did=allData[0].id;
        if(did!=null)show(did);
      } else {
        dbg.innerHTML='<div style="padding:20px;text-align:center;color:#ef4444;">服务器返回数据为空</div>';
      }
    }).catch(function(err){
      dbg.innerHTML='<div style="padding:20px;text-align:center;color:#ef4444;">加载失败: '+err.message+'</div>';
    });
  } else {
    showFirst();
  }
  function showFirst(){
    var did=null;
    for(var i=0;i<allData.length;i++){if(allData[i].name&&allData[i].name.indexOf('文杲')>=0){did=allData[i].id;break;}}
    if(!did&&allData.length>0)did=allData[0].id;
    document.getElementById('tree').innerHTML='<div style="padding:40px;text-align:center;color:rgba(255,255,255,0.3);">正在显示...</div>';
    show(did);
  }
}

var si=document.getElementById('s');
var sr=document.getElementById('sr');
si.oninput=function(){
  var q=this.value.trim();
  if(!q){sr.style.display='none';if(curId!=null)show(curId);return;}
  var matches=[];
  for(var i=0;i<allData.length;i++){
    if(allData[i].name&&allData[i].name.indexOf(q)>=0)matches.push(allData[i]);
  }
  if(matches.length===0){sr.innerHTML='<div style="padding:10px;color:rgba(255,255,255,0.3);font-size:13px;">未找到</div>';sr.style.display='block';return;}
  var sshtml='';
  for(var mi=0;mi<Math.min(matches.length,15);mi++){
    var m=matches[mi];var gen=m.generation_num?'第'+m.generation_num+'世':'';
    sshtml+='<div class="si" data-sid="'+m.id+'">'+esc(m.name)+'<span class="sg">'+gen+'</span></div>';
  }
  sr.innerHTML=sshtml;
  sr.querySelectorAll('.si').forEach(function(el){el.onclick=function(){var id=parseInt(this.getAttribute('data-sid'));show(id);si.value='';sr.style.display='none';};});
};

// === Zoom & Pan ===
var tw = document.getElementById('tree-wrap');
var treeEl = document.getElementById('tree');
var zs = 1, zx = 0, zy = 0;
var isDrag = false, dzx, dzy, dox, doy;

function applyZoom(){
  treeEl.style.transform = 'translate('+zx+'px,'+zy+'px) scale('+zs+')';
}

tw.onwheel = function(e){
  e.preventDefault();
  var rect = tw.getBoundingClientRect();
  var mx = e.clientX - rect.left, my = e.clientY - rect.top;
  var ns = zs * (e.deltaY > 0 ? 0.85 : 1.18);
  ns = Math.max(0.1, Math.min(10, ns));
  zx = mx - (mx - zx) * ns / zs;
  zy = my - (my - zy) * ns / zs;
  zs = ns;
  applyZoom();
};

tw.onmousedown = function(e){
  if(e.target.tagName==='INPUT')return;
  isDrag = true; dzx = e.clientX; dzy = e.clientY; dox = zx; doy = zy;
  tw.style.cursor = 'grabbing';
};
window.onmousemove = function(e){
  if(!isDrag) return;
  zx = dox + (e.clientX - dzx);
  zy = doy + (e.clientY - dzy);
  applyZoom();
};
window.onmouseup = function(){isDrag=false;tw.style.cursor='grab';};

document.getElementById('zoom-in').onclick = function(){
  var rect = tw.getBoundingClientRect();
  zs = Math.min(10, zs * 1.4);
  zx = rect.width/2 - (rect.width/2 - zx) * (zs/(zs/1.4));
  applyZoom();
};
document.getElementById('zoom-out').onclick = function(){
  zs = Math.max(0.1, zs / 1.4);
  applyZoom();
};
document.getElementById('zoom-reset').onclick = function(){zs=1;zx=0;zy=0;applyZoom();};

// === Full tree mode ===
var isFullMode = false;
var modeBtn = document.getElementById('mode-toggle');

function renderFullTree(){
  // Find 文杲公 and collect only his descendants
  var wenGao = null, wenGaoId = null;
  for(var i=0;i<allData.length;i++){
    if(allData[i].name && allData[i].name.indexOf('文杲')>=0){
      wenGao = allData[i]; wenGaoId = allData[i].id; break;
    }
  }
  // Collect all descendants of 文杲公
  var xieIds = {};
  if(wenGaoId){
    function collectKids(pid){
      if(xieIds[pid])return;
      xieIds[pid]=true;
      for(var i=0;i<allData.length;i++){
        if(allData[i].father_id && Number(allData[i].father_id)===Number(pid)){
          collectKids(allData[i].id);
        }
      }
    }
    collectKids(wenGaoId);
  }

  var genMap={}, genList=[];
  allData.forEach(function(p){
    if(!xieIds[p.id])return; // Only 文杲公 lineage
    var g = parseInt(p.generation_num)||0;
    if(!genMap[g]){genMap[g]=[];genList.push(g);}
    genMap[g].push(p);
  });
  genList.sort(function(a,b){return a-b;});

  var h='<div style="padding:8px 0;">';
  genList.forEach(function(g,idx){
    var list=genMap[g];
    list.sort(function(a,b){return (a.name||'').localeCompare(b.name||'');});
    // Generation header
    h+='<div style="display:flex;align-items:baseline;gap:8px;padding:4px 8px;border-bottom:1px solid rgba(255,255,255,0.04);">';
    var cn = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
    var genName = '枫槎' + (cn[idx] || (idx+1)) + '世';
    h+='<span style="font-size:13px;font-weight:700;color:rgba(255,255,255,0.4);min-width:70px;">'+genName+'</span>';
    // People cards
    list.forEach(function(p){
      var col='#666';
      if(p.branch&&p.branch.indexOf('后枫槎')>=0)col='#22c55e';
      else if(p.branch&&p.branch.indexOf('前枫槎')>=0)col='#6366f1';
      else if(p.branch&&p.branch.indexOf('石马')>=0)col='#f59e0b';
      var hl=!!(p.highlight||/^(申伯|小四公|文杲公|攒公|撰公|彬公|乾公|谢安|谢玄)$/.test(p.name));
      h+='<span onclick="show('+p.id+');toggleMode();" style="cursor:pointer;display:inline-block;padding:2px 8px;margin:1px 0;border-radius:4px;border:1px solid '+col+'30;background:'+(hl?col+'15':'transparent')+';font-size:12px;font-weight:'+(hl?'700':'400')+';color:#fff;">'+esc(p.name)+'</span>';
    });
    h+='<span style="font-size:10px;color:rgba(255,255,255,0.15);margin-left:auto;">'+list.length+'人</span>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

function toggleMode(){
  isFullMode = !isFullMode;
  if(isFullMode){
    modeBtn.textContent = '🔍 切换聚焦模式';
    document.getElementById('tree').innerHTML = renderFullTree();
  } else {
    modeBtn.textContent = '📋 查看全部世系';
    if(curId!=null)show(curId);
  }
  zs=1;zx=0;zy=0;applyZoom();
}

modeBtn.onclick = toggleMode;

// Boot
try{
  if(document.getElementById('s')&&typeof getGenealogyData==='function'){loadData();}
  else setTimeout(function(){location.reload();},500);
}catch(e){document.getElementById('tree').innerHTML='<div style="padding:40px;color:#ef4444;">JS Error: '+e.message+'</div>';}
</script>
