<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>谢氏世系树</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0f0f13;color:#e0e0e0;font-family:"Noto Serif SC","SimSun",serif;padding:20px;text-align:center;}
.s{max-width:400px;margin:0 auto 24px;}
.s input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;font-size:15px;text-align:center;outline:none;}
.s input:focus{border-color:#fb923c;}
.sr{position:absolute;left:50%;transform:translateX(-50%);background:#1a1a24;border:1px solid rgba(255,255,255,0.1);border-radius:8px;max-height:240px;overflow-y:auto;z-index:100;display:none;width:300px;}
.si{padding:8px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);font-size:14px;}
.si:hover{background:rgba(251,146,60,0.1);}
.si .sg{color:rgba(255,255,255,0.4);font-size:11px;margin-left:8px;}
.sr-box{position:relative;max-width:400px;margin:0 auto;}
</style>
</head>
<body>
<div class="s"><input id="s" placeholder="输入姓名搜索..." autocomplete="off"></div>
<div class="sr-box"><div class="sr" id="sr"></div></div>
<div id="tree"></div>
<script>
var trees = {"1": "<div class=\"tree\" style=\"text-align:center;\"><div style=\"display:inline-block;padding:8px 22px;border-radius:10px;border:2px solid #f59e0b;background:rgba(251,146,60,0.12);box-shadow:0 0 20px rgba(251,146,60,0.15);\"><div style=\"font-size:18px;font-weight:700;color:#fff;\">谢小四</div><div style=\"font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;\"> · 石马(下谢)</div></div><div style=\"width:2px;height:20px;background:rgba(255,255,255,0.1);margin:0 auto;\"></div><div style=\"display:flex;justify-content:center;gap:16px;flex-wrap:wrap;\"><div style=\"display:flex;flex-direction:column;align-items:center;\"><div style=\"width:2px;height:14px;background:rgba(255,255,255,0.1);\"></div><div style=\"cursor:pointer;padding:5px 14px;border-radius:8px;border:2px solid #66640;background:#66615;\"><div style=\"font-size:14px;font-weight:600;color:#fff;\">文杲公</div><div style=\"font-size:10px;color:rgba(255,255,255,0.35);\">第1世</div></div></div></div></div>", "2": "<div class=\"tree\" style=\"text-align:center;\"><div style=\"display:inline-block;padding:6px 18px;border-radius:8px;border:2px solid #f59e0b40;background:#f59e0b15;\"><div style=\"font-size:15px;font-weight:600;color:#fff;\">谢小四</div><div style=\"font-size:10px;color:rgba(255,255,255,0.35);\"></div></div><div style=\"width:2px;height:20px;background:rgba(255,255,255,0.1);margin:0 auto;\"></div><div style=\"display:inline-block;padding:8px 22px;border-radius:10px;border:2px solid #666;background:rgba(251,146,60,0.12);box-shadow:0 0 20px rgba(251,146,60,0.15);\"><div style=\"font-size:18px;font-weight:700;color:#fff;\">文杲公</div><div style=\"font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;\">第1世 · 枫槎始祖</div></div><div style=\"width:2px;height:20px;background:rgba(255,255,255,0.1);margin:0 auto;\"></div><div style=\"position:relative;width:80%;height:1px;margin:0 auto;\"><div style=\"position:absolute;top:0;left:10%;width:80%;height:1px;background:rgba(255,255,255,0.08);\"></div></div><div style=\"display:flex;justify-content:center;gap:16px;flex-wrap:wrap;\"><div style=\"display:flex;flex-direction:column;align-items:center;\"><div style=\"width:2px;height:14px;background:rgba(255,255,255,0.1);\"></div><div style=\"cursor:pointer;padding:5px 14px;border-radius:8px;border:2px solid #22c55e40;background:#22c55e15;\"><div style=\"font-size:14px;font-weight:600;color:#fff;\">攒公</div><div style=\"font-size:10px;color:rgba(255,255,255,0.35);\">第2世</div></div></div><div style=\"display:flex;flex-direction:column;align-items:center;\"><div style=\"width:2px;height:14px;background:rgba(255,255,255,0.1);\"></div><div style=\"cursor:pointer;padding:5px 14px;border-radius:8px;border:2px solid #6366f140;background:#6366f115;\"><div style=\"font-size:14px;font-weight:600;color:#fff;\">撰公</div><div style=\"font-size:10px;color:rgba(255,255,255,0.35);\">第2世</div></div></div><div style=\"display:flex;flex-direction:column;align-items:center;\"><div style=\"width:2px;height:14px;background:rgba(255,255,255,0.1);\"></div><div style=\"cursor:pointer;padding:5px 14px;border-radius:8px;border:2px solid #66640;background:#66615;\"><div style=\"font-size:14px;font-weight:600;color:#fff;\">文对</div><div style=\"font-size:10px;color:rgba(255,255,255,0.35);\">第1世</div></div></div></div></div>", "3": "<div class=\"tree\" style=\"text-align:center;\"><div style=\"display:inline-block;padding:6px 18px;border-radius:8px;border:2px solid #66640;background:#66615;\"><div style=\"font-size:15px;font-weight:600;color:#fff;\">文杲公</div><div style=\"font-size:10px;color:rgba(255,255,255,0.35);\">第1世</div></div><div style=\"width:2px;height:20px;background:rgba(255,255,255,0.1);margin:0 auto;\"></div><div style=\"display:inline-block;padding:8px 22px;border-radius:10px;border:2px solid #22c55e;background:rgba(251,146,60,0.12);box-shadow:0 0 20px rgba(251,146,60,0.15);\"><div style=\"font-size:18px;font-weight:700;color:#fff;\">攒公</div><div style=\"font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;\">第2世 · 后枫槎派</div></div></div>", "4": "<div class=\"tree\" style=\"text-align:center;\"><div style=\"display:inline-block;padding:6px 18px;border-radius:8px;border:2px solid #66640;background:#66615;\"><div style=\"font-size:15px;font-weight:600;color:#fff;\">文杲公</div><div style=\"font-size:10px;color:rgba(255,255,255,0.35);\">第1世</div></div><div style=\"width:2px;height:20px;background:rgba(255,255,255,0.1);margin:0 auto;\"></div><div style=\"display:inline-block;padding:8px 22px;border-radius:10px;border:2px solid #6366f1;background:rgba(251,146,60,0.12);box-shadow:0 0 20px rgba(251,146,60,0.15);\"><div style=\"font-size:18px;font-weight:700;color:#fff;\">撰公</div><div style=\"font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;\">第2世 · 前枫槎派</div></div></div>", "5": "<div class=\"tree\" style=\"text-align:center;\"><div style=\"display:inline-block;padding:8px 22px;border-radius:10px;border:2px solid #22c55e;background:rgba(251,146,60,0.12);box-shadow:0 0 20px rgba(251,146,60,0.15);\"><div style=\"font-size:18px;font-weight:700;color:#fff;\">彬公</div><div style=\"font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;\">第16世 · 后枫槎东房</div></div></div>", "6": "<div class=\"tree\" style=\"text-align:center;\"><div style=\"display:inline-block;padding:8px 22px;border-radius:10px;border:2px solid #22c55e;background:rgba(251,146,60,0.12);box-shadow:0 0 20px rgba(251,146,60,0.15);\"><div style=\"font-size:18px;font-weight:700;color:#fff;\">乾公</div><div style=\"font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;\">第16世 · 后枫槎东房</div></div></div>", "7": "<div class=\"tree\" style=\"text-align:center;\"><div style=\"display:inline-block;padding:8px 22px;border-radius:10px;border:2px solid #666;background:rgba(251,146,60,0.12);box-shadow:0 0 20px rgba(251,146,60,0.15);\"><div style=\"font-size:18px;font-weight:700;color:#fff;\">云先公</div><div style=\"font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;\">第21世 · 西大房二份</div></div></div>", "8": "<div class=\"tree\" style=\"text-align:center;\"><div style=\"display:inline-block;padding:6px 18px;border-radius:8px;border:2px solid #66640;background:#66615;\"><div style=\"font-size:15px;font-weight:600;color:#fff;\">文杲公</div><div style=\"font-size:10px;color:rgba(255,255,255,0.35);\">第1世</div></div><div style=\"width:2px;height:20px;background:rgba(255,255,255,0.1);margin:0 auto;\"></div><div style=\"display:inline-block;padding:8px 22px;border-radius:10px;border:2px solid #666;background:rgba(251,146,60,0.12);box-shadow:0 0 20px rgba(251,146,60,0.15);\"><div style=\"font-size:18px;font-weight:700;color:#fff;\">文对</div><div style=\"font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;\">第1世 · 枫槎分支</div></div></div>"};
var names = {"1": "谢小四", "2": "文杲公", "3": "攒公", "4": "撰公", "5": "彬公", "6": "乾公", "7": "云先公", "8": "文对"};
var genMap = {"2": "第1世", "3": "第2世", "4": "第2世", "5": "第16世", "6": "第16世", "7": "第21世", "8": "第1世"};

var currentId = 2;

function show(id){
  currentId = id;
  var h = trees[id] || '<div style="padding:40px;color:rgba(255,255,255,0.3);">暂无数据</div>';
  document.getElementById('tree').innerHTML = h;
}

var si = document.getElementById('s');
si.oninput = function(){
  var q = this.value.trim();
  var sr = document.getElementById('sr');
  if(!q){sr.style.display='none';show(currentId);return;}
  var matches = [];
  for(var id in names){
    if(names[id].indexOf(q)>=0) matches.push({id:id, name:names[id]});
  }
  if(matches.length===0){sr.style.display='none';return;}
  sr.innerHTML = matches.slice(0,10).map(function(m){
    return '<div class="si" onclick="show('+m.id+');document.getElementById('s').value='';document.getElementById('sr').style.display='none';">'+m.name+'<span class="sg">'+(genMap[m.id]||'')+'</span></div>';
  }).join('');
  sr.style.display='block';
};
si.onblur=function(){setTimeout(function(){document.getElementById('sr').style.display='none';},300);};
si.onfocus=function(){if(this.value.trim())document.getElementById('sr').style.display='block';};

show(2);
</script>
</body>
</html>
