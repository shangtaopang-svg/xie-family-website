<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>聚焦世系 · 下枫槎谢氏</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Noto Serif SC","SimSun",serif; background:#0f0f13; color:#e0e0e0; min-height:100vh; }
.header { display:flex; align-items:center; gap:10px; padding:12px 16px; background:rgba(255,255,255,0.04); border-bottom:1px solid rgba(255,255,255,0.06); position:sticky; top:0; z-index:100; }
.header h1 { font-size:17px; font-weight:600; flex:1; }
.header input { flex:1; max-width:300px; padding:7px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.06); color:#fff; font-size:14px; outline:none; }
.header input:focus { border-color:#fb923c; }
.header input::placeholder { color:rgba(255,255,255,0.3); }
.btn-back { padding:6px 14px; border-radius:6px; border:1px solid rgba(255,255,255,0.1); background:transparent; color:rgba(255,255,255,0.6); cursor:pointer; font-size:13px; }
.btn-back:hover { background:rgba(255,255,255,0.08); }

/* Main content */
.main { display:flex; flex-direction:column; align-items:center; padding:30px 16px 60px; min-height:calc(100vh - 56px); }

/* Tree area */
.tree-area { position:relative; width:100%; max-width:500px; display:flex; flex-direction:column; align-items:center; gap:8px; }

/* Connector lines */
.line-down { width:2px; height:30px; background:rgba(255,255,255,0.1); }
.line-up { width:2px; height:20px; background:rgba(255,255,255,0.1); }
.line-h { height:2px; width:60px; background:rgba(255,255,255,0.08); }

/* Node card */
.node { display:flex; flex-direction:column; align-items:center; cursor:pointer; transition:all 0.2s; position:relative; }
.node-card { padding:8px 20px; border-radius:10px; border:2px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04); text-align:center; transition:all 0.2s; min-width:100px; }
.node-card:hover { border-color:#fb923c; background:rgba(251,146,60,0.08); transform:translateY(-2px); }
.node-card.center { border-color:#fb923c; background:rgba(251,146,60,0.12); box-shadow:0 0 20px rgba(251,146,60,0.15); }
.node-card.father-card { border-color:rgba(99,102,241,0.3); }
.node-card.child-card { border-color:rgba(34,197,94,0.3); }
.node-name { font-size:17px; font-weight:600; color:#fff; }
.node-gen { font-size:11px; color:rgba(255,255,255,0.4); margin-top:2px; }
.node-stats { font-size:11px; color:rgba(255,255,255,0.3); }

/* Children row */
.children-row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
.spouse-row { display:flex; gap:12px; align-items:center; justify-content:center; margin:4px 0; }
.spouse-connector { display:flex; align-items:center; gap:6px; color:rgba(255,255,255,0.2); font-size:11px; }

/* Detail panel */
.detail-panel { width:100%; max-width:500px; margin-top:30px; padding:20px 24px; border-radius:12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); }
.detail-row { display:flex; gap:8px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:14px; color:rgba(255,255,255,0.7); }
.detail-row:last-child { border-bottom:none; }
.detail-label { color:rgba(255,255,255,0.35); min-width:55px; font-size:13px; }
.detail-branch-tag { display:inline-block; padding:0 8px; border-radius:4px; font-size:11px; }

/* Search results */
.search-results { position:absolute; top:100%; left:0; right:0; background:#1a1a24; border:1px solid rgba(255,255,255,0.1); border-radius:10px; max-height:300px; overflow-y:auto; z-index:200; display:none; }
.search-item { padding:8px 14px; cursor:pointer; font-size:14px; border-bottom:1px solid rgba(255,255,255,0.04); }
.search-item:hover { background:rgba(251,146,60,0.1); }
.search-item .si-gen { color:rgba(255,255,255,0.4); font-size:11px; margin-left:8px; }

/* History nav */
.history-bar { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:16px; }
.history-btn { padding:3px 12px; border-radius:4px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.5); font-size:12px; cursor:pointer; }
.history-btn:hover { background:rgba(255,255,255,0.08); }
.history-btn.current { color:#fb923c; border-color:#fb923c; }
.history-btn.clear { border-color:transparent; color:rgba(255,255,255,0.2); }

.help-text { text-align:center; color:rgba(255,255,255,0.2); font-size:12px; margin-top:16px; }

@media (max-width:500px) {
  .header { flex-wrap:wrap; }
  .header input { max-width:100%; flex-basis:100%; order:3; }
  .node-card { padding:6px 14px; min-width:80px; }
  .node-name { font-size:15px; }
  .detail-panel { padding:14px 16px; }
}
</style>
</head>
<body>

<div class="header">
  <a href="../index.html" style="color:rgba(255,255,255,0.5);text-decoration:none;font-size:13px;">← 返回首页</a>
  <input type="text" id="search-input" placeholder="搜索姓名..." autocomplete="off">
  <div id="search-results" class="search-results"></div>
</div>

<div class="main">
  <div class="history-bar" id="history-bar"></div>
  <div class="tree-area" id="tree-area"></div>
  <div class="detail-panel" id="detail-panel"></div>
  <div class="help-text">点击姓名切换聚焦 · 搜索快速定位</div>
</div>

<script>
function getFullSeedData() {
    return [
      {id:1,name:'谢小四',gender:'男',generation:'—',generation_num:0,branch:'石马(下谢)',birth_date:'宋靖康年间',is_alive:'否',highlight:true,biography:'会稽人，宋靖康年间迁居石马，入浙东之近祖。下枫槎谢氏之直系渊源。'},
      {id:2,name:'文杲公',gender:'男',generation:'—',generation_num:1,branch:'枫槎始祖',father_id:1,birth_date:'北宋宣和(约1125)',is_alive:'否',highlight:true,biography:'字克源，宋登仕郎，越溪司巡检。英敏卓荦，文武兼备，始居岩下，为枫槎谢氏之始迁祖。至今近九百载，传三十六世。'},
      {id:3,name:'攒公',gender:'男',generation:'—',generation_num:2,branch:'后枫槎派',father_id:2,is_alive:'否',highlight:true,biography:'文杲公长子，分居后枫槎，开一派之先河。'},
      {id:4,name:'撰公',gender:'男',generation:'—',generation_num:2,branch:'前枫槎派',father_id:2,is_alive:'否',highlight:true,biography:'文杲公次子，分居前枫槎，与前枫槎派并立。'},
      {id:5,name:'彬公',gender:'男',generation:'—',generation_num:16,branch:'后枫槎东房',birth_date:'明隆庆壬申(1572)',is_alive:'否',highlight:true,biography:'字叔仅，十六世祖。明隆庆六年壬申（1572年），时遭洪水之患，岁季始迁枫槎，为下枫槎开基之祖。'},
      {id:6,name:'乾公',gender:'男',generation:'—',generation_num:16,branch:'后枫槎东房',birth_date:'明隆庆壬申(1572)',is_alive:'否',highlight:true,biography:'与彬公昆仲，明隆庆六年壬申（1572年），山洪暴发，庐舍为墟。与彬公相度地势，遂迁于双枫古槎之下，因名其地曰下枫槎。'},
      {id:7,name:'云先公',gender:'男',generation:'之',generation_num:21,branch:'西大房二份',birth_date:'清乾隆间',is_alive:'否',biography:'名大性，西大房二份之祖。乾隆二十七年（1762年）首倡并主持修建下枫槎谢氏宗祠，敦睦堂由此而立。'},
      {id:8,name:'文对',gender:'男',generation:'—',generation_num:1,branch:'枫槎分支',father_id:2,is_alive:'否',highlight:true,biography:'文杲公之子，枫槎谢氏分支祖。'}
    ];
  }
  function getGenealogyData() {
  // Simply return localStorage data, no seed merging
  try {
    var stored = localStorage.getItem('xie_admin_genealogy');
    if (stored) {
      var data = JSON.parse(stored);
      return data;
    }
  } catch(e) {}
  // Fallback: seed data when nothing in localStorage
  var seed = getFullSeedData();
  localStorage.setItem('xie_admin_genealogy', JSON.stringify(seed));
  return seed;
}


(function() {
  var allData = [];
  var currentId = null;
  var history = [];

  // Load data
  function loadData() {
    try {
      allData = (typeof getGenealogyData === 'function') ? getGenealogyData() : [];
    } catch(e) {}
    if (!allData || allData.length === 0) {
      document.getElementById('tree-area').innerHTML = '<div style="padding:60px;text-align:center;color:rgba(255,255,255,0.3);">暂无族谱数据<br><span style="font-size:13px;">请先在管理后台录入族人信息</span></div>';
      return;
    }
    // Default: find the earliest 枫槎 ancestor (文杲公 or similar)
    var defaultId = null;
    for (var i = 0; i < allData.length; i++) {
      var p = allData[i];
      if (p.branch && (p.branch.indexOf('枫槎') >= 0 || p.branch.indexOf('石马') >= 0)) {
        if (!defaultId || (parseInt(p.generation_num)||999) < (parseInt(allData.find(function(x){return x.id===defaultId;})?.generation_num)||999)) {
          defaultId = p.id;
        }
      }
    }
    if (!defaultId && allData.length > 0) defaultId = allData[0].id;
    if (defaultId) focusOn(defaultId);
  }

  function getPerson(id) {
    for (var i = 0; i < allData.length; i++) { if (allData[i].id === id) return allData[i]; }
    return null;
  }

  function getChildren(pid) {
    return allData.filter(function(p) { return p.father_id === pid; });
  }

  function focusOn(id) {
    if (id === currentId) return;
    currentId = id;
    // Add to history (avoid duplicates)
    if (history.length === 0 || history[history.length-1] !== id) {
      history.push(id);
      if (history.length > 20) history.shift();
    }
    render();
  }

  function goBack() {
    if (history.length < 2) return;
    history.pop(); // remove current
    var prev = history[history.length - 1];
    currentId = prev;
    render();
  }

  function render() {
    var p = getPerson(currentId);
    if (!p) return;

    var col = '#666';
    if (p.branch && p.branch.indexOf('后枫槎') >= 0) col = '#22c55e';
    else if (p.branch && p.branch.indexOf('前枫槎') >= 0) col = '#6366f1';
    else if (p.branch && p.branch.indexOf('石马') >= 0) col = '#f59e0b';

    var gen = p.generation_num ? '第' + p.generation_num + '世' : '—';
    var genderIcon = p.gender === '女' ? '👩' : '👤';

    var html = '';

    // History bar
    var hbar = document.getElementById('history-bar');
    var hhtml = '';
    if (history.length > 0) {
      history.forEach(function(hid, i) {
        var hp = getPerson(hid);
        if (!hp) return;
        var cls = (hid === currentId) ? 'current' : '';
        hhtml += '<button class="history-btn ' + cls + '" onclick="window._ftFocus(' + hid + ')">' + esc(hp.name) + '</button>';
      });
      if (history.length > 1) {
        hhtml += '<button class="history-btn clear" onclick="window._ftGoBack()">← 后退</button>';
      }
    }
    hbar.innerHTML = hhtml;

    // Tree
    // Father (above)
    if (p.father_id != null) {
      var f = getPerson(p.father_id);
      if (f) {
        html += '<div class="node" onclick="window._ftFocus(' + f.id + ')"><div class="node-card father-card"><div class="node-name">' + esc(f.name) + '</div><div class="node-gen">父</div></div></div>';
        html += '<div class="line-down"></div>';
      }
    }

    // Center: current person
    html += '<div class="node"><div class="node-card center" style="border-color:' + col + ';"><div class="node-name">' + genderIcon + ' ' + esc(p.name) + '</div><div class="node-gen">' + gen + '</div></div></div>';

    // Spouse(s) - beside current
    var spouses = [];
    if (p.spouse_ids) {
      var sids = Array.isArray(p.spouse_ids) ? p.spouse_ids : [p.spouse_ids];
      sids.forEach(function(sid) {
        if (typeof sid === 'number') {
          var sp = getPerson(sid);
          if (sp) spouses.push(sp);
        } else if (typeof sid === 'string') {
          // spouse stored as name string
          spouses.push({ id: null, name: sid, isNameOnly: true });
        }
      });
    }
    if (spouses.length > 0) {
      html += '<div class="spouse-row">';
      spouses.forEach(function(sp) {
        html += '<div class="line-h"></div>';
        if (sp.isNameOnly) {
          html += '<div class="node-card" style="border-color:rgba(236,72,153,0.3);cursor:default;"><div class="node-name" style="font-size:14px;">💑 ' + esc(sp.name) + '</div><div class="node-gen">配偶</div></div>';
        } else {
          html += '<div class="node" onclick="window._ftFocus(' + sp.id + ')"><div class="node-card" style="border-color:rgba(236,72,153,0.3);"><div class="node-name" style="font-size:14px;">💑 ' + esc(sp.name) + '</div><div class="node-gen">配偶</div></div></div>';
        }
      });
      html += '</div>';
    }

    // Children (below)
    var children = getChildren(p.id);
    if (children.length > 0) {
      html += '<div class="line-down"></div>';
      html += '<div class="children-row">';
      children.forEach(function(c) {
        var ccol = '#666';
        if (c.branch && c.branch.indexOf('后枫槎') >= 0) ccol = '#22c55e';
        else if (c.branch && c.branch.indexOf('前枫槎') >= 0) ccol = '#6366f1';
        else if (c.branch && c.branch.indexOf('石马') >= 0) ccol = '#f59e0b';
        var hl = !!(c.highlight || /^(申伯|小四公|文杲公|攒公|撰公|彬公|乾公)$/.test(c.name));
        html += '<div class="node" onclick="window._ftFocus(' + c.id + ')"><div class="node-card child-card" style="border-color:' + ccol + '40;background:' + (hl ? ccol+'15' : 'transparent') + ';"><div class="node-name" style="font-size:14px;">' + esc(c.name) + '</div><div class="node-gen">' + (c.generation_num ? '第' + c.generation_num + '世' : '') + '</div></div></div>';
      });
      html += '</div>';
    }

    document.getElementById('tree-area').innerHTML = html;

    // Detail panel
    var dp = document.getElementById('detail-panel');
    var dhtml = '';
    dhtml += '<div class="detail-row"><span class="detail-label">姓名</span><span style="font-weight:600;">' + genderIcon + ' ' + esc(p.name) + '</span></div>';
    dhtml += '<div class="detail-row"><span class="detail-label">世代</span>' + gen + '</div>';
    if (p.branch && p.branch !== '—') {
      dhtml += '<div class="detail-row"><span class="detail-label">分支</span><span class="detail-branch-tag" style="background:' + col + '20;color:' + col + ';border:1px solid ' + col + '40;">' + esc(p.branch) + '</span></div>';
    }
    if (p.birth || p.death) {
      dhtml += '<div class="detail-row"><span class="detail-label">生卒</span>' + esc(p.birth || '?') + ' — ' + esc(p.death || '?') + '</div>';
    }
    dhtml += '<div class="detail-row"><span class="detail-label">状态</span>' + (p.is_alive === '是' ? '🟢 在世' : '⚫ 已故') + '</div>';
    if (p.generation && p.generation !== '—') {
      dhtml += '<div class="detail-row"><span class="detail-label">字辈</span>' + esc(p.generation) + '</div>';
    }
    if (p.biography) {
      dhtml += '<div class="detail-row" style="flex-wrap:wrap;"><span class="detail-label">简介</span><span style="font-size:13px;line-height:1.7;">' + esc(p.biography) + '</span></div>';
    }
    dp.innerHTML = dhtml;
  }

  // Search
  var searchInput = document.getElementById('search-input');
  var searchResults = document.getElementById('search-results');
  var searchTimer = null;

  searchInput.oninput = function() {
    clearTimeout(searchTimer);
    var q = this.value.trim().toLowerCase();
    if (!q) { searchResults.style.display = 'none'; return; }
    searchTimer = setTimeout(function() {
      var results = [];
      allData.forEach(function(p) {
        if (p.name && p.name.toLowerCase().indexOf(q) >= 0) {
          results.push(p);
        }
      });
      if (results.length === 0) {
        searchResults.innerHTML = '<div style="padding:12px 14px;color:rgba(255,255,255,0.3);font-size:13px;">未找到</div>';
      } else {
        var html = '';
        results.slice(0, 20).forEach(function(r) {
          var gen = r.generation_num ? '第' + r.generation_num + '世' : '';
          html += '<div class="search-item" onclick="window._ftFocus(' + r.id + ');document.getElementById(\'search-input\').value=\'\';document.getElementById(\'search-results\').style.display=\'none\';">' + esc(r.name) + '<span class="si-gen">' + gen + '</span></div>';
        });
        searchResults.innerHTML = html;
      }
      searchResults.style.display = 'block';
    }, 200);
  };
  searchInput.onblur = function() { setTimeout(function() { searchResults.style.display = 'none'; }, 300); };
  searchInput.onfocus = function() { if (this.value.trim()) searchResults.style.display = 'block'; };

  function esc(t) { if(!t) return ''; var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

  window._ftFocus = focusOn;
  window._ftGoBack = goBack;

  // Boot
  function boot() {
    if (typeof getGenealogyData === 'function') loadData();
    else setTimeout(boot, 300);
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 100);
  else document.addEventListener('DOMContentLoaded', function() { setTimeout(boot, 100); });
})();
</script>
</body>
</html>
