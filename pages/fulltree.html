    .tree-tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
    .tree-tab { padding:8px 20px; font-size:14px; border:1px solid var(--glass-border); border-radius:8px; background:var(--glass-bg); color:var(--text-secondary); cursor:pointer; transition:all 0.2s; font-weight:500; }
    .tree-tab:hover { border-color:var(--accent-orange); color:var(--accent-orange); }
    .tree-tab.active { background:var(--accent-orange); color:#fff; border-color:var(--accent-orange); }

    .ft-node { user-select:none; }
    .ft-bar { display:flex; align-items:center; gap:6px; padding:6px 14px; border-radius:6px; cursor:pointer; transition:background 0.12s; margin:1px 6px; }
    .ft-bar:hover { background:var(--accent-orange-dim); }
    .ft-bar.root { border-left:3px solid var(--accent-orange); background:rgba(251,146,60,0.06); }

    .ft-expand { font-size:10px; width:18px; text-align:center; color:var(--text-muted); flex-shrink:0; transition:transform 0.2s; }
    .ft-expand.open { transform:rotate(90deg); }

    .ft-name { font-size:14px; font-weight:500; color:var(--text-primary); }
    .ft-name.highlight { color:var(--accent-orange); font-weight:600; }
    .ft-gen { font-size:11px; color:var(--text-tertiary); margin-left:8px; white-space:nowrap; }
    .ft-count { font-size:10px; color:var(--text-muted); margin-left:12px; white-space:nowrap; }

    .ft-children { overflow:hidden; transition:max-height 0.3s ease, opacity 0.2s ease; max-height:0; opacity:0; }
    .ft-children.open { max-height:20000px; opacity:1; }
    .ft-children .ft-bar { padding-left:34px; }
    .ft-children .ft-children .ft-bar { padding-left:54px; }
    .ft-children .ft-children .ft-children .ft-bar { padding-left:74px; }
    .ft-children .ft-children .ft-children .ft-children .ft-bar { padding-left:94px; }

    .ft-summary { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; padding:16px; margin-bottom:16px; }
    .ft-summary-card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:10px; padding:14px; text-align:center; }
    .ft-summary-card .num { font-size:24px; font-weight:700; color:var(--accent-orange); }
    .ft-summary-card .label { font-size:11px; color:var(--text-tertiary); margin-top:4px; }

    @keyframes spin { to { transform:rotate(360deg); } }
    .ft-loading { display:flex; align-items:center; justify-content:center; min-height:300px; color:var(--text-tertiary); font-size:14px; gap:10px; }
    .ft-loading::before { content:''; display:inline-block; width:18px; height:18px; border:2px solid var(--text-tertiary); border-top-color:var(--accent-orange); border-radius:50%; animation:spin 0.8s linear infinite; }

<script>
// ===== Data =====
function getGenealogyData() {
  try {
    var stored = localStorage.getItem('xie_admin_genealogy');
    if (stored) { return JSON.parse(stored); }
  } catch(e) {}
  return [];
}

function getChildren(pid, data) {
  var result = [];
  for (var i = 0; i < data.length; i++) {
    if (parseInt(data[i].father_id) === pid) result.push(data[i]);
  }
  return result;
}

function countDesc(pid, data) {
  var c = 0;
  function walk(id) { var kids = getChildren(id, data); kids.forEach(function(k) { c++; walk(k.id); }); }
  walk(pid);
  return c;
}

function escapeHtml(t) {
  if (!t) return '';
  var d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

// ===== Expand state =====
var _expanded = {}; // {id: true}
var _currentView = 'all';

function getRootIds(view, data) {
  if (view === 'all') { return [1]; } // 炎帝 id:1 is the root of everything
  if (view === 'houfengcha') {
    for (var i = 0; i < data.length; i++) {
      if (data[i].name.indexOf('攒【后枫槎】') >= 0) return [data[i].id];
    }
  }
  if (view === 'qianfengcha') {
    for (var i = 0; i < data.length; i++) {
      if (data[i].name.indexOf('撰【前枫槎】') >= 0) return [data[i].id];
    }
  }
  return [];
}

function buildTree(data, rootIds, depth) {
  if (!data || data.length === 0) return '<div class="ft-loading">暂无数据</div>';
  var html = '<div style="padding:4px 0;">';
  var shown = {};
  rootIds.forEach(function(id) {
    html += buildNode(data, id, 0, true);
  });
  html += '</div>';
  return html;

  function buildNode(data, pid, depth, parentOpen) {
    var person = null;
    for (var i = 0; i < data.length; i++) { if (data[i].id === pid) { person = data[i]; break; } }
    if (!person) return '';
    var kids = getChildren(pid, data);
    var isOpen = _expanded[pid] === true;
    var style = (depth > 0 && !parentOpen) ? ' style="display:none;"' : '';
    var isRoot = (depth === 0);
    var isHighlight = person.highlight === true || /^(炎帝|小四|文杲|攒|撰|彬|乾|文对|申伯|临魁)/.test(person.name);
    var h = '<div class="ft-node"' + style + '>';
    h += '<div class="ft-bar' + (isRoot ? ' root' : '') + '" onclick="showDetail(' + pid + ')">';
    if (kids.length > 0) {
      h += '<span class="ft-expand' + (isOpen ? ' open' : '') + '" onclick="event.stopPropagation();toggleNode(' + pid + ')">▶</span>';
    } else {
      h += '<span class="ft-expand" style="visibility:hidden;">▶</span>';
    }
    if (isHighlight) h += '<span style="font-size:12px;">⭐</span>';
    h += '<span class="ft-name' + (isHighlight ? ' highlight' : '') + '">' + escapeHtml(person.name) + '</span>';
    if (person.generation_num) h += '<span class="ft-gen">第' + person.generation_num + '世</span>';
    if (person.branch && person.branch !== '—') h += '<span style="font-size:10px;color:var(--accent-orange);padding:1px 6px;border-radius:8px;background:rgba(251,146,60,0.1);margin-left:6px;">' + escapeHtml(person.branch) + '</span>';
    if (kids.length > 0) h += '<span class="ft-count">' + kids.length + '子 · ' + countDesc(pid, data) + '后</span>';
    h += '</div>';
    if (kids.length > 0) {
      h += '<div class="ft-children' + (isOpen ? ' open' : '') + '">';
      kids.sort(function(a,b) { return (parseInt(a.generation_num)||0) - (parseInt(b.generation_num)||0); });
      kids.forEach(function(k) { h += buildNode(data, k.id, depth + 1, isOpen); });
      h += '</div>';
    }
    h += '</div>';
    return h;
  }
}

function toggleNode(id) {
  if (_expanded[id]) { delete _expanded[id]; } else { _expanded[id] = true; }
  renderView();
}

function showDetail(id) {
  var data = getGenealogyData();
  var person = null;
  for (var i = 0; i < data.length; i++) { if (data[i].id === id) { person = data[i]; break; } }
  if (!person) return;
  // Simple detail popup
  var html = '<div style="font-size:18px;font-weight:600;margin-bottom:8px;">' + escapeHtml(person.name) + '</div>';
  html += '<div style="font-size:13px;color:var(--text-secondary);line-height:1.8;">';
  if (person.generation_num) html += '<div>世代：第' + person.generation_num + '世</div>';
  if (person.gender) html += '<div>性别：' + person.gender + '</div>';
  if (person.branch && person.branch !== '—') html += '<div>支系：' + escapeHtml(person.branch) + '</div>';
  if (person.birth_date && person.birth_date !== '—') html += '<div>出生：' + person.birth_date + '</div>';
  if (person.death_date && person.death_date !== '—') html += '<div>逝世：' + person.death_date + '</div>';
  if (person.is_alive) html += '<div>状态：' + (person.is_alive === '是' ? '在世' : '已故') + '</div>';
  if (person.spouse_ids) {
    var sp = person.spouse_ids.toString().split(',').filter(function(s) { return s.trim(); }).join('、');
    if (sp) html += '<div>配偶：' + escapeHtml(sp) + '</div>';
  }
  if (person.biography && person.biography !== '—') html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--divider);">简介：' + escapeHtml(person.biography) + '</div>';
  html += '</div>';

  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  var box = document.createElement('div');
  box.style.cssText = 'background:var(--bg-primary);border:1px solid var(--glass-border);border-radius:12px;max-width:480px;width:100%;padding:28px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.3);max-height:70vh;overflow-y:auto;';
  box.innerHTML = '<button onclick="this.parentElement.parentElement.remove()" style="position:absolute;top:10px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-tertiary);">✕</button>' + html;
  overlay.appendChild(box);
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

// ===== Views =====
function switchView(view) {
  _currentView = view;
  document.querySelectorAll('.tree-tab').forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-view') === view); });
  renderView();
}

function renderView() {
  var container = document.getElementById('tree-container');
  if (!container) return;
  container.innerHTML = '<div class="ft-loading">加载中…</div>';
  setTimeout(function() {
    var data = getGenealogyData();
    if (!data || data.length === 0) {
      container.innerHTML = '<div style="padding:60px;text-align:center;color:var(--text-tertiary);">暂无数据，请先导入族谱</div>';
      return;
    }
    var rootIds = getRootIds(_currentView, data);
    if (rootIds.length === 0) {
      container.innerHTML = '<div style="padding:60px;text-align:center;color:var(--text-tertiary);">未找到该分支数据</div>';
      return;
    }
    container.innerHTML = buildTree(data, rootIds, 0);
    // Expand first level automatically
    rootIds.forEach(function(id) {
      _expanded[id] = true;
    });
    // If "all" view, also expand first few levels for context
    if (_currentView === 'all') {
      var allData = data;
      // Expand children of root (炎帝)
      var rootKids = getChildren(rootIds[0], allData);
      rootKids.forEach(function(k) { _expanded[k.id] = true; });
      // Expand children of gen2 to show more context
      rootKids.forEach(function(k) {
        var gen2kids = getChildren(k.id, allData);
        gen2kids.forEach(function(g2) { _expanded[g2.id] = true; });
      });
    }
    // Re-render with expanded state
    container.innerHTML = buildTree(data, rootIds, 0);
  }, 10);
}

// Init
document.addEventListener('DOMContentLoaded', function() {
  switchView('all');
});
</script>
