  <script>
  // ===== 动态加载活动数据 =====
  (function() {
    var container = document.getElementById('activities-container');
    if (!container) return;

    function renderActivities(data) {
      if (!data || data.length === 0) {
        container.innerHTML = '<section style="margin-bottom:50px;"><div class="section-title"><h2>活动回顾</h2><div class="divider"></div></div><p style="text-align:center;color:var(--text-tertiary);padding:40px 0;">暂无活动数据</p></section>';
        return;
      }

      // Sort by date descending
      data.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });

      var pastActivities = data.filter(function(a) { return a.status === '已举办'; });
      var upcomingActivities = data.filter(function(a) { return a.status !== '已举办'; });

      var html = '';

      // === 活动回顾 ===
      html += '<section style="margin-bottom:50px;">';
      html += '<div class="section-title"><h2>活动回顾</h2><div class="divider"></div></div>';

      if (pastActivities.length === 0) {
        html += '<p style="text-align:center;color:var(--text-tertiary);padding:20px 0;">暂无已举办的活动</p>';
      } else {
        for (var i = 0; i < pastActivities.length; i++) {
          var a = pastActivities[i];
          var photos = [];
          if (a.photos) {
            try { photos = typeof a.photos === 'string' ? JSON.parse(a.photos) : a.photos; } catch(e) {}
          }

          html += '<div class="activity-card fade-in">';
          html += '<div class="activity-img" style="font-size:60px;">' + (a.icon || '🎉') + '</div>';
          html += '<div class="activity-details">';
          html += '<span class="date-tag">' + formatActDate(a.date) + '</span>';
          html += '<h3>' + escapeActHtml(a.title) + '</h3>';
          html += '<p>' + escapeActHtml(a.content) + '</p>';
          if (a.location) {
            html += '<p style="font-size:12px;color:var(--text-tertiary);margin-top:6px;">📍 ' + escapeActHtml(a.location) + '</p>';
          }

          // Photo strip
          if (photos.length > 0) {
            html += '<div class="activity-photos-strip">';
            var showCount = Math.min(photos.length, 5);
            for (var pi = 0; pi < showCount; pi++) {
              html += '<img src="' + photos[pi] + '" alt="" loading="lazy" onclick="openLightbox(' + "'" + escapeActHtml(JSON.stringify(photos)) + "'" + ',' + pi + ')" onerror="this.style.display=\'none\'">';
            }
            if (photos.length > 5) {
              html += '<div class="more-overlay" onclick="openLightbox(' + "'" + escapeActHtml(JSON.stringify(photos)) + "'" + ',5)">+' + (photos.length - 5) + '</div>';
            }
            html += '</div>';
          }

          html += '</div></div>';
        }
      }
      html += '</section>';

      // === 活动预告 ===
      if (upcomingActivities.length > 0) {
        html += '<section id="upcoming" style="margin-bottom:50px;">';
        html += '<div class="section-title"><h2>活动预告</h2><div class="divider"></div></div>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">';
        for (var ui = 0; ui < upcomingActivities.length; ui++) {
          var ua = upcomingActivities[ui];
          var statusColor = ua.status === '即将举行' ? 'var(--accent-orange)' : 'var(--accent-orange-dim)';
          var statusTextColor = ua.status === '即将举行' ? '#000' : 'var(--accent-orange)';
          html += '<div class="glass-card" style="padding:24px;border-top:3px solid var(--accent-orange);">';
          html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
          html += '<span style="background:' + statusColor + ';color:' + statusTextColor + ';padding:2px 10px;border-radius:3px;font-size:12px;font-weight:' + (ua.status !== '即将举行' ? '500' : '') + ';">' + escapeActHtml(ua.status) + '</span>';
          html += '<span style="font-size:12px;color:var(--text-tertiary);">' + formatActDate(ua.date) + '</span>';
          html += '</div>';
          html += '<h3 style="font-family:var(--font-title);color:var(--text-primary);font-size:17px;font-weight:500;">' + escapeActHtml(ua.title) + '</h3>';
          html += '<p style="font-size:13px;color:var(--text-tertiary);margin:8px 0;">' + escapeActHtml(ua.content) + '</p>';
          if (ua.location) {
            html += '<p style="font-size:12px;color:var(--text-tertiary);">地点：' + escapeActHtml(ua.location) + '</p>';
          }
          html += '</div>';
        }
        html += '</div></section>';
      }

      container.innerHTML = html;

      // Kick off fade-in observer for new elements
      if (typeof initFadeIn === 'function') initFadeIn();
    }

    function formatActDate(d) {
      if (!d) return '';
      var parts = d.split('-');
      if (parts.length === 3) return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
      return d;
    }

    function escapeActHtml(t) {
      if (!t) return '';
      var d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    // Load data: try server first, fallback to localStorage
    function loadActivities() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/data/activities', true);
      xhr.timeout = 5000;
      xhr.onload = function() {
        if (xhr.status === 200) {
          try {
            var parsed = JSON.parse(xhr.responseText);
            if (parsed && parsed.data && Array.isArray(parsed.data)) {
              renderActivities(parsed.data);
              return;
            }
          } catch(e) {}
        }
        // Fallback to localStorage
        var local = localStorage.getItem('xie_admin_activities');
        if (local) {
          try { renderActivities(JSON.parse(local)); } catch(e) { renderActivities(null); }
        } else {
          renderActivities(null);
        }
      };
      xhr.onerror = function() {
        var local = localStorage.getItem('xie_admin_activities');
        if (local) {
          try { renderActivities(JSON.parse(local)); } catch(e) { renderActivities(null); }
        } else {
          renderActivities(null);
        }
      };
      xhr.ontimeout = function() {
        var local = localStorage.getItem('xie_admin_activities');
        if (local) {
          try { renderActivities(JSON.parse(local)); } catch(e) { renderActivities(null); }
        } else {
          renderActivities(null);
        }
      };
      xhr.send();
    }

    // Patch openLightbox to accept JSON string from onclick
    var origOpen = window.openLightbox;
    window.openLightbox = function(photosData, index) {
      var photos = [];
      if (typeof photosData === 'string') {
        try { photos = JSON.parse(photosData); } catch(e) { return; }
      } else if (Array.isArray(photosData)) {
        photos = photosData;
      } else {
        return;
      }
      if (typeof origOpen === 'function') {
        origOpen(photos, index || 0);
      }
    };

    loadActivities();
  })();
  </script>

  <script src="../js/main.js?v=5"></script>
  <script>
    const canvas = document.getElementById('bg-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let w, h;
      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      resize(); window.addEventListener('resize', resize);
      const dots = [];
      for (let i = 0; i < 80; i++) dots.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, r: Math.random() * 2 + 1, a: Math.random() * 0.3 + 0.1 });
      const orbs = [
        { x: 0.2, y: 0.3, r: 0.35, color: 'rgba(251,146,60,0.06)' },
        { x: 0.8, y: 0.7, r: 0.3, color: 'rgba(34,211,238,0.05)' },
        { x: 0.5, y: 0.1, r: 0.25, color: 'rgba(251,146,60,0.04)' }
      ];
      function draw() {
        ctx.clearRect(0, 0, w, h);
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const dotRgb = isDark ? '255,255,255' : '100,100,100';
        orbs.forEach(o => {
          const grad = ctx.createRadialGradient(o.x * w, o.y * h, 0, o.x * w, o.y * h, o.r * w);
          grad.addColorStop(0, o.color); grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        });
        dots.forEach(d => {
          d.x += d.vx; d.y += d.vy;
          if (d.x < 0) d.x = w; if (d.x > w) d.x = 0;
          if (d.y < 0) d.y = h; if (d.y > h) d.y = 0;
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${dotRgb},${d.a})`; ctx.fill();
        });
        for (let i = 0; i < dots.length; i++) {
          for (let j = i + 1; j < dots.length; j++) {
            const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
              ctx.beginPath(); ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y);
              ctx.strokeStyle = `rgba(${dotRgb},${(1 - dist / 150) * 0.08})`;
              ctx.lineWidth = 0.5; ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
