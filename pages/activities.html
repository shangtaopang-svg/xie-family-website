  <style>
    /* Activity card photo carousel */
    .ac-photo-wrap {
      position: relative;
      min-height: 240px;
      height: 100%;
      overflow: hidden;
    }
    .ac-photo-wrap .ac-photo-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      background: linear-gradient(135deg, #e8e2da, #ddd8d0);
    }
    [data-theme="dark"] .ac-photo-wrap .ac-photo-slide {
      background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
    }
    .ac-photo-wrap .ac-photo-slide.active {
      opacity: 1;
    }
    .ac-photo-wrap .ac-photo-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }
    .ac-photo-wrap .ac-photo-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      color: rgba(255,255,255,0.85);
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: background 0.2s;
      line-height: 1;
    }
    .ac-photo-wrap .ac-photo-nav:hover {
      background: rgba(0,0,0,0.6);
    }
    .ac-photo-wrap:hover .ac-photo-nav {
      display: flex;
    }
    .ac-photo-prev { left: 8px; }
    .ac-photo-next { right: 8px; }
    .ac-photo-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      z-index: 5;
    }
    .ac-photo-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      transition: all 0.3s;
    }
    .ac-photo-dots span.active {
      background: #fff;
      width: 14px;
      border-radius: 3px;
    }
    .ac-photo-count {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      z-index: 5;
    }

    @media (max-width: 800px) {
      .ac-photo-wrap { min-height: 240px; }
      .ac-photo-wrap .ac-photo-nav { display: flex; width: 28px; height: 28px; font-size: 14px; }
    }
  </style>

<body><script>
(function(){
  var ptKey = 'pt_go';
  var pt = document.getElementById('page-transition');

  // If arriving from transition (sessionStorage flag)
  if (sessionStorage.getItem(ptKey)) {
    sessionStorage.removeItem(ptKey);
    if (!pt) {
      pt = document.createElement('div');
      pt.id = 'page-transition';
      pt.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgb(7,16,31);display:flex;flex-direction:column;align-items:center;justify-content:center;';if(!document.getElementById('pt-keyframes')){var ks=document.createElement('style');ks.id='pt-keyframes';ks.textContent='@keyframes ptSlide{0%{width:0}100%{width:100%}}@keyframes ptDash{0%{stroke-dashoffset:0}50%{stroke-dashoffset:-17}100%{stroke-dashoffset:-34}}@keyframes ptFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes ptDot{0%,100%{opacity:0.2}50%{opacity:1}}';document.head.appendChild(ks);}
      pt.innerHTML = '<div style="text-align:center;animation:ptFade 0.3s ease both;"><div style="width:100px;height:100px;margin:0 auto 28px;"><svg viewBox="-3 -4 39 39" style="width:100%;height:100%;"><polygon fill="transparent" stroke="#04BF00" stroke-width="2" points="16,0 32,32 0,32" stroke-dasharray="17" style="animation:ptDash 0.8s cubic-bezier(0.35,0.04,0.63,0.95) infinite;"/></svg></div><div style="font-size:18px;color:#04BF00;letter-spacing:1px;white-space:nowrap;">ShangTaoPang 正在工作中<span style="display:inline;animation:ptDot 1.4s ease infinite;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.2s;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.4s;">.</span></div><div style="margin:24px auto 0;height:4px;width:100%;min-width:360px;max-width:90vw;background:rgba(255,255,255,0.1);border-radius:4px;"><div style="height:4px;border-radius:4px;background:#04BF00;width:0;animation:ptSlide 1.8s ease forwards;min-width:0;"></div></div></div>';
      document.body.appendChild(pt);
    }
    // Fade out after brief display
    setTimeout(function(){ pt.style.transition='opacity 0.5s ease'; pt.style.opacity='0'; setTimeout(function(){ pt.style.display='none'; },500); },1000);
    return;
  }

  // If overlay HTML exists on page (from index.html), ensure it's hidden
  if (pt) pt.style.display = 'none';

  // Intercept nav clicks directly (inline, reliable)
  document.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if (!a) return;
    if (a.classList.contains('back-page-btn')) return;
    var h = a.getAttribute('href');
    if (!h || h==='#' || h.startsWith('javascript:') || h.startsWith('http') || h.startsWith('tel:') || h.startsWith('mailto:') || !h.includes('.html')) return;
    var cur = window.location.pathname.split('/').pop() || 'index.html';
    if (h === cur || h === './'+cur) return;
    e.preventDefault();
    e.stopPropagation();
    sessionStorage.setItem(ptKey, '1');
    sessionStorage.setItem('back_to', window.location.href);
    // Show overlay with all inline styles
    var ov = document.getElementById('page-transition') || document.createElement('div');
    ov.id = 'page-transition';
    ov.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgb(7,16,31);display:flex;flex-direction:column;align-items:center;justify-content:center;';
    ov.innerHTML = '<div style="text-align:center;animation:ptFade 0.3s ease both;"><div style="width:100px;height:100px;margin:0 auto 28px;"><svg viewBox="-3 -4 39 39" style="width:100%;height:100%;"><polygon fill="transparent" stroke="#04BF00" stroke-width="2" points="16,0 32,32 0,32" stroke-dasharray="17" style="animation:ptDash 0.8s cubic-bezier(0.35,0.04,0.63,0.95) infinite;"/></svg></div><div style="font-size:18px;color:#04BF00;letter-spacing:1px;white-space:nowrap;">ShangTaoPang 正在工作中<span style="display:inline;animation:ptDot 1.4s ease infinite;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.2s;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.4s;">.</span></div><div style="margin:24px auto 0;height:4px;width:100%;min-width:360px;max-width:90vw;background:rgba(255,255,255,0.1);border-radius:4px;"><div style="height:4px;border-radius:4px;background:#04BF00;width:0;animation:ptSlide 1.8s ease forwards;min-width:0;"></div></div></div>';
    if (!document.getElementById('pt-keyframes')) {
      var ks = document.createElement('style');
      ks.id = 'pt-keyframes';
      ks.textContent = '@keyframes ptSlide{0%{width:0}100%{width:100%}}@keyframes ptDash{0%{stroke-dashoffset:0}50%{stroke-dashoffset:-17}100%{stroke-dashoffset:-34}}@keyframes ptFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes ptDot{0%,100%{opacity:0.2}50%{opacity:1}}';
      document.head.appendChild(ks);
    }
    if (ov.parentNode !== document.body) document.body.appendChild(ov);
    setTimeout(function(){ window.location.href = h; }, 800);
  });
})();
</script>

  <script>
  // ===== 动态加载活动数据 =====
  (function() {
    var container = document.getElementById('activities-container');
    if (!container) return;

    // Store carousel timers for cleanup
    var carouselTimers = {};

    function renderCalendar() {
        var calEl = document.getElementById('activity-calendar');
        if (!calEl) return;
        var data = JSON.parse(localStorage.getItem('xie_admin_activities') || '[]');
        if (!data.length) { calEl.innerHTML = ''; return; }
        var months = {};
        data.forEach(function(a) {
          if (!a.date) return;
          var m = a.date.substring(0, 7);
          if (!months[m]) months[m] = [];
          months[m].push(a);
        });
        var sorted = Object.keys(months).sort(function(a,b){return b.localeCompare(a);});
        var html = '<div class="section-title"><h2>📅 活动日历</h2><div class="divider"></div></div><div style="max-height:400px;overflow-y:auto;padding-right:8px;">';
        sorted.forEach(function(m) {
          var label = m.split('-')[0] + '年' + parseInt(m.split('-')[1]) + '月';
          html += '<div style="margin-bottom:16px;"><div style="font-size:14px;font-weight:600;color:var(--accent-orange);margin-bottom:6px;padding:4px 0;border-bottom:1px solid var(--accent-orange-dim);">' + label + '</div>';
          months[m].forEach(function(a) {
            html += '<div style="display:flex;gap:8px;margin-bottom:6px;padding:4px 8px;border-radius:6px;background:var(--glass-bg);">';
            html += '<span style="font-size:11px;color:var(--text-tertiary);white-space:nowrap;padding-top:2px;">' + (a.date || '') + '</span>';
            html += '<span style="font-size:13px;">' + (a.title || '') + '</span>';
            html += '</div>';
          });
          html += '</div>';
        });
        html += '</div>';
        calEl.innerHTML = html;
    }

    function renderActivities(data) {
      if (!data || data.length === 0) {
        container.innerHTML = '<section style="margin-bottom:50px;"><div class="section-title"><h2>活动回顾</h2><div class="divider"></div></div><p style="text-align:center;color:var(--text-tertiary);padding:40px 0;">暂无活动数据</p></section>';
        return;
      }

      data.sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });

      var pastActivities = data.filter(function(a) { return a.status === '已举办'; });
      var upcomingActivities = data.filter(function(a) { return a.status !== '已举办'; });

      var html = '';

      // === 活动回顾 ===
      html += '<section style="margin-bottom:50px;">';
      html += '<div class="section-title"><h2>活动回顾</h2><div class="divider"></div></div>';
      // Photo company album banner
      html += '<a href="https://m.alltuu.com/album/23b7ac3ea07ac557f1caab0d5e402ca9/?menu=hot" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1a1a2e,#16213e);border-radius:12px;padding:16px 22px;margin-bottom:24px;text-decoration:none;transition:transform 0.2s,box-shadow 0.2s;" onmouseover="this.style.transform=\"translateY(-2px)\";this.style.boxShadow=\"0 8px 25px rgba(0,0,0,0.3)\"" onmouseout="this.style.transform=\"\";this.style.boxShadow=\"\"">';
      html += '<div style="width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#e94560,#ff6b6b);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;">📷</div>';
      html += '<div style="flex:1;min-width:0;">';
      html += '<div style="color:#fff;font-size:15px;font-weight:600;margin-bottom:2px;">摄影公司全程拍摄 · 高清原片</div>';
      html += '<div style="color:rgba(255,255,255,0.6);font-size:12px;">点击查看全部活动照片 ></div>';
      html += '</div>';
      html += '<div style="color:#e94560;font-size:13px;white-space:nowrap;font-weight:500;">查看相册 →</div>';
      html += '</a>';

      if (pastActivities.length === 0) {
        html += '<p style="text-align:center;color:var(--text-tertiary);padding:20px 0;">暂无已举办的活动</p>';
      } else {
        for (var i = 0; i < pastActivities.length; i++) {
          var a = pastActivities[i];
          var photos = [];
          if (a.photos) {
            try { photos = typeof a.photos === 'string' ? JSON.parse(a.photos) : a.photos; } catch(e) {}
          }

          html += '<div class="activity-card fade-in" data-activity-id="' + (a.id || i) + '">';

          // Left: photo carousel or icon fallback
          if (photos.length > 0) {
            html += '<div class="ac-photo-wrap" data-activity-idx="' + i + '">';
            html += '<div class="ac-photo-count">' + photos.length + '张</div>';
            for (var pi = 0; pi < photos.length; pi++) {
              html += '<div class="ac-photo-slide' + (pi === 0 ? ' active' : '') + '" data-pidx="' + pi + '">';
              html += '<img' + (pi === 0 ? ' src="' + photos[pi] + '"' : ' data-src="' + photos[pi] + '"') + ' src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="" onclick="handleActivityPhotoClick(' + i + ',' + pi + ')" onerror="this.parentElement.innerHTML=\'\' + esc(a.icon || \'🎉\') + \'\'">';
              html += '</div>';
            }
            html += '<button class="ac-photo-nav ac-photo-prev" onclick="event.stopPropagation();navActivityCarousel(' + i + ',-1)">‹</button>';
            html += '<button class="ac-photo-nav ac-photo-next" onclick="event.stopPropagation();navActivityCarousel(' + i + ',1)">›</button>';
            html += '<div class="ac-photo-dots">';
            for (var di = 0; di < photos.length; di++) {
              html += '<span' + (di === 0 ? ' class="active"' : '') + '></span>';
            }
            html += '</div>';
            html += '</div>';
          } else {
            html += '<div class="activity-img" style="font-size:60px;">' + (a.icon || '🎉') + '</div>';
          }

          // Right: details
          html += '<div class="activity-details">';
          html += '<span class="date-tag">' + formatDate(a.date) + '</span>';
          html += '<h3>' + esc(a.title) + '</h3>';
          html += '<p>' + esc(a.content) + '</p>';
          if (a.location) {
            html += '<p style="font-size:12px;color:var(--text-tertiary);margin-top:6px;">📍 ' + esc(a.location) + '</p>';
          }
          html += '</div></div>';
        }
      }
      html += '</section>';

      // === 活动预告 ===
      if (upcomingActivities.length > 0) {
        html += '<section id="upcoming" style="margin-bottom:50px;">';
        html += '<div class="section-title"><h2>活动预告</h2><div class="divider"></div></div>';
        html += '<div class="mobile-stack-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">';
        for (var ui = 0; ui < upcomingActivities.length; ui++) {
          var ua = upcomingActivities[ui];
          var sc = ua.status === '即将举行' ? 'var(--accent-orange)' : 'var(--accent-orange-dim)';
          var stc = ua.status === '即将举行' ? '#000' : 'var(--accent-orange)';
          html += '<div class="glass-card" style="padding:24px;border-top:3px solid var(--accent-orange);">';
          html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
          html += '<span style="background:' + sc + ';color:' + stc + ';padding:2px 10px;border-radius:3px;font-size:12px;font-weight:' + (ua.status !== '即将举行' ? '500' : '') + ';">' + esc(ua.status) + '</span>';
          html += '<span style="font-size:12px;color:var(--text-tertiary);">' + formatDate(ua.date) + '</span>';
          html += '</div>';
          html += '<h3 style="font-family:var(--font-title);color:var(--text-primary);font-size:17px;font-weight:500;">' + esc(ua.title) + '</h3>';
          html += '<p style="font-size:13px;color:var(--text-tertiary);margin:8px 0;">' + esc(ua.content) + '</p>';
          if (ua.location) {
            html += '<p style="font-size:12px;color:var(--text-tertiary);">地点：' + esc(ua.location) + '</p>';
          }
          html += '</div>';
        }
        html += '</div></section>';
      }

      container.innerHTML = html;
      if (typeof initFadeIn === 'function') initFadeIn();

      // Start carousels
      for (var ci = 0; ci < pastActivities.length; ci++) {
        var act = pastActivities[ci];
        var ph = [];
        if (act.photos) { try { ph = typeof act.photos === 'string' ? JSON.parse(act.photos) : act.photos; } catch(e) {} }
        if (ph.length > 0) {
          startCarousel(ci);
        }
      }
    }

    // ===== Carousel per activity =====
    function startCarousel(idx) {
      stopCarousel(idx);
      carouselTimers['c' + idx] = setInterval(function() {
        var wrap = document.querySelector('.ac-photo-wrap[data-activity-idx="' + idx + '"]');
        if (!wrap) { stopCarousel(idx); return; }
        advanceCarousel(wrap, 1);
      }, 3000);
    }

    function stopCarousel(idx) {
      if (carouselTimers['c' + idx]) {
        clearInterval(carouselTimers['c' + idx]);
        delete carouselTimers['c' + idx];
      }
    }

    function advanceCarousel(wrap, dir) {
      var slides = wrap.querySelectorAll('.ac-photo-slide');
      var dots = wrap.querySelectorAll('.ac-photo-dots span');
      if (slides.length < 2) return;
      var current = 0;
      for (var si = 0; si < slides.length; si++) {
        if (slides[si].classList.contains('active')) { current = si; break; }
      }
      var next = current + dir;
      if (next < 0) next = slides.length - 1;
      if (next >= slides.length) next = 0;
      slides[current].classList.remove('active');
      slides[next].classList.add('active');
      // Lazy-load slide image + preload next
      var loadImg = function(slideEl) {
        var img = slideEl.querySelector('img');
        if (img && img.getAttribute('data-src')) {
          img.src = img.getAttribute('data-src');
          img.removeAttribute('data-src');
        }
      };
      loadImg(slides[next]);
      // Preload the one after next
      var preloadIdx = next + dir;
      if (preloadIdx < 0) preloadIdx = slides.length - 1;
      if (preloadIdx >= slides.length) preloadIdx = 0;
      if (preloadIdx !== next) loadImg(slides[preloadIdx]);
      if (dots.length) { dots[current].classList.remove('active'); dots[next].classList.add('active'); }
    }

    window.navActivityCarousel = function(idx, dir) {
      stopCarousel(idx);
      var wrap = document.querySelector('.ac-photo-wrap[data-activity-idx="' + idx + '"]');
      if (wrap) advanceCarousel(wrap, dir);
      startCarousel(idx);
    };

    // Store all activity photos for lightbox
    window._activityPhotos = [];

    window.handleActivityPhotoClick = function(actIdx, photoIdx) {
      var data = window._allActivities || [];
      var act = data.filter(function(a) { return a.status === '已举办'; })[actIdx];
      if (!act) return;
      var photos = [];
      if (act.photos) { try { photos = typeof act.photos === 'string' ? JSON.parse(act.photos) : act.photos; } catch(e) {} }
      if (photos.length === 0) return;
      window._currentActivityPhotos = photos;
      if (typeof window.openLightbox === 'function') {
        window.openLightbox(photos, photoIdx);
      }
    };

    function formatDate(d) {
      if (!d) return '';
      var parts = d.split('-');
      if (parts.length === 3) return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
      return d;
    }

    function esc(t) {
      if (!t) return '';
      var d = document.createElement('div');
      d.textContent = t;
      return d.innerHTML;
    }

    function loadActivities() {
      // Show localStorage immediately (instant)
      var local = localStorage.getItem('xie_admin_activities');
      if (local) {
        try {
          var d = JSON.parse(local);
          if (d && d.length) {
            window._allActivities = d;
            renderCalendar();
            renderActivities(d);
          }
        } catch(e) {}
      } else {
        renderActivities(null);
      }

      // Then fetch server data (will replace local data when it arrives)
      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/data/activities', true);
      xhr.timeout = 20000;
      xhr.onload = function() {
        if (xhr.status === 200) {
          var parsed;
          try {
            parsed = JSON.parse(xhr.responseText);
          } catch(e) { console.warn('Activities JSON parse error:', e); return; }
          if (parsed && Array.isArray(parsed)) {
            localStorage.setItem('xie_admin_activities', JSON.stringify(parsed));
            window._allActivities = parsed;
            try {
              renderActivities(parsed);
            } catch(e) { console.error('Activities render error:', e); }
          }
        }
      };
      xhr.onerror = function() {};
      xhr.ontimeout = function() {};
      xhr.send();
    }

    loadActivities();
  })();
  </script>
