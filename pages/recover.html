<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>数据恢复</title>
<style>body{font-family:sans-serif;padding:40px;max-width:600px;margin:0 auto;background:#1a1a2e;color:#fff}
button{padding:14px 28px;font-size:16px;border:none;border-radius:8px;cursor:pointer;background:#c9a84c;color:#1a1a2e;font-weight:600;margin:10px 0}
button:hover{background:#f0d68a}
pre{background:rgba(255,255,255,0.05);padding:16px;border-radius:8px;overflow:auto;max-height:400px;font-size:12px}
.status{padding:12px;border-radius:6px;margin:10px 0}
.success{background:rgba(76,175,80,0.2);border:1px solid #4caf50}
.error{background:rgba(244,67,54,0.2);border:1px solid #f44336}
.info{background:rgba(33,150,243,0.2);border:1px solid #2196f3}
</style></head>
<body><script>
(function(){
  var ptKey = 'pt_go';
  var pt = document.getElementById('page-transition');
  
  // If arriving from transition (sessionStorage flag)
  if (sessionStorage.getItem(ptKey)) {
    sessionStorage.removeItem(ptKey);
    if (!pt) {
      pt = document.createElement('div');
      pt.id = 'page-transition';
      pt.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgb(7,16,31);display:flex;flex-direction:column;align-items:center;justify-content:center;';if(!document.getElementById('pt-keyframes')){var ks=document.createElement('style');ks.id='pt-keyframes';ks.textContent='@keyframes ptSlide{0%{width:0}100%{width:100%}}@keyframes ptDash{0%{stroke-dashoffset:0}50%{stroke-dashoffset:-17}100%{stroke-dashoffset:-34}}@keyframes ptFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes ptDot{0%,100%{opacity:0.2}50%{opacity:1}}';document.head.appendChild(ks);}
      pt.innerHTML = '<div style="text-align:center;animation:ptFade 0.3s ease both;"><div style="width:100px;height:100px;margin:0 auto 28px;"><svg viewBox="-3 -4 39 39" style="width:100%;height:100%;"><polygon fill="transparent" stroke="#04BF00" stroke-width="2" points="16,0 32,32 0,32" stroke-dasharray="17" style="animation:ptDash 0.8s cubic-bezier(0.35,0.04,0.63,0.95) infinite;"/></svg></div><div style="font-size:18px;color:#fff;letter-spacing:1px;white-space:nowrap;">ShangTaoPang 正在工作中<span style="display:inline;animation:ptDot 1.4s ease infinite;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.2s;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.4s;">.</span></div><div style="margin:24px auto 0;height:4px;width:100%;min-width:360px;max-width:90vw;background:rgba(255,255,255,0.1);border-radius:4px;"><div style="height:4px;border-radius:4px;background:#04BF00;width:0;animation:ptSlide 1.8s ease forwards;min-width:0;"></div></div></div>';
      document.body.appendChild(pt);
    }
    // Fade out after brief display
    setTimeout(function(){ pt.style.transition='opacity 0.5s ease'; pt.style.opacity='0'; setTimeout(function(){ pt.style.display='none'; },500); },1000);
    return;
  }
  
  // If overlay HTML exists on page (from index.html), ensure it's hidden
  if (pt) pt.style.display = 'none';
  
  // Intercept nav clicks directly (inline, reliable)
  document.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if (!a) return;
    var h = a.getAttribute('href');
    if (!h || h==='#' || h.startsWith('javascript:') || h.startsWith('http') || h.startsWith('tel:') || h.startsWith('mailto:') || !h.includes('.html')) return;
    var cur = window.location.pathname.split('/').pop() || 'index.html';
    if (h === cur || h === './'+cur) return;
    e.preventDefault();
    e.stopPropagation();
    sessionStorage.setItem(ptKey, '1');
    // Show overlay with all inline styles
    var ov = document.getElementById('page-transition') || document.createElement('div');
    ov.id = 'page-transition';
    ov.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgb(7,16,31);display:flex;flex-direction:column;align-items:center;justify-content:center;';
    ov.innerHTML = '<div style="text-align:center;animation:ptFade 0.3s ease both;"><div style="width:100px;height:100px;margin:0 auto 28px;"><svg viewBox="-3 -4 39 39" style="width:100%;height:100%;"><polygon fill="transparent" stroke="#04BF00" stroke-width="2" points="16,0 32,32 0,32" stroke-dasharray="17" style="animation:ptDash 0.8s cubic-bezier(0.35,0.04,0.63,0.95) infinite;"/></svg></div><div style="font-size:18px;color:#fff;letter-spacing:1px;white-space:nowrap;">ShangTaoPang 正在工作中<span style="display:inline;animation:ptDot 1.4s ease infinite;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.2s;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.4s;">.</span></div><div style="margin:24px auto 0;height:4px;width:100%;min-width:360px;max-width:90vw;background:rgba(255,255,255,0.1);border-radius:4px;"><div style="height:4px;border-radius:4px;background:#04BF00;width:0;animation:ptSlide 1.8s ease forwards;min-width:0;"></div></div></div>';
    if (!document.getElementById('pt-keyframes')) {
      var ks = document.createElement('style');
      ks.id = 'pt-keyframes';
      ks.textContent = '@keyframes ptSlide{0%{width:0}100%{width:100%}}@keyframes ptDash{0%{stroke-dashoffset:0}50%{stroke-dashoffset:-17}100%{stroke-dashoffset:-34}}@keyframes ptFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes ptDot{0%,100%{opacity:0.2}50%{opacity:1}}';
      document.head.appendChild(ks);
    }
    if (ov.parentNode !== document.body) document.body.appendChild(ov);
    setTimeout(function(){ window.location.href = h; }, 800);
  });
})();
</script>

<h1>🛟 族谱数据恢复工具</h1>
<p>这个页面会尝试从你的浏览器中找回丢失的族谱数据。</p>

<div id="status"></div>

<button onclick="checkData()">🔍 检查 localStorage 数据</button>
<button onclick="sendToServer()">📤 发送到服务器恢复</button>

<script>
function log(msg, type) {
  var el = document.getElementById('status');
  el.innerHTML += '<div class="status ' + (type || 'info') + '">' + msg + '</div>';
}

function checkData() {
  log('正在检查 localStorage...', 'info');
  var keys = Object.keys(localStorage);
  log('找到 ' + keys.length + ' 个 localStorage 键');

  keys.forEach(function(k) {
    try {
      var val = localStorage.getItem(k);
      var display = val.substring(0, 100);
      try {
        var parsed = JSON.parse(val);
        if (Array.isArray(parsed)) {
          log('✅ ' + k + ': 数组，' + parsed.length + ' 项', 'success');
          if (parsed.length > 0 && parsed[0].name) {
            log('   首项: ' + parsed[0].name);
          }
          if (parsed.length > 100) {
            log('   ⭐ 找到大量数据！共 ' + parsed.length + ' 条记录', 'success');
          }
        } else {
          log('📦 ' + k + ': 对象，' + Object.keys(parsed).length + ' 个键');
        }
      } catch(e) {
        log('📄 ' + k + ': 文本 (' + val.length + ' 字符)');
      }
    } catch(e) {
      log('❌ ' + k + ': 读取失败 - ' + e.message, 'error');
    }
  });
}

function sendToServer() {
  var key = 'xie_admin_genealogy';
  var raw = localStorage.getItem(key);
  if (!raw) {
    key = 'genealogy_data';
    raw = localStorage.getItem(key);
  }
  if (!raw) {
    log('❌ 未找到族谱数据！请先用「检查数据」查看有哪些键', 'error');
    return;
  }

  try {
    var data = JSON.parse(raw);
    log('📤 正在发送 ' + data.length + ' 条数据到服务器...', 'info');

    // Send via API
    fetch('/api/data/genealogy', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: raw
    }).then(function(r) { return r.json(); }).then(function(result) {
      if (result.ok || result.count) {
        log('✅ 成功! 已上传 ' + (result.count || data.length) + ' 条记录到服务器', 'success');
        log('🔄 请刷新管理后台查看');
      } else {
        log('⚠️ 服务器响应: ' + JSON.stringify(result), 'error');
      }
    }).catch(function(e) {
      log('❌ 发送失败: ' + e.message, 'error');
    });
  } catch(e) {
    log('❌ 数据解析失败: ' + e.message, 'error');
  }
}

log('⚠️ 注意：如果你的数据已经在浏览器中被清空，这里也找不回来。', 'error');
log('💡 如能找到最初导入的CSV文件，可以通过管理后台重新导入。', 'info');
</script>
  <a href="javascript:history.back()" class="back-page-btn" data-i18n-aria="back.page" aria-label="返回上一页">← 返回</a>
  <button class="back-top" data-i18n-aria="back.top" aria-label="回到顶部">↑</button>
</body>
</html>
