      document.body.appendChild(pt);

    // Fade out after brief display
    setTimeout(function(){ pt.style.transition='opacity 0.5s ease'; pt.style.opacity='0'; setTimeout(function(){ pt.style.display='none'; },500); },1000);
    return;
  }
  
  // If overlay HTML exists on page (from index.html), ensure it's hidden
  if (pt) pt.style.display = 'none';
  
  // Intercept nav clicks directly (inline, reliable)
  document.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if (!a) return;
    if (a.classList.contains('back-page-btn')) return;
    var h = a.getAttribute('href');
    if (!h || h==='#' || h.startsWith('javascript:') || h.startsWith('http') || h.startsWith('tel:') || h.startsWith('mailto:') || !h.includes('.html')) return;
    var cur = window.location.pathname.split('/').pop() || 'index.html';
    if (h === cur || h === './'+cur) return;
    e.preventDefault();
    e.stopPropagation();
    sessionStorage.setItem(ptKey, '1');
    sessionStorage.setItem('back_to', window.location.href);
    // Show overlay with all inline styles
    var ov = document.getElementById('page-transition') || document.createElement('div');
    ov.id = 'page-transition';
    ov.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgb(7,16,31);display:flex;flex-direction:column;align-items:center;justify-content:center;';
    ov.innerHTML = '<div style="text-align:center;animation:ptFade 0.3s ease both;"><div style="width:100px;height:100px;margin:0 auto 28px;"><svg viewBox="-3 -4 39 39" style="width:100%;height:100%;"><polygon fill="transparent" stroke="#04BF00" stroke-width="2" points="16,0 32,32 0,32" stroke-dasharray="17" style="animation:ptDash 0.8s cubic-bezier(0.35,0.04,0.63,0.95) infinite;"/></svg></div><div style="font-size:18px;color:#04BF00;letter-spacing:1px;white-space:nowrap;">ShangTaoPang 正在工作中<span style="display:inline;animation:ptDot 1.4s ease infinite;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.2s;">.</span><span style="display:inline;animation:ptDot 1.4s ease infinite;animation-delay:0.4s;">.</span></div><div style="margin:24px auto 0;height:4px;width:100%;min-width:360px;max-width:90vw;background:rgba(255,255,255,0.1);border-radius:4px;"><div style="height:4px;border-radius:4px;background:#04BF00;width:0;animation:ptSlide 1.8s ease forwards;min-width:0;"></div></div></div>';
    if (!document.getElementById('pt-keyframes')) {
      var ks = document.createElement('style');
      ks.id = 'pt-keyframes';
      ks.textContent = '@keyframes ptSlide{0%{width:0}100%{width:100%}}@keyframes ptDash{0%{stroke-dashoffset:0}50%{stroke-dashoffset:-17}100%{stroke-dashoffset:-34}}@keyframes ptFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes ptDot{0%,100%{opacity:0.2}50%{opacity:1}}';
      document.head.appendChild(ks);
    }
    if (ov.parentNode !== document.body) document.body.appendChild(ov);
    setTimeout(function(){ window.location.href = h; }, 800);
  });
})();
</script>

  <script>
    // Canvas animated background
    // bg-canvas removed

    // ===== Render news from admin data =====
    function renderNews() {
      var data = null;
      try { data = JSON.parse(localStorage.getItem('xie_admin_news')); } catch(e) {}
      if (!data || !data.length) {
        document.getElementById('news-container').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-tertiary);font-size:14px;">暂无消息，请关注后续更新</div>';
        return;
      }

      // Count categories
      var catCount = {};
      data.forEach(function(item) {
        catCount[item.category] = (catCount[item.category] || 0) + 1;
      });

      // Store global reference
      window._newsData = data;
      // Sort by date ascending
      data.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });

      // Build main list + aside
      var listHtml = '<div>';
      listHtml += '<div class="section-title" style="text-align:left;"><h2 style="font-size:22px;">最新消息</h2><div class="divider" style="margin:8px 0;"></div></div>';

      data.forEach(function(item) {
        var hasUrl = item.url && item.url.trim() !== '';
        var fullContent = item.content || '';
        var excerpt = fullContent.length > 120 ? fullContent.substring(0, 120) + '…' : fullContent;

        listHtml += '<div class="article-card fade-in" data-fullcontent="' + encodeURIComponent(fullContent) + '" data-title="' + escapeAttr(item.title) + '" data-author="' + escapeAttr(item.author || '') + '" data-date="' + (item.date || '') + '">';
        listHtml += '<span class="category">' + escapeHtml(item.category) + '</span>';
        listHtml += '<h3>' + escapeHtml(item.title) + '</h3>';
        listHtml += '<div class="meta">' + (item.date || '') + ' · 发布人：' + escapeHtml(item.author || '') + '</div>';
        listHtml += '<p>' + escapeHtml(excerpt) + '</p>';
        // 查看全文链接
        if (hasUrl) {
          listHtml += '<a href="' + escapeAttr(item.url) + '" target="_blank" rel="noopener" class="read-more-link">查看全文 →</a>';
        } else {
          listHtml += '<a href="#" class="read-more-link" onclick="showFullArticle(this);return false;">阅读全文 →</a>';
        }
        listHtml += '</div>';
      });

      listHtml += '<div style="text-align:center;margin-top:24px;">';
      listHtml += '<button class="btn" onclick="alert(' + "'" + '更多历史消息正在加载...' + "'" + ')">加载更多 →</button>';
      listHtml += '</div></div>';

      // Sidebar
      var asideHtml = '<div>';
      asideHtml += '<div class="glass-card" style="padding:20px;margin-bottom:20px;">';
      asideHtml += '<h4 style="font-family:var(--font-title);color:var(--text-primary);margin-bottom:12px;font-size:15px;font-weight:500;">📂 文章分类</h4>';
      asideHtml += '<div style="display:flex;flex-wrap:wrap;gap:8px;">';
      for (var cat in catCount) {
        asideHtml += '<span style="padding:4px 12px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:20px;font-size:12px;color:var(--text-tertiary);">' + escapeHtml(cat) + ' (' + catCount[cat] + ')</span>';
      }
      asideHtml += '</div></div>';

      asideHtml += '<div class="glass-card" style="padding:20px;margin-bottom:20px;">';
      asideHtml += '<h4 style="font-family:var(--font-title);color:var(--text-primary);margin-bottom:12px;font-size:15px;font-weight:500;">📝 投稿专栏</h4>';
      asideHtml += '<p style="font-size:13px;color:var(--text-tertiary);margin-bottom:12px;">欢迎家族成员投稿分享文章、诗词、摄影作品等。</p>';
      asideHtml += '<a href="contact.html" class="btn btn-accent" style="font-size:12px;padding:8px 20px;">我要投稿 →</a>';
      asideHtml += '</div></div>';

      document.getElementById('news-container').innerHTML = listHtml + asideHtml;
    }

    function escapeHtml(text) {
      if (!text) return '';
      var d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function escapeAttr(text) {
      if (!text) return '';
      return text.replace(/'/g, "\'").replace(/"/g, '&quot;');
    }

    // ===== 阅读全文弹窗 =====
    function showFullArticle(link) {
      var card = link.closest('.article-card');
      var content = card ? decodeURIComponent(card.getAttribute('data-fullcontent') || '') : '';
      var title = card ? card.getAttribute('data-title') : '';
      var author = card ? card.getAttribute('data-author') : '';
      var date = card ? card.getAttribute('data-date') : '';
      var overlay = document.createElement('div');
      overlay.className = 'article-modal-overlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';

      var box = document.createElement('div');
      box.style.cssText = 'background:var(--bg-primary);border:1px solid var(--glass-border);border-radius:12px;max-width:720px;width:100%;max-height:80vh;overflow-y:auto;padding:36px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.3);';

      box.innerHTML = '<button onclick="this.parentElement.parentElement.remove()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-tertiary);">✕</button>'
        + '<h2 style="font-family:var(--font-title);color:var(--text-primary);font-size:20px;font-weight:600;margin-bottom:12px;padding-right:30px;">' + escapeHtml(title) + '</h2>'
        + '<div style="font-size:13px;color:var(--text-tertiary);margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--divider);">'
        + (date ? '<span>' + date + '</span>' : '')
        + (author ? ' · 发布人：' + escapeHtml(author) : '')
        + '</div>'
        + '<div style="font-size:14px;color:var(--text-secondary);line-height:2;">' + escapeHtml(content).replace(/\n/g, '<br>') + '</div>';

      overlay.appendChild(box);
      overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
      document.body.appendChild(overlay);
    }

    renderNews();
    // Fetch from server for up-to-date data
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/data/news", true);
    xhr.timeout = 20000;
    xhr.onload = function() {
      if (xhr.status === 200) {
        try {
          var serverData = JSON.parse(xhr.responseText);
          if (serverData && Array.isArray(serverData) && serverData.length > 0) {
            localStorage.setItem("xie_admin_news", JSON.stringify(serverData));
            renderNews();
          }
        } catch(e) {}
      }
    };
    xhr.send();
  </script>
