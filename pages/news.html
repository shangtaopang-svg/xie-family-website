  // If overlay HTML exists on page (from index.html), ensure it's hidden

    if (h === cur || h === './'+cur) return;
    e.preventDefault();
    e.stopPropagation();
    sessionStorage.setItem(ptKey, '1');
    sessionStorage.setItem('back_to', window.location.href);
    // Show overlay with all inline styles
    var ov = document.getElementById('page-transition') || document.createElement('div');
    ov.id = 'page-transition';
    ov.style.cssText = 'position:fixed;inset:0;z-index:999999;background:rgb(7,16,31);display:flex;flex-direction:column;align-items:center;justify-content:center;';

    if (!document.getElementById('pt-keyframes')) {

      ks.textContent = '@keyframes ptSlide{0%{width:0}100%{width:100%}}@keyframes ptDash{0%{stroke-dashoffset:0}50%{stroke-dashoffset:-17}100%{stroke-dashoffset:-34}}@keyframes ptFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes ptDot{0%,100%{opacity:0.2}50%{opacity:1}}';
      document.head.appendChild(ks);

    setTimeout(function(){ window.location.href = h; }, 800);

})();

  <script>
    // Canvas animated background
    // bg-canvas removed

    // ===== Render news from admin data =====
    function renderNews() {
      var data = null;
      try { data = JSON.parse(localStorage.getItem('xie_admin_news')); } catch(e) {}
      if (!data || !data.length) {
        document.getElementById('news-container').innerHTML = '<div style="text-align:center;padding:60px 20px;color:var(--text-tertiary);font-size:14px;">暂无消息，请关注后续更新</div>';
        return;
      }

      // Count categories
      var catCount = {};
      data.forEach(function(item) {
        var category = item.category || '家族消息';
        catCount[category] = (catCount[category] || 0) + 1;
      });

      // Store a date-descending copy so the newest message is always first.
      data = data.slice().sort(function(a, b) { return (b.date || '').localeCompare(a.date || ''); });
      window._newsData = data;

      var categories = Object.keys(catCount);
      var listHtml = '<section class="news-feed" aria-label="最新消息">';
      listHtml += '<div class="news-feed-head">';
      listHtml += '<div><span class="news-eyebrow">NEWS BOARD</span><h2>最新消息</h2><p>先看摘要，需要时再展开全文。</p></div>';
      listHtml += '<div class="news-total"><b>' + data.length + '</b><span>条消息</span></div>';
      listHtml += '</div>';
      listHtml += '<div class="news-filter" role="tablist" aria-label="消息分类">';
      listHtml += '<button type="button" class="news-filter-btn active" data-category-key="all" role="tab" aria-selected="true">全部 <span>' + data.length + '</span></button>';
      categories.forEach(function(cat) {
        var key = encodeURIComponent(cat);
        listHtml += '<button type="button" class="news-filter-btn" data-category-key="' + key + '" role="tab" aria-selected="false">' + escapeHtml(cat) + ' <span>' + catCount[cat] + '</span></button>';
      });
      listHtml += '</div>';
      listHtml += '<div class="news-list">';

      data.forEach(function(item, index) {
        var displayItem = window.getLocalizedRecord ? window.getLocalizedRecord(item, 'news') : item;
        var fullContent = displayItem.content || '';
        var category = displayItem.category || '家族消息';
        var categoryKey = encodeURIComponent(category);
        var compactContent = fullContent.replace(/\s+/g, ' ').trim();
        var excerpt = compactContent.length > 96 ? compactContent.substring(0, 96) + '…' : compactContent;
        var dateParts = splitNewsDate(item.date || '');
        var author = displayItem.author || '家族理事会';

        listHtml += '<article class="news-item fade-in" data-category-key="' + categoryKey + '">';
        listHtml += '<div class="news-date-badge"><span>' + escapeHtml(dateParts.month) + '</span><b>' + escapeHtml(dateParts.day) + '</b><small>' + escapeHtml(dateParts.year) + '</small></div>';
        listHtml += '<div class="news-item-main">';
        listHtml += '<div class="news-item-top"><span class="news-category">' + escapeHtml(category) + '</span><time datetime="' + escapeAttr(item.date || '') + '">' + escapeHtml(item.date || '待定') + '</time></div>';
        listHtml += '<h3>' + escapeHtml(displayItem.title || '未命名消息') + '</h3>';
        listHtml += '<p class="news-excerpt">' + escapeHtml(excerpt || '这条消息暂未添加摘要。') + '</p>';
        listHtml += '<div class="news-item-foot"><span class="news-author">' + (window.getLang && getLang() === 'en' ? 'Published by: ' : '发布人：') + escapeHtml(author) + '</span><button type="button" class="news-read-btn" data-news-index="' + index + '">' + (window.getLang && getLang() === 'en' ? 'Read full story' : '阅读全文') + ' <span>→</span></button></div>';
        listHtml += '</div></article>';
      });

      listHtml += '<div class="news-filter-empty" hidden>这个分类暂时没有消息。</div>';
      listHtml += '</div></section>';

      var asideHtml = '<aside class="news-aside" aria-label="消息说明">';
      asideHtml += '<div class="news-aside-card news-archive-card"><span class="news-eyebrow">ARCHIVE</span><strong>' + data.length + '</strong><h3>家族消息</h3><p>村务通知、家族公告与重要动态，集中留存于此。</p></div>';
      asideHtml += '<div class="news-aside-card news-contribute-card"><span class="news-aside-icon">✦</span><h3>分享家族故事</h3><p>欢迎投稿文章、诗词、影像和村景记录。</p><a href="contact.html">联系投稿 <span>→</span></a></div>';
      asideHtml += '</aside>';

      document.getElementById('news-container').innerHTML = listHtml + asideHtml;
      document.querySelectorAll('.news-filter-btn').forEach(function(button) {
        button.addEventListener('click', function() { filterNews(button.getAttribute('data-category-key'), button); });
      });
      document.querySelectorAll('.news-read-btn').forEach(function(button) {
        button.addEventListener('click', function() { showFullArticle(Number(button.getAttribute('data-news-index'))); });
      });
    }

    function splitNewsDate(date) {
      var parts = (date || '').split('-');
      if (parts.length === 3) return { year: parts[0], month: parts[1], day: parts[2] };
      return { year: '', month: '—', day: '—' };
    }

    function filterNews(categoryKey, button) {
      var items = document.querySelectorAll('.news-item');
      var buttons = document.querySelectorAll('.news-filter-btn');
      var visible = 0;
      buttons.forEach(function(btn) {
        var active = btn === button;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      items.forEach(function(item) {
        var show = categoryKey === 'all' || item.getAttribute('data-category-key') === categoryKey;
        item.hidden = !show;
        if (show) visible++;
      });
      var empty = document.querySelector('.news-filter-empty');
      if (empty) empty.hidden = visible !== 0;
    }

    function escapeHtml(text) {
      if (!text) return '';
      var d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function escapeAttr(text) {
      if (!text) return '';
      return String(text).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function newsSourceHref(url, id) {
      var href = 'news-source.html?from=news&v=20260901-news-source-04&url=' + encodeURIComponent(url);
      return id == null ? href : href + '&id=' + encodeURIComponent(id);
    }

    function rememberNewsSourceReturn(item) {
      try {
        sessionStorage.setItem('news_source_return', window.location.href);
        if (item) {
          sessionStorage.setItem('news_source_preview', JSON.stringify({
            id: item.id,
            title: item.title || '',
            date: item.date || '',
            source: item.source || '',
            author: item.author || '',
            content: item.content || '',
            url: item.url || ''
          }));
        }
      } catch (e) {}
    }

    // ===== 阅读全文弹窗 =====
    function showFullArticle(index) {
      var item = window._newsData && window._newsData[index];
      if (!item) return;
      var displayItem = window.getLocalizedRecord ? window.getLocalizedRecord(item, 'news') : item;
      var isEnglish = window.getLang && getLang() === 'en';
      var content = displayItem.content || (isEnglish ? 'No full text has been added for this news item.' : '这条消息暂未添加正文。');
      var title = displayItem.title || (isEnglish ? 'Untitled news item' : '未命名消息');
      var author = displayItem.author || (isEnglish ? 'Family Council' : '家族理事会');
      var date = item.date || '';
      var overlay = document.createElement('div');
      overlay.className = 'article-modal-overlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-label', title);

      var box = document.createElement('div');
      box.className = 'article-modal-box';
      box.innerHTML = '<button type="button" class="article-modal-close" aria-label="关闭全文">×</button><span class="article-modal-label">消息全文</span><h2></h2><div class="article-modal-meta"></div><div class="article-modal-content"></div><div class="article-modal-actions"></div>';
      box.querySelector('h2').textContent = title;
      box.querySelector('.article-modal-meta').textContent = (date ? date : (isEnglish ? 'Date to be announced' : '日期待定')) + (isEnglish ? ' · Published by: ' : ' · 发布人：') + author;
      box.querySelector('.article-modal-content').textContent = content;
      if (item.url && item.url.trim()) {
        var sourceLink = document.createElement('a');
        sourceLink.className = 'article-modal-source';
        sourceLink.href = newsSourceHref(item.url, item.id);
        sourceLink.addEventListener('click', function() { rememberNewsSourceReturn(item); });
        sourceLink.textContent = isEnglish ? 'View original source →' : '查看来源原文 →';
        box.querySelector('.article-modal-actions').appendChild(sourceLink);
      }

      overlay.appendChild(box);
      var close = function() {
        overlay.remove();
        document.body.classList.remove('news-modal-open');
        document.removeEventListener('keydown', onKeydown);
      };
      var onKeydown = function(e) { if (e.key === 'Escape') close(); };
      box.querySelector('.article-modal-close').addEventListener('click', close);
      overlay.onclick = function(e) { if (e.target === overlay) close(); };
      document.addEventListener('keydown', onKeydown);
      document.body.classList.add('news-modal-open');
      document.body.appendChild(overlay);
      box.querySelector('.article-modal-close').focus();
    }

    renderNews();
    window.addEventListener('xie-language-change', renderNews);
    // Fetch from server for up-to-date data
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/data/news", true);
    xhr.timeout = 20000;
    xhr.onload = function() {
      if (xhr.status === 200) {
        try {
          var serverData = JSON.parse(xhr.responseText);
          if (serverData && Array.isArray(serverData) && serverData.length > 0) {
            localStorage.setItem("xie_admin_news", JSON.stringify(serverData));
            renderNews();
          }
        } catch(e) {}
      }
    };
    xhr.send();
  </script>
