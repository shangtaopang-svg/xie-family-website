  <script>
    // Canvas animated background
    const canvas = document.getElementById('bg-canvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let w, h;
      function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
      resize(); window.addEventListener('resize', resize);
      const dots = [];
      for (let i = 0; i < 80; i++) dots.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3, r: Math.random() * 2 + 1, a: Math.random() * 0.3 + 0.1 });
      const orbs = [
        { x: 0.2, y: 0.3, r: 0.35, color: 'rgba(251,146,60,0.06)' },
        { x: 0.8, y: 0.7, r: 0.3, color: 'rgba(34,211,238,0.05)' },
        { x: 0.5, y: 0.1, r: 0.25, color: 'rgba(251,146,60,0.04)' }
      ];
      function draw() {
        ctx.clearRect(0, 0, w, h);
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const dotRgb = isDark ? '255,255,255' : '100,100,100';
        orbs.forEach(o => {
          const grad = ctx.createRadialGradient(o.x * w, o.y * h, 0, o.x * w, o.y * h, o.r * w);
          grad.addColorStop(0, o.color); grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
        });
        dots.forEach(d => {
          d.x += d.vx; d.y += d.vy;
          if (d.x < 0) d.x = w; if (d.x > w) d.x = 0;
          if (d.y < 0) d.y = h; if (d.y > h) d.y = 0;
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${dotRgb},${d.a})`; ctx.fill();
        });
        for (let i = 0; i < dots.length; i++) {
          for (let j = i + 1; j < dots.length; j++) {
            const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
              ctx.beginPath(); ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y);
              ctx.strokeStyle = `rgba(${dotRgb},${(1 - dist / 150) * 0.08})`;
              ctx.lineWidth = 0.5; ctx.stroke();
            }
          }
        }
        requestAnimationFrame(draw);
      }
      draw();
    }

    // ===== Render news from admin data =====
    function renderNews() {
      var data = JSON.parse(localStorage.getItem('xie_admin_news'));
      if (!data) {
        data = [
          { id: 1, title: '下枫槎村谢氏宗祠修缮工程启动', category: '家族事务', date: '2026-05-15', author: '家族理事会', url: '', content: '下枫槎谢氏宗祠始建于清乾隆年间，历经两百余年风雨，部分建筑出现老化。经家族理事会研究决定，正式启动宗祠修缮工程。本次修缮将严格遵循"修旧如旧"原则，尽可能保留原有建筑构件和工艺，恢复宗祠的历史风貌。工程预计工期六个月，总投资约80万元，由家族成员共同筹资。欢迎各位宗亲积极建言献策，共同守护我们的精神家园。' },
          { id: 2, title: '2026年清明祭祖大典圆满举行', category: '家族活动', date: '2026-05-01', author: '家族理事会', url: '', content: '今年清明，下枫槎谢氏在宗祠举行了隆重的祭祖大典。百余位宗亲从各地赶来参加，其中包括多位首次参与祭祖的年轻一代。本次祭祖新增了"青年主祭"环节，由家族年轻一辈代表担任主祭人，寓意家族文化薪火相传。祭祖仪式后，全体宗亲在宗祠前合影留念，共进清明宴。现场气氛庄重而热烈，充分展现了谢氏家族的凝聚力。' },
          { id: 3, title: '《下枫槎谢氏宗谱》电子版编纂启动', category: '通知公告', date: '2026-04-20', author: '家族理事会', url: '', content: '为更好地保护和传承家族文化，家族理事会决定正式启动《下枫槎谢氏宗谱》数字化工程。本次编纂将对现有纸质老谱进行高清扫描、文字识别和校对整理，最终形成可检索的电子版族谱。电子版族谱将包含世系图、人物传记、家族大事记等内容，并通过本网站向家族成员提供查询服务。请各房派积极配合资料收集工作。' },
          { id: 4, title: '谢氏家族网站"数字宗祠"正式上线', category: '网站公告', date: '2026-03-10', author: '网站管理团队', url: '', content: '经过数月的筹备和建设，下枫槎谢氏家族网站——"数字宗祠"今日正式上线。本网站旨在通过互联网平台，系统整理和展示家族历史文化，搭建家族成员交流互动的桥梁，成为家族文化传承的数字化载体。网站目前开设了家族历史、名人事迹、消息发布、家族成员、家族活动、联系我们等板块。后续还将逐步完善族谱查询、在线祭祀、活动报名等功能。欢迎各位宗亲提出宝贵意见和建议。' },
          { id: 5, title: '丙午年新春贺词', category: '节日祝福', date: '2026-02-16', author: '家族理事会', url: '', content: '值此丙午马年新春佳节，下枫槎谢氏家族理事会向全体宗亲致以最诚挚的节日问候！愿大家在新的一年里，龙马精神，阖家安康，万事如意！过去一年，在全体宗亲的共同努力下，家族事务有序推进，宗祠维护、族谱编纂等工作取得了积极进展。新的一年，让我们继续携手同心，传承家族文化，共筑美好未来！' }
        ];
      }

      // Count categories
      var catCount = {};
      data.forEach(function(item) {
        catCount[item.category] = (catCount[item.category] || 0) + 1;
      });

      // Sort by date ascending
      data.sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });

      // Build main list + aside
      var listHtml = '<div>';
      listHtml += '<div class="section-title" style="text-align:left;"><h2 style="font-size:22px;">最新消息</h2><div class="divider" style="margin:8px 0;"></div></div>';

      data.forEach(function(item) {
        var hasUrl = item.url && item.url.trim() !== '';
        var fullContent = item.content || '';
        var excerpt = fullContent.length > 120 ? fullContent.substring(0, 120) + '…' : fullContent;

        listHtml += '<div class="article-card fade-in">';
        listHtml += '<span class="category">' + escapeHtml(item.category) + '</span>';
        listHtml += '<h3>' + escapeHtml(item.title) + '</h3>';
        listHtml += '<div class="meta">' + (item.date || '') + ' · 发布人：' + escapeHtml(item.author || '') + '</div>';
        listHtml += '<p>' + escapeHtml(excerpt) + '</p>';
        // 查看全文链接
        if (hasUrl) {
          listHtml += '<a href="' + escapeAttr(item.url) + '" target="_blank" class="read-more-link">查看全文 →</a>';
        } else {
          listHtml += '<a href="javascript:void(0)" class="read-more-link" onclick="showFullArticle(this, \'' + escapeAttr(item.title) + '\', \'' + escapeAttr(item.author || '') + '\', \'' + escapeAttr(item.date || '') + '\', \'' + escapeAttr(fullContent.replace(/'/g, "\\'").replace(/"/g, '&quot;')) + '\')">阅读全文 →</a>';
        }
        listHtml += '</div>';
      });

      listHtml += '<div style="text-align:center;margin-top:24px;">';
      listHtml += '<button class="btn" onclick="alert(\'更多历史消息正在加载...\')">加载更多 →</button>';
      listHtml += '</div></div>';

      // Sidebar
      var asideHtml = '<div>';
      asideHtml += '<div class="glass-card" style="padding:20px;margin-bottom:20px;">';
      asideHtml += '<h4 style="font-family:var(--font-title);color:var(--text-primary);margin-bottom:12px;font-size:15px;font-weight:500;">📂 文章分类</h4>';
      asideHtml += '<div style="display:flex;flex-wrap:wrap;gap:8px;">';
      for (var cat in catCount) {
        asideHtml += '<span style="padding:4px 12px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:20px;font-size:12px;color:var(--text-tertiary);">' + escapeHtml(cat) + ' (' + catCount[cat] + ')</span>';
      }
      asideHtml += '</div></div>';

      asideHtml += '<div class="glass-card" style="padding:20px;margin-bottom:20px;">';
      asideHtml += '<h4 style="font-family:var(--font-title);color:var(--text-primary);margin-bottom:12px;font-size:15px;font-weight:500;">📝 投稿专栏</h4>';
      asideHtml += '<p style="font-size:13px;color:var(--text-tertiary);margin-bottom:12px;">欢迎家族成员投稿分享文章、诗词、摄影作品等。</p>';
      asideHtml += '<a href="contact.html" class="btn btn-accent" style="font-size:12px;padding:8px 20px;">我要投稿 →</a>';
      asideHtml += '</div></div>';

      document.getElementById('news-container').innerHTML = listHtml + asideHtml;
    }

    function escapeHtml(text) {
      if (!text) return '';
      var d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function escapeAttr(text) {
      if (!text) return '';
      return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // ===== 阅读全文弹窗 =====
    function showFullArticle(link, title, author, date, content) {
      var overlay = document.createElement('div');
      overlay.className = 'article-modal-overlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';

      var box = document.createElement('div');
      box.style.cssText = 'background:var(--bg-primary);border:1px solid var(--glass-border);border-radius:12px;max-width:720px;width:100%;max-height:80vh;overflow-y:auto;padding:36px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.3);';

      box.innerHTML = '<button onclick="this.parentElement.parentElement.remove()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-tertiary);">✕</button>'
        + '<h2 style="font-family:var(--font-title);color:var(--text-primary);font-size:20px;font-weight:600;margin-bottom:12px;padding-right:30px;">' + escapeHtml(title) + '</h2>'
        + '<div style="font-size:13px;color:var(--text-tertiary);margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--divider);">'
        + (date ? '<span>' + date + '</span>' : '')
        + (author ? ' · 发布人：' + escapeHtml(author) : '')
        + '</div>'
        + '<div style="font-size:14px;color:var(--text-secondary);line-height:2;">' + escapeHtml(content).replace(/\n/g, '<br>') + '</div>';

      overlay.appendChild(box);
      overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
      document.body.appendChild(overlay);
    }

    renderNews();
    // Fetch from server for up-to-date data
    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/api/data/news", true);
    xhr.timeout = 20000;
    xhr.onload = function() {
      if (xhr.status === 200) {
        try {
          var serverData = JSON.parse(xhr.responseText);
          if (serverData && Array.isArray(serverData) && serverData.length > 0) {
            localStorage.setItem("xie_admin_news", JSON.stringify(serverData));
            renderNews();
          }
        } catch(e) {}
      }
    };
    xhr.send();
  </script>
