<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f8" id="source-theme-color">
  <title>原文查看 · 下枫槎谢氏</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <script defer src="../js/i18n.js?v=20260901-lang-07"></script>
  <script>
    try {
      if ((localStorage.getItem('xie_theme') || localStorage.getItem('theme')) === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="../css/style.css?v=20260901-entry-switch-05">
  <style>
    html, body { min-height: 100%; }
    body.news-source-page {
      min-height: 100vh;
      margin: 0;
      padding: 0 !important;
      overflow: hidden;
      background: var(--bg-primary, #f6f7f8);
      color: var(--text-primary, #23313a);
    }
    .news-source-shell { display: flex; flex-direction: column; height: 100vh; }
    .news-source-toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 68px;
      padding: 12px 24px;
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--glass-border, rgba(35,49,58,.14));
      background: var(--bg-card, #fff);
      box-shadow: 0 3px 14px rgba(35,49,58,.08);
    }
    .news-source-back {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid #b88754;
      border-radius: 999px;
      background: #fffaf4 !important;
      color: #5c351d !important;
      font: 700 14px/1.2 var(--font-body, sans-serif);
      cursor: pointer;
      opacity: 1 !important;
      white-space: nowrap;
    }
    .news-source-back:hover { background: #fff2e3; }
    .news-source-title { min-width: 0; flex: 1; }
    .news-source-title strong { display: block; color: #7d481d; font-size: 16px; line-height: 1.3; }
    .news-source-title span { display: block; margin-top: 3px; color: #687780; font-size: 12px; }
    .news-source-open {
      flex: 0 0 auto;
      color: #85501f;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .news-source-main { position: relative; display: flex; flex: 1 1 auto; min-height: 0; flex-direction: column; }
    .news-source-notice {
      flex: 0 0 auto;
      padding: 9px 24px;
      border-bottom: 1px solid rgba(35,49,58,.1);
      background: #f9fbfc;
      color: #687780;
      font-size: 12px;
      line-height: 1.5;
    }
    .news-source-preview {
      flex: 0 0 auto;
      margin: 18px 24px 16px;
      padding: 20px 22px 22px;
      border: 1px solid rgba(184,135,84,.32);
      border-radius: 14px;
      background: var(--bg-card, #fff);
      box-shadow: 0 8px 24px rgba(35,49,58,.06);
    }
    .news-source-preview-kicker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #85501f;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .news-source-preview-badge {
      color: #687780;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0;
      text-transform: none;
    }
    .news-source-preview h1 {
      margin: 12px 0 8px;
      color: var(--text-primary, #23313a);
      font: 700 clamp(20px, 3vw, 30px)/1.35 var(--font-title, sans-serif);
    }
    .news-source-preview-meta {
      margin-bottom: 16px;
      color: var(--text-tertiary, #687780);
      font-size: 13px;
      line-height: 1.6;
    }
    .news-source-preview-content {
      color: var(--text-secondary, #45545d);
      font-size: 15px;
      line-height: 2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .news-source-preview-note {
      margin-top: 18px;
      padding-top: 12px;
      border-top: 1px solid var(--divider, rgba(35,49,58,.1));
      color: var(--text-tertiary, #687780);
      font-size: 12px;
      line-height: 1.6;
    }
    .news-source-frame-section {
      flex: 0 0 auto;
      padding: 0 24px 24px;
    }
    .news-source-frame-label {
      margin: 0 0 8px;
      color: var(--text-secondary, #45545d);
      font-size: 13px;
      font-weight: 700;
    }
    .news-source-frame { display: block; width: 100%; height: min(58vh, 680px); min-height: 320px; border: 1px solid var(--glass-border, rgba(35,49,58,.14)); border-radius: 12px; background: #fff; }
    .news-source-empty { padding: 24px; color: #687780; font-size: 14px; text-align: center; }
    [data-theme="dark"] body.news-source-page { background: #000; color: #f2f0ea; }
    [data-theme="dark"] .news-source-toolbar { border-bottom-color: #2b2b2b; background: #101010; box-shadow: none; }
    [data-theme="dark"] .news-source-back { border-color: #8d6b36; background: #191919 !important; color: #e8c97a !important; }
    [data-theme="dark"] .news-source-title strong { color: #e8c97a; }
    [data-theme="dark"] .news-source-title span,
    [data-theme="dark"] .news-source-notice,
    [data-theme="dark"] .news-source-empty { color: #a5aaa0; }
    [data-theme="dark"] .news-source-open { color: #e8c97a; }
    [data-theme="dark"] .news-source-notice { border-bottom-color: #2b2b2b; background: #0b0b0b; }
    [data-theme="dark"] .news-source-preview { border-color: #5f4929; background: #111; box-shadow: none; }
    [data-theme="dark"] .news-source-preview-kicker { color: #e8c97a; }
    [data-theme="dark"] .news-source-preview-content { color: #d8d8d2; }
    [data-theme="dark"] .news-source-frame-label { color: #c6cbc4; }
    @media (max-width: 768px) {
      .news-source-toolbar { gap: 9px; min-height: 60px; padding: 9px 12px; }
      .news-source-back { min-height: 36px; padding: 0 12px; font-size: 13px; }
      .news-source-title strong { font-size: 14px; }
      .news-source-title span { font-size: 11px; }
      .news-source-open { font-size: 12px; }
      .news-source-notice { padding: 7px 12px; font-size: 11px; }
      .news-source-preview { margin: 12px 12px 12px; padding: 16px 15px 18px; border-radius: 12px; }
      .news-source-preview h1 { margin-top: 9px; font-size: 20px; }
      .news-source-preview-content { font-size: 14px; line-height: 1.85; }
      .news-source-frame-section { padding: 0 12px 18px; }
      .news-source-frame { height: 52vh; min-height: 260px; border-radius: 10px; }
    }
  </style>
</head>
<body class="news-source-page">
  <div class="news-source-shell">
    <header class="news-source-toolbar">
      <button class="news-source-back" id="news-source-back" type="button">← 返回新闻报道</button>
      <div class="news-source-title">
        <strong>新闻原文</strong>
        <span id="news-source-host">正在加载…</span>
      </div>
      <a class="news-source-open" id="news-source-open" href="#" target="_blank" rel="noopener noreferrer">打开原网站 ↗</a>
    </header>
    <main class="news-source-main">
      <div class="news-source-notice">原文由来源网站提供；如页面未显示，请点击右上角“打开原网站”。</div>
      <section class="news-source-preview" id="news-source-preview" hidden>
        <div class="news-source-preview-kicker"><span>本站保存的报道内容</span><span class="news-source-preview-badge">后台新闻数据</span></div>
        <h1 id="news-source-preview-title"></h1>
        <div class="news-source-preview-meta" id="news-source-preview-meta"></div>
        <div class="news-source-preview-content" id="news-source-preview-content"></div>
        <div class="news-source-preview-note">以下内容来自本站后台保存的报道资料；右侧“打开原网站”可查看来源页面。</div>
      </section>
      <section class="news-source-frame-section">
        <div class="news-source-frame-label">原文页面</div>
        <iframe class="news-source-frame" id="news-source-frame" title="新闻原文" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </section>
      <div class="news-source-empty" id="news-source-empty" hidden>没有找到有效的原文链接。</div>
    </main>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sourceUrl = params.get('url') || '';
      var from = params.get('from') === 'news' ? 'news.html' : 'reports.html';
      var sourceId = params.get('id') || '';
      var backBtn = document.getElementById('news-source-back');
      var frame = document.getElementById('news-source-frame');
      var openLink = document.getElementById('news-source-open');
      var host = document.getElementById('news-source-host');
      var empty = document.getElementById('news-source-empty');
      var preview = document.getElementById('news-source-preview');
      var previewTitle = document.getElementById('news-source-preview-title');
      var previewMeta = document.getElementById('news-source-preview-meta');
      var previewContent = document.getElementById('news-source-preview-content');
      var frameSection = document.querySelector('.news-source-frame-section');
      var currentPreviewItem = null;

      function isHttpUrl(value) {
        try {
          var parsed = new URL(value);
          return parsed.protocol === 'http:' || parsed.protocol === 'https:';
        } catch (e) { return false; }
      }

      function isEnglish() {
        return !!(window.getLang && window.getLang() === 'en');
      }

      function getReturnUrl() {
        var saved = '';
        try { saved = sessionStorage.getItem('news_source_return') || ''; } catch (e) {}
        if (saved) {
          try {
            var parsed = new URL(saved, window.location.href);
            if (parsed.origin === window.location.origin) return parsed.href;
          } catch (e) {}
        }
        return new URL(from, window.location.href).href;
      }

      backBtn.addEventListener('click', function () {
        var target = getReturnUrl();
        try { sessionStorage.removeItem('news_source_return'); } catch (e) {}
        window.location.replace(target);
      });

      function showExternalOpenFallback() {
        if (document.getElementById('news-source-open-fallback')) return;
        var english = isEnglish();
        var overlay = document.createElement('div');
        overlay.id = 'news-source-open-fallback';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(18,25,29,.46);';
        var box = document.createElement('div');
        box.style.cssText = 'width:min(460px,100%);padding:22px;border:1px solid var(--glass-border);border-radius:16px;background:var(--bg-card);box-shadow:0 18px 50px rgba(0,0,0,.24);color:var(--text-primary);';
        var title = english ? 'The original website could not be opened in a new tab' : '原网站暂时无法新开标签页';
        var detail = english ? 'The saved report remains on this page. Copy the source address if you still need to open it in your browser.' : '本站已保存的报道内容仍在本页。若仍需查看原网站，可以复制下方地址后在浏览器中打开。';
        box.innerHTML = '<strong style="display:block;font-size:17px;margin-bottom:10px;">' + title + '</strong>' +
          '<div style="font-size:13px;line-height:1.7;color:var(--text-secondary);margin-bottom:14px;">' + detail + '</div>' +
          '<div style="padding:10px 12px;border-radius:10px;background:var(--bg-secondary);font-size:12px;line-height:1.5;word-break:break-all;user-select:text;">' + sourceUrl.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</div>' +
          '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">' +
          '<button type="button" data-action="close" style="min-height:36px;padding:0 14px;border:1px solid var(--glass-border);border-radius:999px;background:transparent;color:var(--text-primary);cursor:pointer;">' + (english ? 'Close' : '关闭') + '</button>' +
          '<button type="button" data-action="copy" style="min-height:36px;padding:0 14px;border:0;border-radius:999px;background:var(--accent-orange);color:#fff;cursor:pointer;">' + (english ? 'Copy address' : '复制地址') + '</button>' +
          '</div>';
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        function close() { overlay.remove(); }
        box.querySelector('[data-action="close"]').addEventListener('click', close);
        overlay.addEventListener('click', function (event) { if (event.target === overlay) close(); });
        box.querySelector('[data-action="copy"]').addEventListener('click', function () {
          var button = this;
          var done = function () { button.textContent = english ? 'Copied' : '已复制'; setTimeout(function () { if (button.isConnected) button.textContent = english ? 'Copy address' : '复制地址'; }, 1800); };
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(sourceUrl).then(done).catch(function () { done(); });
          else { var input = document.createElement('textarea'); input.value = sourceUrl; document.body.appendChild(input); input.select(); try { document.execCommand('copy'); } catch (e) {} input.remove(); done(); }
        });
      }

      // 不把本站页面替换成外部站点：移动端内置浏览器有时会忽略 target="_blank"，
      // 所以必须拦截默认跳转，主动新开窗口；失败时只显示复制地址提示，避免用户丢失返回入口。
      openLink.addEventListener('click', function (event) {
        event.preventDefault();
        try { sessionStorage.setItem('news_source_return', getReturnUrl()); } catch (e) {}
        var opened = null;
        try { opened = window.open(sourceUrl, '_blank', 'noopener,noreferrer'); } catch (e) {}
        if (!opened) showExternalOpenFallback();
      });

      function normalisePreview(item) {
        if (!item || typeof item !== 'object') return null;
        return {
          id: item.id,
          title: item.title || '',
          date: item.date || '',
          source: item.source || '',
          author: item.author || '',
          content: item.content || '',
          url: item.url || ''
        };
      }

      function isMatchingPreview(item) {
        if (!item) return false;
        if (sourceId && item.id != null && String(item.id) === sourceId) return true;
        return !!sourceUrl && item.url === sourceUrl;
      }

      function renderPreview(item) {
        item = normalisePreview(item);
        if (!item || (!item.title && !item.content)) return false;
        currentPreviewItem = item;
        var displayItem = window.getLocalizedRecord ? window.getLocalizedRecord(item, from === 'news.html' ? 'news' : 'reports') : item;
        var isEnglish = window.getLang && getLang() === 'en';
        previewTitle.textContent = displayItem.title || (isEnglish ? 'News report' : '新闻报道');
        var meta = [item.date, displayItem.source, displayItem.author ? (isEnglish ? 'Published by: ' : '发布人：') + displayItem.author : ''].filter(Boolean);
        previewMeta.textContent = meta.join(' · ');
        previewContent.textContent = displayItem.content || (isEnglish ? 'The full report text has not been saved yet.' : '这篇报道暂未保存正文。');
        preview.hidden = false;
        // 许多来源站点禁止 iframe 嵌入；有后台保存的正文时优先展示本站副本，
        // 右上角仍可单独新开原网站，不让页面落成一整块空白。
        if (frameSection) frameSection.hidden = true;
        return true;
      }

      function loadPreview() {
        var cached = null;
        try { cached = normalisePreview(JSON.parse(sessionStorage.getItem('news_source_preview') || 'null')); } catch (e) {}
        if (isMatchingPreview(cached) && renderPreview(cached)) return;
        if (!sourceId) return;
        var endpoint = from === 'news.html' ? '/api/data/news' : '/api/data/reports';
        fetch(endpoint, { cache: 'no-store' }).then(function (response) {
          if (!response.ok) throw new Error('preview request failed');
          return response.json();
        }).then(function (items) {
          if (!Array.isArray(items)) return;
          var item = items.find(function (candidate) { return candidate && String(candidate.id) === sourceId; });
          renderPreview(item);
        }).catch(function () {});
      }

      if (!isHttpUrl(sourceUrl)) {
        frame.hidden = true;
        openLink.hidden = true;
        if (frameSection) frameSection.hidden = true;
        empty.hidden = false;
        host.textContent = '链接无效';
        return;
      }

      var parsedSource = new URL(sourceUrl);
      host.textContent = parsedSource.hostname;
      frame.src = sourceUrl;
      openLink.href = sourceUrl;
      loadPreview();
      window.addEventListener('xie-language-change', function () {
        if (currentPreviewItem) renderPreview(currentPreviewItem);
      });
      try {
        var themeColor = document.getElementById('source-theme-color');
        if (themeColor && document.documentElement.getAttribute('data-theme') === 'dark') themeColor.content = '#000000';
      } catch (e) {}
    }());
  </script>
</body>
</html>
