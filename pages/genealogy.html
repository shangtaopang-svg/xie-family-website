<script>
// Minimal tree rendering code
function getGenealogyData() {
  try {
    var s = localStorage.getItem('xie_admin_genealogy');
    if (s) return JSON.parse(s);
  } catch(e) {}
  return [];
}

function getChildren(pid, data) {
  var r = [];
  for (var i = 0; i < data.length; i++) {
    if (parseInt(data[i].father_id) === pid) r.push(data[i]);
  }
  return r;
}

function esc(t) {
  if (!t) return '';
  var d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

var _exp = {};

function buildNode(data, pid, depth, open) {
  var p = null;
  for (var i = 0; i < data.length; i++) { if (data[i].id === pid) { p = data[i]; break; } }
  if (!p) return '';
  var kids = getChildren(pid, data);
  var isOpen = _exp[pid] === true;
  var style = (depth > 0 && !open) ? ' style="display:none;"' : '';
  var h = '<div' + style + '>';
  h += '<div style="cursor:pointer;padding:4px 6px;border-radius:4px;display:flex;align-items:center;gap:4px;" onclick="showDetail(' + pid + ')" onmouseover="this.style.background="rgba(251,146,60,0.1)'" onmouseout="this.style.background=""">';
  if (kids.length > 0) {
    h += '<span style="font-size:10px;width:16px;text-align:center;" onclick="event.stopPropagation();toggle(' + pid + ')">' + (isOpen ? '▼' : '▶') + '</span>';
  } else {
    h += '<span style="font-size:10px;width:16px;"></span>';
  }
  h += '<span style="font-size:13px;font-weight:500;">' + esc(p.name) + '</span>';
  if (p.generation_num) h += '<span style="font-size:11px;color:#888;margin-left:8px;">第' + p.generation_num + '世</span>';
  if (kids.length > 0) h += '<span style="font-size:10px;color:#999;">' + kids.length + '子</span>';
  h += '</div>';
  if (kids.length > 0) {
    h += '<div style="overflow:hidden;transition:max-height 0.3s;max-height:' + (isOpen ? '20000px' : '0') + ';padding-left:20px;">';
    kids.sort(function(a,b) { return (a.generation_num||0) - (b.generation_num||0); });
    kids.forEach(function(k) { h += buildNode(data, k.id, depth+1, isOpen); });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function toggle(id) {
  if (_exp[id]) delete _exp[id]; else _exp[id] = true;
  switchView(_currentView);
}
var _currentView = 'all';

function switchView(view) {
  _currentView = view;
  var c = document.getElementById('tree-container');
  c.innerHTML = '加载中…';
  setTimeout(function() {
    var data = getGenealogyData();
    var rootIds = [];
    if (view === 'all') rootIds = [1];
    else if (view === 'houfengcha') {
      data.forEach(function(p) { if (p.name.indexOf('攒【后枫槎】')>=0) rootIds.push(p.id); });
    } else {
      data.forEach(function(p) { if (p.name.indexOf('撰【前枫槎】')>=0) rootIds.push(p.id); });
    }
    if (rootIds.length === 0) { c.innerHTML = '<div>无数据</div>'; return; }
    // Expand first level
    rootIds.forEach(function(id) { _exp[id] = true; });
    var html = '';
    rootIds.forEach(function(id) { html += buildNode(data, id, 0, true); });
    c.innerHTML = html;
  }, 10);
}

function showDetail(id) {
  var data = getGenealogyData();
  var p = null;
  for (var i = 0; i < data.length; i++) { if (data[i].id === id) { p = data[i]; break; } }
  if (!p) return;
  alert(p.name + '
第' + p.generation_num + '世
' + (p.branch||''));
}

switchView('all');
</script>
