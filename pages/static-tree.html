<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>谢氏世系</title>
<style>
body{background:#0f0f13;color:#e0e0e0;font-family:sans-serif;padding:30px;text-align:center;}
.t{display:flex;flex-direction:column;align-items:center;gap:4px;}
.r{display:flex;justify-content:center;gap:30px;align-items:flex-start;}
.c{display:flex;flex-direction:column;align-items:center;}
.card{padding:8px 20px;border-radius:8px;border:2px solid #444;background:rgba(255,255,255,0.04);text-align:center;min-width:80px;}
.card.orange{border-color:#fb923c;background:rgba(251,146,60,0.12);}
.card.green{border-color:#22c55e;background:rgba(34,197,94,0.08);}
.card.blue{border-color:#6366f1;background:rgba(99,102,241,0.08);}
.nm{font-size:16px;font-weight:700;color:#fff;}
.gen{font-size:10px;color:rgba(255,255,255,0.3);margin-top:2px;}
.l{width:2px;height:20px;background:rgba(255,255,255,0.08);margin:0 auto;}
h1{font-size:20px;margin-bottom:20px;color:#fb923c;}
</style>
</head>
<body>
<h1>📜 下枫槎谢氏世系</h1>
<div class="t">

<div class="r"><div class="c"><div class="card blue"><div class="nm">小四公</div><div class="gen">石马始祖</div></div></div></div>
<div class="l"></div>

<div class="r"><div class="c"><div class="card orange"><div class="nm">🍁 文杲公</div><div class="gen">第1世 · 枫槎始迁祖</div></div></div></div>
<div class="l"></div>

<div class="r">
<div class="c">
<div class="l"></div>
<div class="card green"><div class="nm">攒公</div><div class="gen">第2世 · 后枫槎</div></div>
<div class="l"></div>
<div class="r" style="gap:20px;">
<div class="c"><div class="card" style="border-color:#22c55e40;"><div class="nm">伯能</div><div class="gen">第3世</div></div></div>
<div class="c"><div class="card" style="border-color:#555;"><div class="nm">伯逊</div><div class="gen">第3世</div></div></div>
</div>
</div>

<div class="c">
<div class="l"></div>
<div class="card blue"><div class="nm">撰公</div><div class="gen">第2世 · 前枫槎</div></div>
</div>
</div>

</div>
<p style="margin-top:40px;color:rgba(255,255,255,0.2);font-size:13px;">⬆ 这是静态HTML树，不需要JavaScript</p>
</body>
</html>
