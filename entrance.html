<script>
var v=document.getElementById('village'),w=document.getElementById('world'),pt=document.getElementById('ref-portal');
var sl=document.getElementById('spl'),sr=document.getElementById('spr');
var ct=document.getElementById('ct'),cd=document.getElementById('cd');
var vn=document.getElementById('vn'),ent=document.getElementById('ent');

  // ── 开启页竖排打字机 ──
  var etEl = document.getElementById('et-text'), etWrap = document.getElementById('et-wrap'), etTimer = null, etIdx = 0;
  var etText = '下枫槎谢氏，源远流长。自申伯传三十六世至东山会稽，再由会稽南下经临海下渡，至石马小四公，乃入浙东之近祖。二世文杲公，北宋宣和间任越溪司巡检，始居岩下，为枫槎谢氏始迁祖，至今九百载。二世祖攒公、撰公，析居后枫槎与前枫槎。初居岩下，明隆庆壬申（1572年），山洪暴发，十六世祖彬公、乾公迁于双枫古槎之下，因名"下枫槎"，开基立业。清乾隆间，建宗祠于村北，三进两厢，堂号"敦睦堂"。春秋二祭，尊祖敬宗，礼行肃穆。';
  function etStart() { etIdx = 0; etEl.textContent = ''; etWrap.classList.add('show'); setTimeout(etType, 500); }
  function etType() { if (etIdx >= etText.length) return; etEl.textContent = etText.substring(0, etIdx + 1); if (window.innerWidth < 768) { etEl.scrollTop = etEl.scrollHeight; } else { etEl.scrollLeft = -etEl.scrollWidth; } etIdx++; var d = '。，、；：？！""'.indexOf(etText[etIdx-1]) >= 0 ? 100 : 25; etTimer = setTimeout(etType, d); }
  function etStop() { if (etTimer) { clearTimeout(etTimer); etTimer = null; } etWrap.classList.remove('show'); etEl.textContent = ''; }

  // ── 全屏图片查看器 ──
  (function(){
    var pvOv = document.getElementById('pv-overlay'), pvImg = document.getElementById('pv-img'), pvClose = document.getElementById('pv-close'), pvHint = document.getElementById('pv-hint'), pvCt = document.getElementById('pv-counter');
    var scale = 1, minScale = 1, maxScale = 5, tx = 0, ty = 0, isDragging = false, startX, startY, startTx, startTy, lastDist = 0;
    var PHOTOS = ['images/panorama.png','images/bg-left.png','images/bg-left.jpg','images/bg-right.png','images/22.jpg','images/bg-entrance.jpg','images/portal-gate.png'], pIdx = 0;
    function pvReset() { scale = 1; tx = 0; ty = 0; pvImg.style.transform = 'translate(0,0) scale(1)'; }
    function pvShow(idx) { pIdx = idx || 0; pvImg.src = PHOTOS[pIdx]; pvReset(); pvOv.classList.add('show'); pvClose.classList.add('show'); setTimeout(function(){pvHint.classList.add('show');},600); pvCt.textContent = (pIdx+1)+'/'+PHOTOS.length; pvCt.classList.add('show'); }
    function pvHide() { pvOv.classList.remove('show'); pvClose.classList.remove('show'); pvHint.classList.remove('show'); pvCt.classList.remove('show'); }
    pvClose.onclick = pvHide;
    pvOv.onclick = function(e) { if(e.target===pvOv) pvHide(); };
    document.getElementById('pv-trigger').addEventListener('click', function(){ if(isOpen) pvShow(0); });
    pvImg.addEventListener('mousedown', function(e){ isDragging=true; startX=e.clientX; startY=e.clientY; startTx=tx; startTy=ty; pvImg.classList.add('dragging'); });
    document.addEventListener('mousemove', function(e){ if(!isDragging) return; var dx=e.clientX-startX, dy=e.clientY-startY; tx=startTx+dx/scale; ty=startTy+dy/scale; pvImg.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'; });
    document.addEventListener('mouseup', function(){ isDragging=false; pvImg.classList.remove('dragging'); });
    pvImg.addEventListener('touchstart', function(e){ if(e.touches.length===1){ isDragging=true; startX=e.touches[0].clientX; startY=e.touches[0].clientY; startTx=tx; startTy=ty; } if(e.touches.length===2){ lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); } });
    pvImg.addEventListener('touchmove', function(e){ e.preventDefault(); if(e.touches.length===1&&isDragging){ var dx=e.touches[0].clientX-startX, dy=e.touches[0].clientY-startY; tx=startTx+dx/scale; ty=startTy+dy/scale; pvImg.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'; } if(e.touches.length===2){ var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); scale=Math.min(maxScale,Math.max(minScale,scale*(dist/lastDist))); lastDist=dist; pvImg.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'; } }, {passive:false});
    pvImg.addEventListener('touchend', function(){ isDragging=false; });
    pvImg.addEventListener('dblclick', function(e){ if(scale>1){ pvReset(); }else{ scale=3; tx=(window.innerWidth/2-e.clientX)/scale*0.5; ty=(window.innerHeight/2-e.clientY)/scale*0.5; pvImg.style.transform='translate('+tx+'px,'+ty+'px) scale('+scale+')'; } });
    var sx=0; pvImg.addEventListener('touchstart', function(e){ sx=e.touches[0].clientX; });
    pvImg.addEventListener('touchend', function(e){ if(!e.changedTouches) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>60&&scale<=1){ if(dx<0&&pIdx<PHOTOS.length-1)pvShow(pIdx+1); else if(dx>0&&pIdx>0)pvShow(pIdx-1); } });
    document.addEventListener('keydown', function(e){ if(!pvOv.classList.contains('show')) return; if(e.key==='Escape') pvHide(); if(e.key==='ArrowLeft'&&pIdx>0)pvShow(pIdx-1); if(e.key==='ArrowRight'&&pIdx<PHOTOS.length-1)pvShow(pIdx+1); });
  })();


function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,m,M){return Math.max(m,Math.min(M,v))}
function eoc(t){return 1-Math.pow(1-t,3)}

sl.style.transform='translateX(0%)';sr.style.transform='translateX(0%)';
v.style.opacity=0;

!function u(){var n=new Date();ct.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');cd.textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';setTimeout(u,10000)}();
var ttsBtn=document.getElementById("tts-btn"),ttsPlaying=false,ttsAudio=null;function toggleTTS(){if(ttsPlaying){if(ttsAudio){ttsAudio.pause();ttsAudio.currentTime=0}ttsPlaying=false;ttsBtn.textContent="🔇";ttsBtn.classList.remove("speaking");return}var a=new Audio("audio/tts-intro.mp3");ttsAudio=a;a.onplay=function(){ttsPlaying=true;ttsBtn.textContent="🔊";ttsBtn.classList.add("speaking")};a.onended=a.onpause=function(){ttsPlaying=false;ttsBtn.textContent="🔇";ttsBtn.classList.remove("speaking")};a.play()}ttsBtn.addEventListener("click",toggleTTS);setTimeout(function(){document.getElementById("clk").classList.add("show");document.getElementById("hero-text").classList.add("show");document.getElementById("hc").classList.add("show");ttsBtn.classList.add("show");},500);


// ── Mouse parallax + wheel zoom (like :3003 portal) ──
var rx=0,ry=0,cx=0,cy=0,isOpen=false,isAnim=false,portalZoom=1;
window.addEventListener('mousemove',function(e){rx=(e.clientX/window.innerWidth)*2-1;ry=(e.clientY/window.innerHeight)*2-1;});
window.addEventListener('wheel',function(e){if(!isOpen&&!isAnim){if(e.deltaY<0)portalZoom=clamp(portalZoom*1.07,1,6);else portalZoom=clamp(portalZoom*0.93,1,6);e.preventDefault();}},{passive:false});

!function tick(){
  cx=lerp(cx,rx,0.07);cy=lerp(cy,ry,0.07);
  if(!isAnim&&!isOpen){
    pt.style.transform='scale('+portalZoom+')';
    w.style.transform='translate3d('+(cx*6)+'px,'+(cy*6)+'px,0)';
  }
  if(isOpen){v.style.transform='translate3d('+(cx*4)+'px,'+(cy*4)+'px,0)';}
  requestAnimationFrame(tick);
}();

// ── 谢氏历史打字机效果 ──

// ── Toggle open/close ──
document.getElementById('openBtn2').addEventListener('click',function(){
  if(isAnim)return;isAnim=true;
  var opening=!isOpen;
  if(opening){document.getElementById('hc').classList.remove('show');document.getElementById('hero-text').classList.remove('show');}
  var dur=2200,st=Date.now();
  var ss=opening?0:50,ts=opening?50:0;
  !function an(){
    var el=Date.now()-st,t=Math.min(el/dur,1),e=eoc(t),sh=ss+(ts-ss)*e;
    sl.style.transform='translateX(-'+sh+'%)';sr.style.transform='translateX('+sh+'%)';
    if(opening){
      v.style.zIndex=11;v.style.opacity=e;v.style.transform='scale('+lerp(1.3,1.0,e)+')';
      pt.style.transform='scale('+lerp(1,8,e)+')';pt.style.opacity=1-e;
    } else {
      v.style.zIndex=0;v.style.opacity=1-e;v.style.transform='scale('+lerp(1.0,1.3,e)+')';
      pt.style.transform='scale('+lerp(8,1,e)+')';pt.style.opacity=e;
    }
    if(t<1) requestAnimationFrame(an);
    else {
      isOpen=opening;isAnim=false;
      if(opening){
        v.style.opacity=1;v.style.transform='scale(1)';pt.style.display='none';
        sl.style.display='none';sr.style.display='none';
        vn.classList.add('show');ent.classList.add('show');etStart();
        document.getElementById('pv-trigger').classList.add('show');
        document.getElementById('openBtn2').textContent='✦ 收起';
      } else {
        v.style.opacity=0;pt.style.display='';pt.style.opacity=1;pt.style.transform='none';
        sl.style.display='';sr.style.display='';w.style.transform='none';
        vn.classList.remove('show');ent.classList.remove('show');etStop();document.getElementById('hc').classList.add('show');document.getElementById('hero-text').classList.add('show');
        document.getElementById('openBtn2')='✦ 探索下枫槎';
      }
    }
  }();
});

<div id="wl-overlay">
  <div class="wl-box" id="wl-box">
    <span class="wl-icon">🏮</span>
    <h2>下枫槎·谢氏</h2>
    <div class="wl-sub">宁海 · 乌衣世泽 宝树家声</div>
    <div class="wl-desc" id="wl-desc">您是下枫槎村谢氏族人吗？</div>

    <div id="wl-step"></div>

<script>
(function(){
  var overlay = document.getElementById('wl-overlay');
  var step = document.getElementById('wl-step');
  var desc = document.getElementById('wl-desc');
  var hint = document.getElementById('wl-hint');
  var box = document.getElementById('wl-box');

  if (localStorage.getItem('wl_done')) { overlay.classList.add('hide'); return; }

  function showStep(s) {
    step.innerHTML = '';
    hint.textContent = '';
    if (s === 1) {
      desc.textContent = '您是下枫槎村谢氏族人吗？';
      step.innerHTML = '<div class="wl-btn-row"><button class="wl-btn wl-btn-p" onclick="window._wlGo(2)">是，我是族人</button><button class="wl-btn wl-btn-s" onclick="window._wlGo(3)">不是</button></div>';
    } else if (s === 2) {
      desc.textContent = '欢迎族人！请填写基本信息';
      step.innerHTML = '<input class="wl-field" id="wl-name" placeholder="您的姓名"><input class="wl-field" id="wl-father" placeholder="父亲名字"><input class="wl-field" id="wl-grandpa" placeholder="祖父名字（可留空）"><div class="wl-btn-row"><button class="wl-btn wl-btn-p" id="wl-submit-btn" onclick="window._wlSubmit()">验证身份</button></div><div class="wl-login-row" style="justify-content:center"><button class="wl-back" onclick="window._wlSkip()">暂不验证，先浏览</button><button class="wl-back" onclick="window._wlGo(1)">← 返回</button></div>';
    } else if (s === 3) {
      desc.textContent = '欢迎您！请问您访问本站的目的是？';
      step.innerHTML = '<input class="wl-field" id="wl-purpose" placeholder="如：了解谢氏文化、查阅族谱..."><div style="font-size:11px;color:rgba(245,230,200,0.2);margin-bottom:8px">或使用以下方式登录</div><div class="wl-login-row"><button class="wl-login-btn" onclick="window._wlDone()">💬 微信</button><button class="wl-login-btn" onclick="window._wlDone()">📞 电话</button></div><button class="wl-back" onclick="window._wlGo(1)">← 返回</button>';
    }
    box.style.animation = 'none';
    void box.offsetHeight;
    box.style.animation = 'wlfade 0.4s cubic-bezier(0.22,1,0.36,1) both';
  }
  window._wlGo = function(s) { showStep(s); };
  window._wlSubmit = function() {
    var name = document.getElementById('wl-name').value.trim();
    var father = document.getElementById('wl-father').value.trim();
    if (!name || !father) { hint.textContent = '请填写姓名和父亲名字'; return; }
    var gp = document.getElementById('wl-grandpa').value.trim();
    var btn = document.getElementById('wl-submit-btn');
    if (btn.disabled) return;
    btn.disabled = true; btn.textContent = '验证中…';
    fetch('/api/verify-member', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, fatherName: father, grandpaName: gp || undefined })
    }).then(function(r){ return r.json(); }).then(function(res){
      btn.disabled = false; btn.textContent = '验证身份';
      if (res.verified) {
        try {
          localStorage.setItem('ai_clan_token', res.token);
          localStorage.setItem('ai_clan_person', JSON.stringify({ personId: res.personId, name: res.name }));
        } catch(e) {}
        localStorage.setItem('wl_done', '1');
        overlay.classList.add('hide');
      } else {
        hint.textContent = res.message || '信息不符，请核对或联系管理员';
      }
    }).catch(function(){
      btn.disabled = false; btn.textContent = '验证身份';
      hint.textContent = '网络异常，请重试';
    });
  };
  window._wlSkip = function() {
    localStorage.setItem('wl_done', '1');
    overlay.classList.add('hide');
  };
  window._wlDone = function() {
    localStorage.setItem('wl_done', '1');
    overlay.classList.add('hide');
  };
  showStep(1);
})();
</script>
