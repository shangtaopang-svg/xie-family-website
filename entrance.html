<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { scrollbar-gutter:stable; }
    html, body { margin:0; padding:0; background:#0a0806; scroll-behavior:auto; }
    body { font-family:'Noto Sans SC',sans-serif; color:#f5e6c8; overflow-x:hidden; }
    * { box-sizing:border-box; }
    a { text-decoration:none; }

    @keyframes bobUp { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }

    /* ── Scroll spacer + sticky stage ── */
    #scroll-root { height:520vh; position:relative; }
    #stage { position:sticky; top:0; left:0; width:100%; height:100vh; overflow:hidden; background:#0a0806; }

    /* ── Background images with smooth mask transitions ── */
    .bg-half {
      position:absolute; top:0; height:100%; width:50%; z-index:0;
      background-size:cover; background-position:center;
      pointer-events:none; will-change:transform;
    }
    #bg-left { left:0; }
    #bg-right { right:0; }
    /* Smooth edge mask - left fades on right, right fades on left */
    #bg-left {
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 120px), transparent calc(100% - 20px));
      mask-image: linear-gradient(90deg, #000 calc(100% - 120px), transparent calc(100% - 20px));
      -webkit-mask-composite: source-over; mask-composite: add;
      background-size:auto 90%; background-position:center center;
    }
    #bg-right {
      -webkit-mask-image: linear-gradient(270deg, #000 calc(100% - 120px), transparent calc(100% - 20px));
      mask-image: linear-gradient(270deg, #000 calc(100% - 120px), transparent calc(100% - 20px));
      -webkit-mask-composite: source-over; mask-composite: add;
      background-size:auto 90%; background-position:center center;
    }
    /* Dynamic mask adjustment via JS will set custom property */

    #world-overlay {
      position:absolute; inset:0; z-index:1; pointer-events:none;
      background:
        radial-gradient(ellipse at 50% 80%, rgba(10,8,6,0) 30%, rgba(10,8,6,0.6) 80%, rgba(10,8,6,0.92) 100%),
        linear-gradient(180deg, rgba(10,8,6,0.15) 0%, transparent 30%, transparent 70%, rgba(10,8,6,0.5) 100%);
    }

    /* ── Elegant Scroll Axles (画轴) ── */
    .scroll-axle {
      position:absolute; top:6%; height:88%; z-index:10;
      width:16px; cursor:ew-resize; user-select:none; -webkit-user-select:none;
      will-change:transform;
      background:
        repeating-linear-gradient(0deg, rgba(120,80,40,0.08),rgba(120,80,40,0.08) 1px, transparent 1px, transparent 5px),
        linear-gradient(90deg, #6B4226 0%, #8B5E3A 20%, #A07850 40%, #B08860 50%, #A07850 60%, #8B5E3A 80%, #5A3A22 100%);
      box-shadow:0 0 15px rgba(0,0,0,0.3), 0 0 30px rgba(0,0,0,0.15);
      border-radius:4px;
      transition:box-shadow 0.4s;
    }
    .scroll-axle:hover { box-shadow:0 0 20px rgba(0,0,0,0.4), 0 0 40px rgba(0,0,0,0.2); }
    /* End caps (轴头) */
    .axle-cap {
      position:absolute; left:50%; transform:translateX(-50%); z-index:11;
      width:26px; height:18px; border-radius:4px;
      background:linear-gradient(180deg, #8B6B4A 0%, #A0805F 25%, #C4A07A 50%, #B89670 75%, #7A5A3A 100%);
      box-shadow:0 1px 4px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.1);
    }
    .axle-cap.top { top:-4px; border-radius:5px 5px 3px 3px; }
    .axle-cap.bottom { bottom:-4px; border-radius:3px 3px 5px 5px; }
    /* Decorative ribbon/knot on end caps */
    .axle-cap::after {
      content:''; position:absolute; inset:2px;
      border:1px solid rgba(255,255,255,0.06); border-radius:2px;
    }

    /* ── Center joinery (中缝装裱) ── */
    /* ── Center Mounting Panel (画卷中缝装裱) ── */
    #center-mount {
      position:absolute; top:6%; height:88%; z-index:2; pointer-events:none;
      background:linear-gradient(90deg, rgba(235,225,210,0.06), rgba(235,225,210,0.10) 30%, rgba(235,225,210,0.10) 70%, rgba(235,225,210,0.06));
      border-left:1px solid rgba(201,168,76,0.08);
      border-right:1px solid rgba(201,168,76,0.08);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      overflow:hidden;
    }
    #center-mount .mount-text {
      font-family:'Ma Shan Zheng','Noto Serif SC',serif;
      color:rgba(201,168,76,0.2);
      white-space:nowrap; text-align:center;
      line-height:1.4; letter-spacing:0.08em;
      transition:opacity 0.4s;
    }
    #center-mount .mount-title {
      font-size:clamp(18px, 2.8vw, 42px);
      font-weight:400;
    }
    #center-mount .mount-motto {
      font-size:clamp(10px, 1.4vw, 20px);
      margin-top:6px;
      color:rgba(201,168,76,0.12);
    }
    #center-mount .mount-seal {
      margin-top:12px;
      width:clamp(20px, 2.4vw, 36px); height:clamp(20px, 2.4vw, 36px);
      border:1px solid rgba(168,48,48,0.15);
      display:grid; place-items:center;
      font-family:'Noto Serif SC',serif;
      font-size:clamp(10px, 1.2vw, 18px);
      color:rgba(168,48,48,0.12);
      transform:rotate(-3deg);
    }

    /* ── Centered Clock (月窗式时钟) ── */
    #clock-frame {
      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      z-index:15; pointer-events:auto;
      width:clamp(180px, 22vw, 320px); aspect-ratio:1/1;
      border-radius:50%;
      background:rgba(168,48,48,0.15);
      backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      border:1.5px solid rgba(168,48,48,0.2);
      box-shadow:0 0 60px rgba(168,48,48,0.08), 0 0 120px rgba(0,0,0,0.2);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      opacity:0; transform:translate(-50%,-50%) scale(0.9);
      transition:opacity 1s ease .6s, transform 1s ease .6s, box-shadow 0.6s;
    }
    #clock-frame.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
    #clock-frame:hover { box-shadow:0 0 80px rgba(168,48,48,0.15), 0 0 120px rgba(0,0,0,0.25); }

    /* Decorative ring inside clock */
    #clock-frame::before {
      content:''; position:absolute; inset:8px;
      border-radius:50%;
      border:1px solid rgba(168,48,48,0.1);
      pointer-events:none;
    }
    #clock-frame::after {
      content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      width:6px; height:6px;
      border-radius:50%;
      background:rgba(168,48,48,0.2);
      pointer-events:none;
    }
    .clock-time {
      font-family:'Noto Serif SC',serif;
      font-size:clamp(36px, 6vw, 64px); font-weight:700;
      color:#f5e6c8; line-height:1; letter-spacing:0.04em;
      text-shadow:0 2px 20px rgba(0,0,0,0.4);
      margin-top:-8px;
    }
    .clock-date {
      font-size:clamp(11px, 1.1vw, 14px);
      color:rgba(245,230,200,0.55); letter-spacing:0.15em;
      margin-top:6px;
    }
    .clock-lunar {
      font-size:clamp(10px, 0.9vw, 12px);
      color:rgba(201,168,76,0.45); letter-spacing:0.1em;
      margin-top:2px;
    }
    /* Clock decorative dots (时辰标记) */
    .clock-dot {
      position:absolute; width:3px; height:3px; border-radius:50%;
      background:rgba(201,168,76,0.2);
    }

    /* ── Navigation ── */
    nav {
      position:absolute; top:0; left:0; right:0; z-index:50;
      display:flex; align-items:center; justify-content:space-between;
      padding:20px 48px; pointer-events:auto;
    }
    .nav-left,.nav-right { display:flex; align-items:center; gap:20px; }
    .nav-link { font-size:12px; letter-spacing:0.12em; color:rgba(245,230,200,0.7); text-decoration:none; transition:color .3s; }
    .nav-link:hover { color:#c9a84c; }
    .nav-emblem { display:flex; align-items:center; gap:8px; opacity:0; transition:opacity .8s ease; }
    .nav-emblem.show { opacity:1; }
    .nav-emblem .seal {
      width:32px; height:32px; flex:none; background:#a83030; border-radius:3px;
      display:grid; place-items:center; font-family:'Noto Serif SC',serif;
      font-size:18px; font-weight:900; color:#f5e6c8;
      box-shadow:0 1px 6px rgba(168,48,48,0.3); position:relative;
    }
    .nav-emblem .seal::after { content:''; position:absolute; inset:2px; border:1px solid rgba(245,230,200,0.25); border-radius:1px; }
    .nav-emblem .seal-text { font-family:'Noto Serif SC',serif; font-size:13px; font-weight:600; color:#c9a84c; letter-spacing:0.12em; }

    /* ── Drag hint ── */
    .drag-hint {
      position:absolute; bottom:70px; left:0; right:0; text-align:center; z-index:15;
      font-size:11px; color:rgba(245,230,200,0.2);
      letter-spacing:0.15em; pointer-events:none;
      opacity:0; transition:opacity .8s ease 1.2s;
    }
    .drag-hint.show { opacity:1; }

    /* ── Scene 2: Village Story ── */
    #scene2 { position:absolute; inset:0; z-index:21; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; padding:0 40px; }
    .story-wrap { text-align:center; max-width:640px; }
    .story-eyebrow { font-family:'Noto Serif SC',serif; font-size:13px; letter-spacing:0.25em; color:rgba(201,168,76,0.6); margin-bottom:12px; }
    .story-title { font-family:'Noto Serif SC',serif; font-size:clamp(28px,4vw,52px); font-weight:700; color:#f5e6c8; margin:0 0 16px; line-height:1.2; text-shadow:0 2px 20px rgba(0,0,0,0.3); }
    .story-text { font-size:clamp(14px,1.3vw,17px); line-height:1.9; color:rgba(245,230,200,0.7); margin:0 auto 28px; max-width:520px; }
    .stats-grid { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:600px; margin:0 auto; }
    .stat-item { flex:1; min-width:80px; max-width:120px; background:rgba(245,230,200,0.06); border:1px solid rgba(245,230,200,0.08); border-radius:16px; padding:16px 8px; text-align:center; backdrop-filter:blur(8px); transition:all .3s; }
    .stat-item:hover { background:rgba(245,230,200,0.10); border-color:rgba(201,168,76,0.2); transform:translateY(-2px); }
    .stat-num { font-family:'Noto Serif SC',serif; font-size:clamp(24px,3vw,36px); font-weight:700; color:#c9a84c; line-height:1; }
    .stat-num .unit { font-size:0.5em; color:rgba(201,168,76,0.6); margin-left:2px; }
    .stat-label { font-size:11px; color:rgba(245,230,200,0.5); margin-top:6px; letter-spacing:0.08em; }

    /* ── Scene 3: CTA ── */
    #scene3 { position:absolute; inset:0; z-index:22; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; padding:0 40px; }
    .cta-wrap { text-align:center; max-width:520px; }
    .cta-title { font-family:'Noto Serif SC',serif; font-size:clamp(32px,5vw,64px); font-weight:700; color:#f5e6c8; letter-spacing:0.06em; line-height:1.15; margin:0 0 20px; text-shadow:0 2px 20px rgba(0,0,0,0.3); }
    .cta-desc { font-size:clamp(14px,1.2vw,17px); line-height:1.7; color:rgba(245,230,200,0.6); margin:0 auto 28px; max-width:440px; }
    .cta-btn { display:inline-block; font-family:'Noto Serif SC',serif; font-size:16px; letter-spacing:0.15em; color:#0a0806; background:linear-gradient(135deg,#c9a84c,#e8c97a); padding:14px 48px; border-radius:50px; text-decoration:none; border:none; transition:all .3s; cursor:pointer; box-shadow:0 4px 20px rgba(201,168,76,0.25); }
    .cta-btn:hover { transform:scale(1.05); box-shadow:0 8px 30px rgba(201,168,76,0.4); }
    .cta-links { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:24px; }
    .cta-link { font-size:13px; color:rgba(245,230,200,0.5); padding:8px 18px; border-radius:20px; border:1px solid rgba(245,230,200,0.1); transition:all .3s; letter-spacing:0.06em; }
    .cta-link:hover { color:#c9a84c; border-color:rgba(201,168,76,0.3); background:rgba(201,168,76,0.06); }

    /* ── Scroll Cue ── */
    .scroll-cue { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; z-index:30; cursor:pointer; pointer-events:auto; opacity:0; transition:opacity .8s ease; }
    .scroll-cue.show { opacity:1; }
    .scroll-cue span { font-size:10px; letter-spacing:0.2em; color:rgba(245,230,200,0.25); }
    .scroll-cue .chev { width:28px; height:28px; border-radius:50%; border:1px solid rgba(245,230,200,0.15); display:grid; place-items:center; animation:bobUp 1.8s ease-in-out infinite; }
    .scroll-cue .chev svg { opacity:0.4; }

    /* ── Responsive ── */
    @media (max-width:767px) {
      nav { padding:12px 16px; }
      .nav-left .nav-link { display:none; }
      .nav-link.nav-enter-mobile { display:inline-block; font-size:11px; }
      .nav-right .nav-link { display:none; }
      .nav-link.nav-back-mobile { display:inline-block; }
      .nav-emblem .seal { width:26px; height:26px; font-size:14px; }
      .nav-emblem .seal-text { font-size:11px; }
      .scroll-axle { width:10px; top:10%; height:80%; }
      .axle-cap { width:18px; height:12px; }
      .axle-cap.top { top:-3px; }
      .axle-cap.bottom { bottom:-3px; }
      #clock-frame { width:clamp(140px, 40vw, 200px); }
      .drag-hint { bottom:50px; font-size:10px; }
      .enter-fixed {
        display:flex; position:fixed; z-index:999;
        bottom:24px; left:50%; transform:translateX(-50%);
        font-family:'Noto Serif SC',serif; font-size:13px; letter-spacing:0.12em;
        color:#0a0806; background:linear-gradient(135deg,#c9a84c,#e8c97a);
        padding:10px 28px; border-radius:50px; text-decoration:none;
        border:1px solid rgba(201,168,76,0.3);
        backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
        box-shadow:0 4px 16px rgba(0,0,0,0.3);
        transition:opacity .8s ease; opacity:0;
      }
      .enter-fixed.show { opacity:1; }
    }
  </style>
</head>
<body>

      <!-- Center mounting panel (fills gap between axles) -->

  <script>
    var BG_LEFT = 'images/bg-left.png';
    var BG_RIGHT = 'images/bg-right.png';

    var bgLeft = document.getElementById('bg-left');
    var bgRight = document.getElementById('bg-right');
    var centerMount = document.getElementById('center-mount');
    var axleLeft = document.getElementById('axle-left');
    var axleRight = document.getElementById('axle-right');
    var scene2 = document.getElementById('scene2');
    var scene3 = document.getElementById('scene3');
    var scrollCue = document.getElementById('scrollCue');
    var navEmblem = document.getElementById('navEmblem');
    var clockFrame = document.getElementById('clock-frame');
    var dragHint = document.getElementById('dragHint');
    var clockTime = document.getElementById('clockTime');
    var clockDate = document.getElementById('clockDate');
    var clockLunar = document.getElementById('clockLunar');

    // Load images
    bgLeft.style.backgroundImage = "url('" + BG_LEFT + "')";
    bgRight.style.backgroundImage = "url('" + BG_RIGHT + "')";

    // ── Axle drag state ──
    var isDragging = false;
    var activeAxle = null;
    var dragStartX = 0;
    var dragStartPos = 0;
    var leftPos = 50;   // % from left edge (0-50)
    var rightPos = 50;  // % from left edge (50-100)
    var minEdge = 4;

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }

    // ── Responsive ──
    var isMobile = window.matchMedia('(max-width: 767px)').matches;
    if (isMobile) minEdge = 3;

    // ── Scroll progress ──
    var scrollProgress = 0;
    function readScroll() {
      var root = document.getElementById('scroll-root');
      var s = root.offsetHeight - window.innerHeight;
      scrollProgress = s > 0 ? clamp(window.scrollY / s, 0, 1) : 0;
    }
    window.addEventListener('scroll', readScroll, { passive: true });
    window.addEventListener('resize', readScroll);
    readScroll();

    // ── Clock ──
    function updateClock() {
      var now = new Date();
      clockTime.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      var days = ['日','一','二','三','四','五','六'];
      clockDate.textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 · 星期'+days[now.getDay()];
      var lunar = {'2026-7-24':'六月廿一','2026-7-25':'六月廿二','2026-7-26':'六月廿三','2026-7-27':'六月廿四','2026-7-28':'六月廿五','2026-7-29':'六月廿六','2026-7-30':'六月廿七','2026-7-31':'六月廿八'};
      var key = now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();
      clockLunar.textContent = lunar[key] ? '农历'+lunar[key] : '';
    }
    updateClock();
    setInterval(updateClock, 10000);

    // ── Update axles and image masks ──
    function updateVisuals() {
      var vw = window.innerWidth;
      var edge = isMobile ? 1 : 2;
      leftPos = clamp(leftPos, edge, 50);
      rightPos = clamp(rightPos, 50, 100 - edge);

      // Position the axle elements
      axleLeft.style.left = leftPos + '%';
      axleRight.style.left = (rightPos - (isMobile ? 10 : 16) / vw * 100) + '%';

      // Position center mounting panel between the two axles
      var mountW = rightPos - leftPos;
      if (centerMount) {
        centerMount.style.left = leftPos + '%';
        centerMount.style.width = mountW + '%';
        // Fade out mounting text when gap is too narrow
        var mountTexts = centerMount.querySelectorAll('.mount-text, .mount-seal');
        var textOpacity = Math.min(1, Math.max(0, (mountW - 8) / 20));
        mountTexts.forEach(function(el) { el.style.opacity = textOpacity; });
      }

      // Update image masks
      var leftCut = leftPos; // left image visible from 0 to leftPos%
      var rightCut = 100 - rightPos; // right image visible from rightPos% to 100%

      // Left image: mask cuts off from leftPos to 50%
      // Mask is relative to element (50% viewport). leftPos in viewport = leftPos*2 in element%
      var lCut = leftPos * 2;
      bgLeft.style.maskImage = 'linear-gradient(90deg, #000 ' + Math.max(0, lCut - 30) + '%, #000 ' + lCut + '%, transparent ' + (lCut + 10) + '%)';
      bgLeft.style.webkitMaskImage = 'linear-gradient(90deg, #000 ' + Math.max(0, lCut - 30) + '%, #000 ' + lCut + '%, transparent ' + (lCut + 10) + '%)';

      // Right image: mask cuts off from 0 to (rightCut from the right)
      // Element spans 50%-100% viewport. rightCut = 100 - rightPos.
      // In element-relative: clip (100 - rightCut*2)% from left, show remaining
      var rShow = (100 - rightPos) * 2; // % of element visible from right
      var rCut = 100 - rShow; // % to cut from left of element
      bgRight.style.maskImage = 'linear-gradient(270deg, #000 ' + Math.max(0, rShow - 30) + '%, #000 ' + rShow + '%, transparent ' + (rShow + 10) + '%)';
      bgRight.style.webkitMaskImage = 'linear-gradient(270deg, #000 ' + Math.max(0, rShow - 30) + '%, #000 ' + rShow + '%, transparent ' + (rShow + 10) + '%)';
    }

    updateVisuals();

    // ── Drag interaction ──
    function hitTest(x, y) {
      var rL = axleLeft.getBoundingClientRect();
      var rR = axleRight.getBoundingClientRect();
      var pad = isMobile ? 15 : 25;
      if (x >= rL.left - pad && x <= rL.right + pad && y >= rL.top - pad && y <= rL.bottom + pad) return 'left';
      if (x >= rR.left - pad && x <= rR.right + pad && y >= rR.top - pad && y <= rR.bottom + pad) return 'right';
      return null;
    }

    function onPointerDown(e) {
      var x = e.clientX || (e.touches && e.touches[0].clientX);
      var y = e.clientY || (e.touches && e.touches[0].clientY);
      var hit = hitTest(x, y);
      if (!hit) return;
      isDragging = true;
      activeAxle = hit;
      dragStartX = x;
      dragStartPos = hit === 'left' ? leftPos : rightPos;
      e.preventDefault();
    }

    function onPointerMove(e) {
      var x = e.clientX || (e.touches && e.touches[0].clientX);
      if (!isDragging || !x) return;
      var vw = window.innerWidth;
      var dx = (x - dragStartX) / vw * 100;
      if (activeAxle === 'left') leftPos = clamp(dragStartPos + dx, isMobile ? 1 : 2, 50);
      else if (activeAxle === 'right') rightPos = clamp(dragStartPos + dx, 50, isMobile ? 99 : 98);
      updateVisuals();
    }

    function onPointerUp() { isDragging = false; activeAxle = null; }

    document.addEventListener('mousedown', onPointerDown);
    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('mouseup', onPointerUp);
    document.addEventListener('touchstart', onPointerDown, { passive: false });
    document.addEventListener('touchmove', onPointerMove, { passive: false });
    document.addEventListener('touchend', onPointerUp);

    // ── Entrance animation ──
    setTimeout(function() {
      // Smoothly open from center
      var startL = 50, startR = 50;
      var targetL = 42, targetR = 58;
      var startTime = Date.now();
      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
      function animateIn() {
        var elapsed = Date.now() - startTime;
        var t = Math.min(elapsed / 1400, 1);
        var e = easeOutCubic(t);
        leftPos = startL + (targetL - startL) * e;
        rightPos = startR + (targetR - startR) * e;
        updateVisuals();
        if (t < 1) requestAnimationFrame(animateIn);
      }
      animateIn();
    }, 200);

    // Fade in UI
    setTimeout(function() {
      clockFrame.classList.add('show');
      dragHint.classList.add('show');
      navEmblem.classList.add('show');
      scrollCue.classList.add('show');
    }, 700);

    // ── Mouse parallax ──
    var tx = 0, ty = 0, cx = 0, cy = 0;
    window.addEventListener('mousemove', function(e) {
      tx = (e.clientX / window.innerWidth) * 2 - 1;
      ty = (e.clientY / window.innerHeight) * 2 - 1;
    });

    // ── Stats ──
    var statsAnimated = false;
    function animateStats() {
      if (statsAnimated) return;
      var els = document.querySelectorAll('.stat-val');
      if (!els.length) return;
      statsAnimated = true;
      els.forEach(function(el) {
        var t = parseInt(el.getAttribute('data-target'), 10) || 0;
        var d = 1500, s = Date.now();
        function tick() {
          var p = Math.min((Date.now() - s) / d, 1);
          el.textContent = Math.round(easeOutCubic(p) * t);
          if (p < 1) requestAnimationFrame(tick); else el.textContent = t;
        }
        tick();
      });
    }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    // ── Render loop ──
    function tick() {
      cx = lerp(cx, tx, 0.05);
      cy = lerp(cy, ty, 0.05);
      var p = scrollProgress;

      var scale = 1 + p * 0.08;
      bgLeft.style.transform = 'scale('+scale+') translate3d('+(cx*2)+'px,'+(cy*2)+'px,0)';
      bgRight.style.transform = 'scale('+scale+') translate3d('+(cx*2)+'px,'+(cy*2)+'px,0)';

      // Scene 1 (clock + drag hint)
      var s1 = clamp(1 - p / 0.25, 0, 1);
      clockFrame.style.opacity = s1;
      dragHint.style.opacity = s1;

      // Scene 2
      var s2in = clamp((p - 0.22) / 0.15, 0, 1);
      var s2out = clamp(1 - (p - 0.55) / 0.12, 0, 1);
      var s2 = Math.min(s2in, s2out);
      scene2.style.opacity = s2;
      scene2.style.pointerEvents = s2 > 0.05 ? 'auto' : 'none';
      if (s2 > 0.3 && !statsAnimated) animateStats();

      // Scene 3
      var s3 = clamp((p - 0.58) / 0.15, 0, 1);
      scene3.style.opacity = s3;
      scene3.style.pointerEvents = s3 > 0.05 ? 'auto' : 'none';

      scrollCue.style.opacity = s1 > 0.1 ? 1 : 0;
      if (p > 0.05 && !navEmblem.classList.contains('show')) navEmblem.classList.add('show');

      var ef = document.getElementById('enterFixed');
      if (ef) ef.style.opacity = s3 > 0.3 ? '1' : '0';

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    window.addEventListener('resize', updateVisuals);
  </script>
</body>
</html>
