<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>下枫槎 · 山水画卷 — 宁海谢氏家族</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { scrollbar-gutter:stable; }
    html, body { margin:0; padding:0; background:#0a0806; scroll-behavior:auto; }
    body { font-family:'Noto Sans SC',sans-serif; color:#f5e6c8; overflow-x:hidden; overscroll-behavior:none; }
    * { box-sizing:border-box; }
    a { text-decoration:none; }

    @keyframes bobUp { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }

    /* ── Scroll spacer + sticky stage ── */
    #scroll-root { height:520vh; position:relative; }
    #stage {
      position:sticky; top:0; left:0; width:100%; height:100vh;
      overflow:hidden; background:#0a0806;
    }

    /* ── Parallax layers ── */
    .layer { position:absolute; inset:0; width:100%; height:100%; will-change:transform,opacity; pointer-events:none; }

    /* World background — the full village panorama */
    #world {
      background-size:cover; background-position:center 30%;
      transform-origin:50% 50%; z-index:1; opacity:0;
    }

    /* Portal — zooms dramatically to reveal the world */
    #portal {
      background-size:cover; background-position:center 40%;
      transform-origin:52% 38%; z-index:2;
    }

    /* Dark overlay gradient */
    #overlay {
      z-index:3;
      background:
        radial-gradient(ellipse at 50% 80%, rgba(10,8,6,0) 20%, rgba(10,8,6,0.5) 75%, rgba(10,8,6,0.88) 100%),
        linear-gradient(180deg, rgba(10,8,6,0.08) 0%, transparent 25%, transparent 75%, rgba(10,8,6,0.3) 100%);
    }

    /* ── Curtains ── */
    .curtain {
      position:absolute; top:0; height:100%; z-index:8; will-change:transform; pointer-events:none;
      width:50%;
      background:
        repeating-linear-gradient(0deg, transparent,transparent 2px, rgba(180,160,130,0.02) 2px,rgba(180,160,130,0.02) 3px),
        linear-gradient(90deg, #e8dfcf 0%, #f0e8d8 5%, #f5edde 12%, #f2e9d9 30%, #f0e7d7 50%, #efe6d6 80%, #ede4d4 95%, #e8dfcf 100%);
    }
    #curtain-left { left:0; transform-origin:left center; }
    #curtain-right { right:0; transform-origin:right center; }
    .curtain::after {
      content:''; position:absolute; top:5%; height:90%; width:2px;
      background:linear-gradient(180deg, transparent 0%, #c9a84c 20%, #c9a84c 80%, transparent 100%);
      opacity:0.3;
    }
    #curtain-left::after { right:20px; }
    #curtain-right::after { left:20px; }

    /* Wooden rollers */
    .curtain-roller {
      position:absolute; top:6%; height:88%; width:16px; z-index:9; pointer-events:none;
      background:repeating-linear-gradient(0deg, rgba(120,80,40,0.06),rgba(120,80,40,0.06) 1px,transparent 1px,transparent 4px),
        linear-gradient(90deg, #6B4226 0%, #8B5E3A 20%, #A07850 40%, #B08860 50%, #A07850 60%, #8B5E3A 75%, #5A3A22 100%);
      box-shadow:0 0 15px rgba(0,0,0,0.25); border-radius:3px;
    }
    #roller-left { right:-2px; border-radius:3px 0 0 3px; }
    #roller-right { left:-2px; border-radius:0 3px 3px 0; }
    .roller-cap {
      position:absolute; left:50%; transform:translateX(-50%); z-index:10;
      width:24px; height:16px; border-radius:3px;
      background:linear-gradient(180deg, #8B6B4A 0%, #A0805F 25%, #C4A07A 50%, #B89670 75%, #7A5A3A 100%);
      box-shadow:0 1px 4px rgba(0,0,0,0.2);
    }
    .roller-cap::after { content:''; position:absolute; inset:2px; border:1px solid rgba(255,255,255,0.06); border-radius:2px; }
    .roller-cap.top { top:-6px; }
    .roller-cap.bottom { bottom:-6px; }

    /* ── Navigation ── */
    nav {
      position:absolute; top:0; left:0; right:0; z-index:50;
      display:flex; align-items:center; justify-content:space-between;
      padding:20px 48px; pointer-events:auto;
    }
    .nav-left,.nav-right { display:flex; align-items:center; gap:20px; }
    .nav-link { font-size:12px; letter-spacing:0.12em; color:rgba(245,230,200,0.7); text-decoration:none; transition:color .3s; }
    .nav-link:hover { color:#c9a84c; }
    .nav-emblem { display:flex; align-items:center; gap:8px; opacity:0; transition:opacity .8s ease; }
    .nav-emblem.show { opacity:1; }
    .nav-emblem .seal { width:32px; height:32px; flex:none; background:#a83030; border-radius:3px; display:grid; place-items:center; font-family:'Noto Serif SC',serif; font-size:18px; font-weight:900; color:#f5e6c8; box-shadow:0 1px 6px rgba(168,48,48,0.3); position:relative; }
    .nav-emblem .seal::after { content:''; position:absolute; inset:2px; border:1px solid rgba(245,230,200,0.25); border-radius:1px; }
    .nav-emblem .seal-text { font-family:'Noto Serif SC',serif; font-size:13px; font-weight:600; color:#c9a84c; letter-spacing:0.12em; }

    /* ── Scene 1 Hero ── */
    #scene1 {
      position:absolute; inset:0; z-index:20;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      pointer-events:none; padding:80px 40px;
    }
    .hero-title {
      font-family:'Noto Serif SC',serif;
      font-size:clamp(48px,10vw,120px); font-weight:900;
      color:#f5e6c8; line-height:1; letter-spacing:0.06em;
      text-shadow:0 4px 40px rgba(0,0,0,0.5), 0 2px 80px rgba(0,0,0,0.3);
      margin:0; opacity:0; transform:scale(0.95);
      transition:opacity 1.2s ease .9s, transform 1.2s ease .9s;
    }
    .hero-title.show { opacity:1; transform:scale(1); }
    .hero-title .hl { background:linear-gradient(135deg,#c9a84c,#e8c97a,#c9a84c); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .hero-motto {
      font-family:'Noto Serif SC',serif;
      font-size:clamp(14px,1.8vw,24px); font-weight:600;
      color:#c9a84c; letter-spacing:0.3em;
      text-shadow:0 2px 20px rgba(0,0,0,0.4);
      margin:8px 0 4px; opacity:0;
      transition:opacity .8s ease 1.1s;
    }
    .hero-motto.show { opacity:1; }

    /* ── Cards row (like reference) ── */
    .hero-cards {
      position:absolute; bottom:70px; display:flex; gap:14px; z-index:20;
      opacity:0; transition:opacity 1s ease 1.6s;
    }
    .hero-cards.show { opacity:1; }
    .hero-card {
      width:clamp(80px,10vw,130px); height:clamp(80px,10vw,130px);
      border-radius:18px; overflow:hidden;
      position:relative; background:rgba(10,8,6,0.3);
      backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      border:1px solid rgba(245,230,200,0.1);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-decoration:none; color:#f5e6c8; cursor:pointer;
      transition:all .3s cubic-bezier(0.22,1,0.36,1);
    }
    .hero-card:hover { transform:translateY(-4px) scale(1.03); border-color:rgba(201,168,76,0.3); }
    .hero-card .card-icon { font-size:clamp(18px,2.2vw,28px); margin-bottom:4px; }
    .hero-card .card-label { font-family:'Noto Serif SC',serif; font-size:clamp(10px,1.1vw,14px); letter-spacing:0.06em; }

    /* ── Clock (small, top-right like reference) ── */
    #clock-frame {
      position:absolute; top:80px; right:48px; z-index:25; pointer-events:auto;
      text-align:right; opacity:0; transition:opacity 1s ease .6s;
    }
    #clock-frame.show { opacity:1; }
    .clock-time { font-family:'Noto Serif SC',serif; font-size:clamp(20px,2.4vw,32px); font-weight:700; color:#f5e6c8; line-height:1.1; letter-spacing:0.04em; text-shadow:0 2px 16px rgba(0,0,0,0.4); }
    .clock-date { font-size:clamp(10px,0.8vw,12px); color:rgba(245,230,200,0.5); letter-spacing:0.1em; margin-top:2px; }

    /* ── Scene 2 ── */
    #scene2 { position:absolute; inset:0; z-index:21; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; padding:0 40px; }
    .story-wrap { text-align:center; max-width:640px; }
    .story-eyebrow { font-family:'Noto Serif SC',serif; font-size:13px; letter-spacing:0.25em; color:rgba(201,168,76,0.6); margin-bottom:12px; }
    .story-title { font-family:'Noto Serif SC',serif; font-size:clamp(28px,4vw,52px); font-weight:700; color:#f5e6c8; margin:0 0 16px; line-height:1.2; text-shadow:0 2px 20px rgba(0,0,0,0.3); }
    .story-text { font-size:clamp(14px,1.3vw,17px); line-height:1.9; color:rgba(245,230,200,0.7); margin:0 auto 28px; max-width:520px; }
    .stats-grid { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; max-width:600px; margin:0 auto; }
    .stat-item { flex:1; min-width:80px; max-width:120px; background:rgba(245,230,200,0.06); border:1px solid rgba(245,230,200,0.08); border-radius:16px; padding:16px 8px; text-align:center; backdrop-filter:blur(8px); }
    .stat-num { font-family:'Noto Serif SC',serif; font-size:clamp(24px,3vw,36px); font-weight:700; color:#c9a84c; line-height:1; }
    .stat-num .unit { font-size:0.5em; color:rgba(201,168,76,0.6); margin-left:2px; }
    .stat-label { font-size:11px; color:rgba(245,230,200,0.5); margin-top:6px; letter-spacing:0.08em; }

    /* ── Scene 3 ── */
    #scene3 { position:absolute; inset:0; z-index:22; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; padding:0 40px; }
    .cta-wrap { text-align:center; max-width:520px; }
    .cta-title { font-family:'Noto Serif SC',serif; font-size:clamp(32px,5vw,64px); font-weight:700; color:#f5e6c8; letter-spacing:0.06em; line-height:1.15; margin:0 0 20px; text-shadow:0 2px 20px rgba(0,0,0,0.3); }
    .cta-desc { font-size:clamp(14px,1.2vw,17px); line-height:1.7; color:rgba(245,230,200,0.6); margin:0 auto 28px; max-width:440px; }
    .cta-btn { display:inline-block; font-family:'Noto Serif SC',serif; font-size:16px; letter-spacing:0.15em; color:#0a0806; background:linear-gradient(135deg,#c9a84c,#e8c97a); padding:14px 48px; border-radius:50px; text-decoration:none; border:none; transition:all .3s; cursor:pointer; box-shadow:0 4px 20px rgba(201,168,76,0.25); }
    .cta-btn:hover { transform:scale(1.05); box-shadow:0 8px 30px rgba(201,168,76,0.4); }
    .cta-links { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:24px; }
    .cta-link { font-size:13px; color:rgba(245,230,200,0.5); padding:8px 18px; border-radius:20px; border:1px solid rgba(245,230,200,0.1); transition:all .3s; letter-spacing:0.06em; }
    .cta-link:hover { color:#c9a84c; border-color:rgba(201,168,76,0.3); background:rgba(201,168,76,0.06); }

    /* ── Scroll Cue ── */
    .scroll-cue { position:absolute; bottom:30px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; z-index:30; cursor:pointer; pointer-events:auto; opacity:0; transition:opacity .8s ease; }
    .scroll-cue.show { opacity:1; }
    .scroll-cue span { font-size:10px; letter-spacing:0.2em; color:rgba(245,230,200,0.25); }
    .scroll-cue .chev { width:28px; height:28px; border-radius:50%; border:1px solid rgba(245,230,200,0.15); display:grid; place-items:center; animation:bobUp 1.8s ease-in-out infinite; }

    @media (max-width:767px) {
      nav { padding:12px 16px; }
      .nav-left .nav-link:not(.nav-enter-mobile) { display:none; }
      .nav-link.nav-enter-mobile { display:inline-block; font-size:11px; }
      .nav-right .nav-link:not(.nav-back-mobile) { display:none; }
      .nav-link.nav-back-mobile { display:inline-block; }
      .nav-emblem .seal { width:26px; height:26px; font-size:14px; }
      .nav-emblem .seal-text { font-size:11px; }
      #scene1 { padding:40px 20px; }
      .curtain { width:50%; }
      #clock-frame { top:60px; right:16px; }
      .hero-cards { bottom:40px; gap:8px; flex-wrap:wrap; justify-content:center; }
      .hero-card { width:clamp(60px,18vw,90px); height:clamp(60px,18vw,90px); border-radius:12px; }
      .enter-fixed { display:flex; position:fixed; z-index:999; bottom:24px; left:50%; transform:translateX(-50%); font-family:'Noto Serif SC',serif; font-size:13px; letter-spacing:0.12em; color:#0a0806; background:linear-gradient(135deg,#c9a84c,#e8c97a); padding:10px 28px; border-radius:50px; text-decoration:none; border:1px solid rgba(201,168,76,0.3); backdrop-filter:blur(8px); box-shadow:0 4px 16px rgba(0,0,0,0.3); transition:opacity .8s ease; opacity:0; }
      .enter-fixed.show { opacity:1; }
    }
  </style>
</head>
<body>
  <div id="scroll-root">
    <div id="stage">

      <!-- Parallax layers: World + Portal + Overlay -->
      <div id="world" class="layer"></div>
      <div id="portal" class="layer"></div>

      <!-- Curtains -->
      <div id="curtain-left" class="curtain">
        <div id="roller-left" class="curtain-roller">
          <div class="roller-cap top"></div>

      </div>
      <div id="curtain-right" class="curtain">

      </div>

      <!-- Navigation -->
      <nav>

      <!-- Clock (top-right) -->
      <div id="clock-frame">
        <div class="clock-time" id="clockTime">--:--</div>
        <div class="clock-date" id="clockDate"></div>
      </div>

      <!-- Scene 1: Hero center -->
      <div id="scene1">
        <h1 class="hero-title" id="heroTitle"><span class="hl">下枫槎</span></h1>
        <div class="hero-motto" id="heroMotto">乌衣世泽 · 宝树家声</div>
      </div>

      <!-- Cards row (bottom) -->
      <div class="hero-cards" id="heroCards">
        <a class="hero-card" href="pages/genealogy.html"><span class="card-icon">🌳</span><span class="card-label">族谱</span></a>

      <!-- Scene 2 -->
      <div id="scene2">
        <div class="story-wrap">
          <div class="story-eyebrow">· 望府山下 · 枫槎溪畔 ·</div>
          <h2 class="story-title">绿水青山<br>望府香</h2>
          <p class="story-text">白峤港畔、望府山下、枫槎岭口，有一个山青水绿、风景优美的村庄——下枫槎村。自明初建村至今已有650余年历史。望府银毫茶香万里，谢氏文脉源远流长。</p>
          <div class="stats-grid">
            <div class="stat-item"><div class="stat-num"><span class="stat-val" data-target="256">0</span><span class="unit">户</span></div><div class="stat-label">人家</div></div>
            <div class="stat-item"><div class="stat-num"><span class="stat-val" data-target="726">0</span><span class="unit">人</span></div><div class="stat-label">人口</div></div>
            <div class="stat-item"><div class="stat-num"><span class="stat-val" data-target="400">0</span><span class="unit">亩</span></div><div class="stat-label">茶园</div></div>
            <div class="stat-item"><div class="stat-num"><span class="stat-val" data-target="2120">0</span><span class="unit">亩</span></div><div class="stat-label">山林</div></div>

      <!-- Scene 3 -->
      <div id="scene3">

      <div class="scroll-cue" id="scrollCue">
        <span>向下展开画卷</span>
        <div class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(245,230,200,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></div>

  <script>
    // ── Images ──
    // World = full village panorama (the "destination")
    // Portal = the zoom-in image that reveals the world
    var WORLD_BG = 'images/bg-left.png';
    var PORTAL_BG = 'images/dynamic-element.png';

    // ── DOM ──
    var world = document.getElementById('world');
    var portal = document.getElementById('portal');
    var curtainL = document.getElementById('curtain-left');
    var curtainR = document.getElementById('curtain-right');
    var rollerL = document.getElementById('roller-left');
    var rollerR = document.getElementById('roller-right');
    var scene1 = document.getElementById('scene1');
    var scene2 = document.getElementById('scene2');
    var scene3 = document.getElementById('scene3');
    var scrollCue = document.getElementById('scrollCue');
    var navEmblem = document.getElementById('navEmblem');
    var clockFrame = document.getElementById('clock-frame');
    var heroCards = document.getElementById('heroCards');
    var clockTime = document.getElementById('clockTime');
    var clockDate = document.getElementById('clockDate');

    // ── Load images ──
    world.style.backgroundImage = "url('" + WORLD_BG + "')";
    portal.style.backgroundImage = "url('" + PORTAL_BG + "')";

    // ── Math ──
    function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }
    function lerp(a,b,t) { return a + (b - a) * t; }
    function clamp(v,min,max) { return Math.max(min, Math.min(max, v)); }

    var isMobile = window.matchMedia('(max-width: 767px)').matches;

    // ── Scroll progress ──
    var scrollP = 0;
    function readScroll() {
      var root = document.getElementById('scroll-root');
      var s = root.offsetHeight - window.innerHeight;
      scrollP = s > 0 ? clamp(window.scrollY / s, 0, 1) : 0;
    }
    window.addEventListener('scroll', readScroll, { passive: true });
    window.addEventListener('resize', readScroll);
    readScroll();

    // ── Clock ──
    function updateClock() {
      var n = new Date();
      clockTime.textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
      clockDate.textContent = n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';
    }
    updateClock();
    setInterval(updateClock, 10000);

    // ── Mouse ──
    var rx=0, ry=0, cx=0, cy=0;
    window.addEventListener('mousemove', function(e) {
      rx = (e.clientX / window.innerWidth) * 2 - 1;
      ry = (e.clientY / window.innerHeight) * 2 - 1;
    });

    // ── Stats ──
    var statsAnimated = false;
    function animateStats() {
      if (statsAnimated) return;
      var els = document.querySelectorAll('.stat-val');
      if (!els.length) return;
      statsAnimated = true;
      els.forEach(function(el) {
        var t = parseInt(el.getAttribute('data-target'),10)||0;
        var d=1500,s=Date.now();
        function tic() {
          var p2=Math.min((Date.now()-s)/d,1);
          el.textContent=Math.round(easeOutCubic(p2)*t);
          if(p2<1) requestAnimationFrame(tic); else el.textContent=t;
        }
        tic();
      });
    }
    function easeOutCubic(t) { return 1-Math.pow(1-t,3); }

    // ── Entrance fade ──
    setTimeout(function() {
      document.getElementById('heroTitle').classList.add('show');
      document.getElementById('heroMotto').classList.add('show');
      clockFrame.classList.add('show');
      scrollCue.classList.add('show');
      navEmblem.classList.add('show');
    }, 400);
    setTimeout(function() { heroCards.classList.add('show'); }, 1200);

    // ─── REFERENCE-STYLE RENDER LOOP ───
    // Mirrors the effect from :3003 — world scale, portal zoom, curtain open
    var entranceStarted = false;
    setTimeout(function() { entranceStarted = true; }, 100);

    function tick() {
      cx = lerp(cx, rx, 0.07);
      cy = lerp(cy, ry, 0.07);
      var p = scrollP;
      var eased = easeInOut(p);

      // ── World background ──
      // Starts hidden — the village panorama slowly emerges behind the portal as you scroll
      var worldOpacity = clamp((scrollP - 0.05) / 0.30, 0, 1);
      var worldScale = lerp(1.35, 1.18, eased);
      world.style.opacity = worldOpacity;
      world.style.transform = 'scale('+worldScale+') translate3d('+(cx*5)+'px,'+(cy*5)+'px,0)';

      // ── Portal zoom effect ──
      // The landscape image in front — zooms from 1x → 7x and fades out
      // Behind it, the village panorama emerges
      var portalScale = lerp(1.0, 7.0, eased);
      var portalOpacity = clamp(1 - (p - 0.30) / 0.30, 0, 1);
      if (p < 0.05) portalOpacity = 1;
      portal.style.opacity = portalOpacity;
      portal.style.transform = 'scale('+portalScale+') translate3d('+(cx*6)+'px,'+(cy*6)+'px,0)';

      // ── Curtains ──
      // Start fully closed, open as scroll progresses
      var curtainShift = entranceStarted ? eased * 50 : 0;
      var curtainScale = lerp(1.0, 1.15, eased);
      curtainL.style.transform = 'translateX(-'+curtainShift+'%) scale('+curtainScale+')';
      curtainR.style.transform = 'translateX('+curtainShift+'%) scale('+curtainScale+')';
      rollerL.style.transform = 'translateX(-'+curtainShift+'%)';
      rollerR.style.transform = 'translateX('+curtainShift+'%)';

      // ── Scene 1 fade ──
      var s1 = clamp(1 - p / 0.20, 0, 1);
      scene1.style.opacity = s1;
      heroCards.style.opacity = s1 > 0.05 ? s1 : 0;
      // Clock and scroll cue also fade with scene 1 (but slower)
      if (clockFrame) clockFrame.style.opacity = clamp(1 - p / 0.25, 0, 1);

      // ── Scene 2 ──
      var s2in = clamp((p - 0.22) / 0.15, 0, 1);
      var s2out = clamp(1 - (p - 0.55) / 0.12, 0, 1);
      var s2 = Math.min(s2in, s2out);
      scene2.style.opacity = s2;
      scene2.style.pointerEvents = s2 > 0.05 ? 'auto' : 'none';
      if (s2 > 0.3 && !statsAnimated) animateStats();

      // ── Scene 3 ──
      var s3 = clamp((p - 0.58) / 0.15, 0, 1);
      scene3.style.opacity = s3;
      scene3.style.pointerEvents = s3 > 0.05 ? 'auto' : 'none';

      // Scroll cue
      scrollCue.style.opacity = s1 > 0.1 ? 1 : 0;
      if (p > 0.05 && !navEmblem.classList.contains('show')) navEmblem.classList.add('show');

      var ef = document.getElementById('enterFixed');
      if (ef) ef.style.opacity = s3 > 0.3 ? '1' : '0';

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
