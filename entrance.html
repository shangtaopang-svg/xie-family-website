<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>下枫槎 · 山水画卷 — 宁海谢氏家族</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
  :root{scrollbar-gutter:stable}html,body{margin:0;padding:0;background:#0a0806;height:100%;overflow:hidden}
  body{font-family:'Noto Sans SC',sans-serif}*{box-sizing:border-box}a{text-decoration:none}
  #stage{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#0a0806}
  .layer{position:absolute;inset:0;width:100%;height:100%;will-change:transform,opacity;pointer-events:none}
  #village{background-size:cover;background-position:center 30%;z-index:0;opacity:0}
  #world{background-size:cover;background-position:center;z-index:1}
  #ref-portal{position:absolute;inset:0;z-index:10;pointer-events:none;background-size:cover;background-position:center;background-image:url('images/portal-bg-ref.webp');opacity:1;transform-origin:52% 38%;will-change:transform,opacity}
  #overlay{z-index:3;background:radial-gradient(ellipse at 50% 80%,rgba(10,8,6,0) 20%,rgba(10,8,6,0.5) 80%,rgba(10,8,6,0.9) 100%),linear-gradient(180deg,rgba(10,8,6,0.1) 0%,transparent 30%,transparent 70%,rgba(10,8,6,0.3) 100%)}

  /* Nav (:3003 style) */
  nav{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:clamp(12px,2vw,22px) clamp(20px,4vw,48px);pointer-events:auto}
  .nv-l,.nv-r{display:flex;align-items:center;gap:clamp(12px,2vw,30px)}
  .nv-l a,.nv-r a{font-size:clamp(12px,1vw,14px);letter-spacing:0.12em;color:#f5e6c8;text-decoration:none;transition:color .3s;text-transform:uppercase;opacity:0.85}
  .nv-l a:hover,.nv-r a:hover{color:#c9a84c}
  .nv-logo{width:clamp(22px,2vw,28px);height:clamp(22px,2vw,28px);display:grid;place-items:center}
  .nv-logo svg{width:100%;height:100%;fill:#c9a84c}
  .nv-sig{border:1px solid rgba(245,230,200,0.15);border-radius:20px;padding:3px 12px;background:rgba(255,255,255,0.04)}

  /* Hero text (left side, like :3003) */
  #hero-text{position:absolute;top:46%;left:clamp(30px,5vw,60px);transform:translateY(-50%);z-index:20;pointer-events:none;max-width:clamp(240px,30vw,440px);opacity:0;transition:opacity 1.2s ease 0.5s}
  #hero-text.show{opacity:1}
  .ht-title{font-family:'Noto Serif SC',serif;font-size:clamp(28px,5vw,64px);font-weight:700;color:#f5e6c8;line-height:1.1;letter-spacing:0.06em;margin:0 0 16px;text-shadow:0 2px 24px rgba(0,0,0,0.45)}
  .ht-divider{width:clamp(24px,3vw,40px);height:1.5px;background:rgba(245,230,200,0.35);margin:0 0 16px}
  .ht-line1{font-family:'Noto Serif SC',serif;font-size:clamp(16px,2vw,28px);color:#f5e6c8;line-height:1.3;margin:0 0 8px;letter-spacing:0.04em;text-shadow:0 2px 16px rgba(0,0,0,0.35)}
  .ht-line2{font-size:clamp(11px,1vw,14px);color:rgba(245,230,200,0.55);letter-spacing:0.06em}

  /* Scroll panels = :3003 world bg */
  .sp{position:absolute;top:0;height:100%;z-index:8;will-change:transform;pointer-events:none;width:50%;background-size:cover;background-position:center}
  #spl{left:0;transform-origin:left center;background-image:url('images/world-bg-ref.webp');background-position:right center}
  #spr{right:0;transform-origin:right center;background-image:url('images/world-bg-ref.webp');background-position:left center}
  .sb{position:absolute;left:0;right:0;height:12px;z-index:9;pointer-events:none;background:linear-gradient(180deg,rgba(180,155,120,0.12),transparent)}
  .sb.bt{bottom:0;background:linear-gradient(0deg,rgba(180,155,120,0.12),transparent)}

  #btnw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;text-align:center;pointer-events:auto;transition:opacity 0.5s}
  .btn{display:inline-block;font-family:'Noto Serif SC',serif;font-size:clamp(16px,1.8vw,22px);letter-spacing:0.2em;color:#f5e6c8;background:rgba(10,8,6,0.35);backdrop-filter:blur(12px);border:1.5px solid rgba(201,168,76,0.2);padding:16px 48px;border-radius:50px;cursor:pointer;transition:all 0.5s cubic-bezier(0.22,1,0.36,1);box-shadow:0 4px 30px rgba(0,0,0,0.4)}
  .btn:hover{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.35);transform:scale(1.05)}

  #ent{position:absolute;left:50%;top:65%;transform:translate(-50%,-50%);z-index:20;opacity:0;pointer-events:none;transition:opacity 0.8s ease 0.5s}
  #ent.show{opacity:1;pointer-events:auto}
  .eb{display:inline-block;font-family:'Noto Serif SC',serif;font-size:clamp(14px,1.5vw,18px);letter-spacing:0.18em;color:#f5e6c8;background:linear-gradient(135deg,#c9a84c,#e8c97a);padding:14px 48px;border-radius:50px;text-decoration:none;transition:all 0.5s cubic-bezier(0.22,1,0.36,1);box-shadow:0 4px 30px rgba(0,0,0,0.3)}
  .eb:hover{transform:scale(1.05);box-shadow:0 8px 40px rgba(201,168,76,0.2)}

  /* Bottom cards (:3003 style) */
  .hc{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);display:flex;gap:18px;z-index:20;opacity:0;transition:opacity 0.8s ease}
  .hc.show{opacity:1}
  .hc a{width:158px;height:158px;border-radius:28px;overflow:hidden;position:relative;display:block;background-size:cover;background-position:center;box-shadow:0 18px 50px rgba(0,0,0,0.45);text-decoration:none;transition:transform 0.4s cubic-bezier(0.22,1,0.36,1)}
  .hc a:hover{transform:translateY(-6px) scale(1.03)}
  .hc .cl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:20px 22px;background:linear-gradient(to top,rgba(0,0,0,0.72) 0%,rgba(0,0,0,0.18) 60%,transparent 100%);font-size:20px;letter-spacing:0.08em;font-weight:600;color:#f5e6c8;font-family:'Noto Serif SC',serif}
  .hc .cp{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.92);display:grid;place-items:center;color:#2a1808;flex:none}
  .hc .cp svg{width:12px;height:12px}
  .hc .cm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,2.6vw,34px);font-weight:600;line-height:1.15;background:linear-gradient(to top,rgba(0,0,0,0.6),transparent 70%);letter-spacing:0.06em;color:#f5e6c8;padding:20px;font-family:'Noto Serif SC',serif}

  #clk{position:absolute;top:40px;right:40px;z-index:25;text-align:right;opacity:0;transition:opacity 1s ease;pointer-events:auto}
  #clk.show{opacity:1}
  .ct{font-family:'Noto Serif SC',serif;font-size:clamp(16px,1.8vw,24px);font-weight:700;color:#f5e6c8;text-shadow:0 2px 16px rgba(0,0,0,0.4)}
  .cd{font-size:clamp(9px,0.7vw,11px);color:rgba(245,230,200,0.4);margin-top:2px}

  #vn{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:15;text-align:center;opacity:0;pointer-events:none;transition:opacity 1s ease 0.3s}
  #vn.show{opacity:1}
  .vt{font-family:'Noto Serif SC',serif;font-size:clamp(48px,10vw,100px);font-weight:900;color:#f5e6c8;text-shadow:0 4px 40px rgba(0,0,0,0.5);margin:0}
  .vt .hl{background:linear-gradient(135deg,#c9a84c,#e8c97a,#c9a84c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .vm{font-family:'Noto Serif SC',serif;font-size:clamp(14px,1.5vw,20px);font-weight:600;color:#c9a84c;letter-spacing:0.3em;text-shadow:0 2px 20px rgba(0,0,0,0.4);margin:6px 0 0}

  @media(max-width:767px){#clk{top:30px;right:16px}.btn{padding:12px 28px;font-size:14px}.eb{padding:10px 28px;font-size:13px}}
  </style>
</head>
<body>
<div id="stage">
  <div id="village" class="layer"></div>
  <div id="world" class="layer"></div>
  <div id="ref-portal"></div>
  <div id="overlay" class="layer"></div>

  <div id="spl" class="sp"><div class="sb"></div><div class="sb bt"></div></div>
  <div id="spr" class="sp"><div class="sb"></div><div class="sb bt"></div></div>

  <!-- Navigation (:3003 style) -->
  <nav>
    <div class="nv-l">
      <a href="pages/history.html">📜 历史</a>
      <a href="pages/genealogy.html">🌳 族谱</a>
    </div>
    <div class="nv-logo" aria-label="下枫槎">
      <svg viewBox="0 0 28 28"><path d="M14 2l2.09 6.42H23l-5.45 3.96L19.64 19 14 15.04 8.36 19l2.09-6.62L5 8.42h6.91L14 2z"/></svg>
    </div>
    <div class="nv-r">
      <a class="nv-sig" href="index.html">✦ 主站</a>
      <a href="pages/today.html">📸 今日</a>
      <a href="pages/activities.html">🎪 活动</a>
    </div>
  </nav>

  <!-- Hero text (left side, like :3003) -->
  <div id="hero-text">
    <div class="ht-title">宁海·下枫槎·谢氏</div>
    <div class="ht-divider"></div>
    <div class="ht-line1">帷幕徐启，流光穿隙</div>
    <div class="ht-line2">穿越光影之门</div>
  </div>

  <div id="btnw"><button class="btn" id="openBtn">✦ 探索下枫槎</button></div>

  <!-- Bottom cards (:3003 style) -->
  <div class="hc" id="hc">
    <a href="pages/genealogy.html" style="background-image:url('images/carousel/38.jpg')"><div class="cl"><span class="cp"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M3 2l7 4-7 4V2z"/></svg></span>族谱查询</div></a>
    <a href="pages/news.html" style="background-image:url('images/carousel/23.jpg')"><div class="cm">📰<br>消息发布</div></a>
    <a href="pages/audio.html" style="background-image:url('images/carousel/121.jpg')"><div class="cl"><span class="cp"><svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M3 2l7 4-7 4V2z"/></svg></span>听·下枫槎</div></a>
  </div>
  <div id="ent"><a class="eb" href="index.html">✦ 进入主站</a></div>
  <div id="clk"><div class="ct" id="ct"></div><div class="cd" id="cd"></div></div>
  <div id="vn"><h1 class="vt"><span class="hl">下枫槎</span></h1><div class="vm">乌衣世泽 · 宝树家声</div></div>
</div>

<script>
var v=document.getElementById('village'),w=document.getElementById('world'),pt=document.getElementById('ref-portal');
var sl=document.getElementById('spl'),sr=document.getElementById('spr');
var ct=document.getElementById('ct'),cd=document.getElementById('cd');
var vn=document.getElementById('vn'),ent=document.getElementById('ent');

v.style.backgroundImage="url('images/bg-left.png')";
w.style.backgroundImage="url('images/world-bg-ref.webp')";

function lerp(a,b,t){return a+(b-a)*t}
function clamp(v,m,M){return Math.max(m,Math.min(M,v))}
function eoc(t){return 1-Math.pow(1-t,3)}

sl.style.transform='translateX(0%)';sr.style.transform='translateX(0%)';
v.style.opacity=0;

!function u(){var n=new Date();ct.textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');cd.textContent=n.getFullYear()+'年'+(n.getMonth()+1)+'月'+n.getDate()+'日';setTimeout(u,10000)}();
setTimeout(function(){document.getElementById('clk').classList.add('show');document.getElementById('hero-text').classList.add('show');document.getElementById('hc').classList.add('show');},500);

// ── Mouse parallax + wheel zoom (like :3003 portal) ──
var rx=0,ry=0,cx=0,cy=0,isOpen=false,isAnim=false,portalZoom=1;
window.addEventListener('mousemove',function(e){rx=(e.clientX/window.innerWidth)*2-1;ry=(e.clientY/window.innerHeight)*2-1;});
window.addEventListener('wheel',function(e){if(!isOpen&&!isAnim){if(e.deltaY<0)portalZoom=clamp(portalZoom*1.07,1,6);else portalZoom=clamp(portalZoom*0.93,1,6);e.preventDefault();}},{passive:false});

!function tick(){
  cx=lerp(cx,rx,0.07);cy=lerp(cy,ry,0.07);
  if(!isAnim&&!isOpen){
    pt.style.transform='scale('+portalZoom+')';
    w.style.transform='translate3d('+(cx*6)+'px,'+(cy*6)+'px,0)';
  }
  if(isOpen){v.style.transform='translate3d('+(cx*4)+'px,'+(cy*4)+'px,0)';}
  requestAnimationFrame(tick);
}();

// ── Toggle open/close ──
document.getElementById('openBtn').addEventListener('click',function(){
  if(isAnim)return;isAnim=true;
  var dur=2200,st=Date.now(),opening=!isOpen;
  var ss=opening?0:50,ts=opening?50:0;
  !function an(){
    var el=Date.now()-st,t=Math.min(el/dur,1),e=eoc(t),sh=ss+(ts-ss)*e;
    sl.style.transform='translateX(-'+sh+'%)';sr.style.transform='translateX('+sh+'%)';
    if(opening){
      v.style.zIndex=11;v.style.opacity=e;v.style.transform='scale('+lerp(1.3,1.0,e)+')';
      pt.style.transform='scale('+lerp(1,8,e)+')';pt.style.opacity=1-e;
    } else {
      v.style.zIndex=0;v.style.opacity=1-e;v.style.transform='scale('+lerp(1.0,1.3,e)+')';
      pt.style.transform='scale('+lerp(8,1,e)+')';pt.style.opacity=e;
    }
    if(t<1) requestAnimationFrame(an);
    else {
      isOpen=opening;isAnim=false;
      if(opening){
        v.style.opacity=1;v.style.transform='scale(1)';pt.style.display='none';
        vn.classList.add('show');ent.classList.add('show');
        document.getElementById('openBtn').textContent='✦ 收起';
      } else {
        v.style.opacity=0;pt.style.display='';pt.style.opacity=1;pt.style.transform='none';
        w.style.transform='none';
        vn.classList.remove('show');ent.classList.remove('show');
        document.getElementById('openBtn').textContent='✦ 探索下枫槎';
      }
    }
  }();
});
</script>
</body>
</html>
